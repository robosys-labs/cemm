name: Agent R4 Task 5 verified publisher

on:
  push:
    branches:
      - agent/r4-export-checkout-20260816
    paths:
      - .github/workflows/agent-r4-task5-publisher.yml

permissions:
  contents: write

concurrency:
  group: agent-r4-task5-publisher-20260817
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout publisher envelope
        uses: actions/checkout@v4
        with:
          ref: agent/r4-export-checkout-20260816
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reassemble Task 4 transport in explicit order
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('.github/r4-task5-recovery')
          names = (
              'task4.00.0', 'task4.00.1', 'task4.00.2', 'task4.00.3',
              'task4.part.01',
              'task4.02.0', 'task4.02.1', 'task4.02.2', 'task4.02.3',
              'task4.03.0', 'task4.03.1', 'task4.03.2', 'task4.03.3',
          )
          data = b''.join((root / name).read_bytes() for name in names)
          print(f'task4 transport bytes={len(data)} sha256={sha256(data).hexdigest()}')
          (root / 'task4.xz.b64').write_bytes(data)
          PY
      - name: Verify, commit, and fast-forward Task 4 and Task 5
        run: python .github/r4-task5-recovery/publish_task5.py
