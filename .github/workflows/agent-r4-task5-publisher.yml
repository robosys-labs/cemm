name: Agent R4 Task 5 verified publisher

on:
  push:
    branches:
      - agent/r4-export-checkout-20260816
    paths:
      - .github/workflows/agent-r4-task5-publisher.yml

permissions:
  contents: write

concurrency:
  group: agent-r4-task5-publisher-20260817
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout publisher envelope
        uses: actions/checkout@v4
        with:
          ref: agent/r4-export-checkout-20260816
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reassemble exact Task 4 transport
        shell: bash
        run: cat .github/r4-task5-recovery/task4.part.* > .github/r4-task5-recovery/task4.xz.b64
      - name: Verify, commit, and fast-forward Task 4 and Task 5
        run: python .github/r4-task5-recovery/publish_task5.py
