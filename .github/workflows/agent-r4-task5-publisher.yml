name: Agent R4 Task 5 verified publisher

on:
  push:
    branches:
      - agent/r4-export-checkout-20260816
    paths:
      - .github/workflows/agent-r4-task5-publisher.yml

permissions:
  contents: write

concurrency:
  group: agent-r4-task5-publisher-20260817
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: agent/r4-task4-batch-publisher-20260816
      EXPECTED_HEAD: 56d233a63be57d9ef611d617a4cf7430826b2324
      TASK4_PATCH_SHA256: 4b419a98f651149a6e6c7c1dded1c8f538527540ac622661ac2efd78a4e38ed4
      TASK5_PATCH_SHA256: a90bab2d330cb84da5d460fcff85a2b16257768a8b25cea8fc1579bea79a078c
      PYTHONPATH: src
    steps:
      - name: Checkout authenticated publisher envelope
        uses: actions/checkout@v4
        with:
          ref: agent/r4-export-checkout-20260816
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruct and authenticate Task 4 and Task 5 patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import lzma
          from pathlib import Path

          root = Path('.github/r4-task5-recovery')
          specs = (
              ('task4', root / 'task4.xz.b64', '${{ env.TASK4_PATCH_SHA256 }}'),
              ('task5', root / 'task5.xz.b64', '${{ env.TASK5_PATCH_SHA256 }}'),
          )
          for name, path, expected in specs:
              encoded = b''.join(path.read_bytes().split())
              packed = base64.b64decode(encoded, validate=True)
              patch = lzma.decompress(packed, format=lzma.FORMAT_XZ)
              observed = hashlib.sha256(patch).hexdigest()
              if observed != expected:
                  raise SystemExit(f'{name} patch SHA-256 mismatch: {observed} != {expected}')
              if not patch.startswith(b'diff --git '):
                  raise SystemExit(f'{name} payload is not a Git patch')
              if b'\r' in patch:
                  raise SystemExit(f'{name} patch is not LF-normalized')
              output = Path('/tmp') / f'r4-{name}.patch'
              output.write_bytes(patch)
              print(f'{name}: bytes={len(patch)} sha256={observed}')
          PY

      - name: Checkout immutable target
        uses: actions/checkout@v4
        with:
          ref: agent/r4-task4-batch-publisher-20260816
          fetch-depth: 0
          clean: true

      - name: Assert immutable target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Install focused verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==8.4.0' 'jsonschema==4.25.1'

      - name: Apply and verify recovered Task 4 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/r4-task4.patch
          git apply /tmp/r4-task4.patch
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
              'hybrid_mvp/artifacts/validation/R4_PARTITION_FEASIBILITY.json',
              'hybrid_mvp/artifacts/validation/R4_PARTITION_FEASIBILITY_BASIS.json',
              'hybrid_mvp/configs/r4_partitions.json',
              'hybrid_mvp/scripts/analyze_r4_partition_feasibility.py',
              'hybrid_mvp/scripts/publish_r4_feasibility_basis.py',
              'hybrid_mvp/src/cemm_authoritative_hybrid/r4_partitions.py',
              'hybrid_mvp/tests/test_publish_r4_feasibility_basis.py',
              'hybrid_mvp/tests/test_r4_partition_global_assignment.py',
          }
          rows = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          observed = {row[3:].split(' -> ', 1)[-1] for row in rows}
          if observed != allowed:
              raise SystemExit(f'Task 4 scope mismatch: {sorted(observed ^ allowed)}')
          PY
          cd hybrid_mvp
          PYTHONPATH=src python -m pytest \
            tests/test_r4_partition_contracts.py \
            tests/test_r4_partition_global_assignment.py \
            tests/test_publish_r4_feasibility_basis.py \
            -q -p no:cacheprovider
          PYTHONPATH=src python scripts/analyze_r4_partition_feasibility.py \
            --basis --check artifacts/validation/R4_PARTITION_FEASIBILITY_BASIS.json
          PYTHONPATH=src python scripts/analyze_r4_partition_feasibility.py \
            --final --check artifacts/validation/R4_PARTITION_FEASIBILITY.json
          PYTHONPATH=src python scripts/check_test_inventory.py --phase R4 --source-only
          PYTHONPATH=src python scripts/check_test_inventory.py --phase R5 --source-only
          cd ..
          git diff --check

      - name: Commit recovered Task 4 checkpoint
        id: task4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            hybrid_mvp/artifacts/validation/R4_PARTITION_FEASIBILITY.json \
            hybrid_mvp/artifacts/validation/R4_PARTITION_FEASIBILITY_BASIS.json \
            hybrid_mvp/configs/r4_partitions.json \
            hybrid_mvp/scripts/analyze_r4_partition_feasibility.py \
            hybrid_mvp/scripts/publish_r4_feasibility_basis.py \
            hybrid_mvp/src/cemm_authoritative_hybrid/r4_partitions.py \
            hybrid_mvp/tests/test_publish_r4_feasibility_basis.py \
            hybrid_mvp/tests/test_r4_partition_global_assignment.py
          git diff --cached --check
          git commit -m 'feat(r4): reconstruct leakage feasibility'
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

      - name: Apply and verify Task 5 deterministic assignment
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/r4-task5.patch
          git apply /tmp/r4-task5.patch
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
              'hybrid_mvp/src/cemm_authoritative_hybrid/r4_partitions.py',
              'hybrid_mvp/src/cemm_authoritative_hybrid/r4_partition_verify.py',
              'hybrid_mvp/tests/test_r4_partition_global_assignment.py',
              'hybrid_mvp/tests/test_r4_mutations_and_partitions.py',
          }
          rows = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          observed = {row[3:].split(' -> ', 1)[-1] for row in rows}
          if observed != allowed:
              raise SystemExit(f'Task 5 scope mismatch: {sorted(observed ^ allowed)}')
          PY
          cd hybrid_mvp
          PYTHONPATH=src python -m pytest \
            tests/test_r4_partition_global_assignment.py \
            tests/test_r4_mutations_and_partitions.py \
            -q -p no:cacheprovider
          PYTHONPATH=src python scripts/analyze_r4_partition_feasibility.py \
            --basis --output /tmp/R4_PARTITION_FEASIBILITY_BASIS_TASK5.json
          PYTHONPATH=src python scripts/publish_r4_feasibility_basis.py \
            --candidate /tmp/R4_PARTITION_FEASIBILITY_BASIS_TASK5.json \
            --config configs/r4_partitions.json \
            --current artifacts/validation/R4_PARTITION_FEASIBILITY_BASIS.json
          PYTHONPATH=src python scripts/analyze_r4_partition_feasibility.py \
            --basis --check artifacts/validation/R4_PARTITION_FEASIBILITY_BASIS.json
          PYTHONPATH=src python scripts/analyze_r4_partition_feasibility.py \
            --final --check artifacts/validation/R4_PARTITION_FEASIBILITY.json
          PYTHONPATH=src python -m pytest tests/test_r4_partition_contracts.py -q -p no:cacheprovider
          PYTHONPATH=src python scripts/check_test_inventory.py --phase R4 --source-only
          PYTHONPATH=src python scripts/check_test_inventory.py --phase R5 --source-only
          cd ..
          git diff --check
          test -z "$(git status --porcelain -- \
            hybrid_mvp/artifacts/validation/R4_PARTITION_FEASIBILITY_BASIS.json \
            hybrid_mvp/artifacts/validation/R4_PARTITION_FEASIBILITY.json \
            hybrid_mvp/configs/r4_partitions.json)"

      - name: Commit Task 5 assignment and independent verifier
        id: task5
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            hybrid_mvp/src/cemm_authoritative_hybrid/r4_partitions.py \
            hybrid_mvp/src/cemm_authoritative_hybrid/r4_partition_verify.py \
            hybrid_mvp/tests/test_r4_partition_global_assignment.py \
            hybrid_mvp/tests/test_r4_mutations_and_partitions.py
          git diff --cached --check
          git commit -m 'feat(r4): assign globally sealed data classes'
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

      - name: Record Task 4 and Task 5 checkpoint
        id: docs
        shell: bash
        env:
          TASK4_SHA: ${{ steps.task4.outputs.sha }}
          TASK5_SHA: ${{ steps.task5.outputs.sha }}
        run: |
          set -euo pipefail
          cd hybrid_mvp
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          path = Path('docs/superpowers/progress/2026-08-14-r4-partition-corrective-replay-progress.md')
          text = path.read_text('utf-8')
          t4 = os.environ['TASK4_SHA']
          t5 = os.environ['TASK5_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', t4) or not re.fullmatch(r'[0-9a-f]{40}', t5):
              raise SystemExit('invalid implementation SHA')
          basis = json.loads(Path('artifacts/validation/R4_PARTITION_FEASIBILITY_BASIS.json').read_text('utf-8'))
          final = json.loads(Path('artifacts/validation/R4_PARTITION_FEASIBILITY.json').read_text('utf-8'))

          replacements = {
              '- [ ] Preserve every exact protected identity across all seven axes as a\n  namespaced leakage hyperedge.': '- [x] Preserve every exact protected identity across all seven axes as a\n  namespaced leakage hyperedge.',
              '- [ ] Reject sentinel/coarse categorical union keys.': '- [x] Reject sentinel/coarse categorical union keys.',
              '- [ ] Implement deterministic global component assignment.': '- [x] Implement deterministic global component assignment.',
              '- [ ] Implement independent verifier reconstruction.': '- [x] Implement independent verifier reconstruction.',
              '- [ ] Generate feasibility report before freezing thresholds.': '- [x] Generate feasibility report before freezing thresholds.',
              '- [ ] Preserve the acyclic basis → config → final receipt identity graph; changed basis refs stop for amended review.': '- [x] Preserve the acyclic basis → config → final receipt identity graph; changed basis refs stop for amended review.',
              '- [ ] Review exact positive minimum counts.': '- [x] Review exact positive minimum counts.',
              '- [ ] Require support and feasible-component denominators.': '- [x] Require support and feasible-component denominators.',
              '- [ ] Require held-out coverage across configured dimensions.': '- [x] Require held-out coverage across configured dimensions.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing tracker checklist line: {old}')
              text = text.replace(old, new, 1)

          log_anchor = '| 2026-08-14 | `codex/r4-partition-corrective-replay@b9efaba3a05dea0006b74d882671a98fd5f1547e` | Strict R4 partition, sufficiency, config, capability, and authorization contracts registered | Contract/schema/inventory suites passed; owner and phase tiers remained correctly governance-blocked by the deliberate R4-red ledger state |'
          if log_anchor not in text:
              raise SystemExit('publication log anchor missing')
          rows = (
              f"\n| 2026-08-17 | `agent/r4-task4-batch-publisher-20260816@{t4}` | Read-only seven-axis leakage feasibility checkpoint reconstructed | 400 sources; {basis['hyperedge_count']} exact hyperedges; {basis['label_count']} labels; {basis['component_count']} components; largest {basis['largest_component_count']}; basis/config/final identities check |"
              f"\n| 2026-08-17 | `agent/r4-task4-batch-publisher-20260816@{t5}` | Deterministic four-class assignment and independent reconstruction completed | Whole-component assignment, permutation determinism, split-tamper rejection, giant-component infeasibility, equal-only feasibility publisher, R4/R5 inventory checks passed |"
          )
          text = text.replace(log_anchor, log_anchor + rows, 1)

          checkpoint = re.compile(
              r'## 11\. Current checkpoint\n\n.*?\n\n## 12\. Exact invalidation evidence',
              re.S,
          )
          replacement = f'''## 11. Current checkpoint

**Current work:** P5 in progress; Task 5 deterministic four-class assignment and independent verification are complete at `{t5}`.
**Task 4 feasibility identities:** graph `{basis['graph_ref']}`; basis `{basis['feasibility_basis_ref']}`; witness `{basis['minima_witness_ref']}`; config `{final['config_ref']}`; final `{final['receipt_ref']}`.
**Next required action:** Task 6 cuts Build Receipt ABI 4 and prepares deterministic temporary four-class generated fixtures.
**Implementation authorization:** Task 6 source/schema/test work is authorized; checked-in replacement R4 artifacts, re-admission, and neural training remain blocked.
**R5 neural work:** blocked on authentic R4 re-admission.

## 12. Exact invalidation evidence'''
          text, count = checkpoint.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('current checkpoint replacement failed')
          path.write_text(text, encoding='utf-8')
          PY
          PYTHONPATH=src python scripts/check_test_inventory.py --phase R4 --source-only
          PYTHONPATH=src python scripts/check_test_inventory.py --phase R5 --source-only
          git diff --check
          cd ..
          git add -- hybrid_mvp/docs/superpowers/progress/2026-08-14-r4-partition-corrective-replay-progress.md
          git diff --cached --check
          git commit -m 'docs(r4): record global assignment checkpoint'
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

      - name: Final clean candidate verification
        shell: bash
        env:
          TASK4_SHA: ${{ steps.task4.outputs.sha }}
          TASK5_SHA: ${{ steps.task5.outputs.sha }}
          DOCS_SHA: ${{ steps.docs.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "$TASK4_SHA"
          test "$(git rev-parse HEAD^)" = "$TASK5_SHA"
          test "$(git rev-parse HEAD)" = "$DOCS_SHA"
          test "$(git merge-base "$EXPECTED_HEAD" HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git diff --check "$EXPECTED_HEAD"..HEAD
          cd hybrid_mvp
          PYTHONPATH=src python scripts/analyze_r4_partition_feasibility.py \
            --basis --check artifacts/validation/R4_PARTITION_FEASIBILITY_BASIS.json
          PYTHONPATH=src python scripts/analyze_r4_partition_feasibility.py \
            --final --check artifacts/validation/R4_PARTITION_FEASIBILITY.json
          PYTHONPATH=src python scripts/update_replay_status.py --verify-chain | tee /tmp/r4-task5-replay-chain.txt
          grep -Eq 'R4[^A-Za-z0-9]+red|R4=red|"R4"[^A-Za-z]+"red"' /tmp/r4-task5-replay-chain.txt
          cd ..
          test "$(git rev-parse "$EXPECTED_HEAD:hybrid_mvp/governance/replay_status.jsonl")" = \
               "$(git rev-parse "HEAD:hybrid_mvp/governance/replay_status.jsonl")"
          test "$(git rev-parse "$EXPECTED_HEAD:hybrid_mvp/artifacts/r4")" = \
               "$(git rev-parse "HEAD:hybrid_mvp/artifacts/r4")"

      - name: Publish three reviewed fast-forward checkpoints
        shell: bash
        env:
          TASK4_SHA: ${{ steps.task4.outputs.sha }}
          TASK5_SHA: ${{ steps.task5.outputs.sha }}
          DOCS_SHA: ${{ steps.docs.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_HEAD"

          git push origin "$TASK4_SHA:refs/heads/$TARGET_BRANCH"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$TASK4_SHA"

          git push origin "$TASK5_SHA:refs/heads/$TARGET_BRANCH"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$TASK5_SHA"

          git push origin "$DOCS_SHA:refs/heads/$TARGET_BRANCH"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$DOCS_SHA"

          printf 'Task 4: %s\nTask 5: %s\nDocs: %s\n' "$TASK4_SHA" "$TASK5_SHA" "$DOCS_SHA" | tee /tmp/r4-task5-published.txt
