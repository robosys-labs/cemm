name: Agent R4 Task 5 verified publisher

on:
  push:
    branches:
      - agent/r4-export-checkout-20260816
    paths:
      - .github/workflows/agent-r4-task5-publisher.yml

permissions:
  contents: write

concurrency:
  group: agent-r4-task5-publisher-20260817
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout publisher envelope
        uses: actions/checkout@v4
        with:
          ref: agent/r4-export-checkout-20260816
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Authenticate and reassemble Task 4 transport
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('.github/r4-task5-recovery')
          expected = (
              ('task4.00.0', '0768010ef82d3f3289383d8f20a598f2ce3d9380e1899a904af43cdd4710d2a2'),
              ('task4.00.1', '32ec659c3a6f3a80324061f302f5b4a0bfce83b761d24b1be078ba3f0f832ee7'),
              ('task4.00.2', '71f475a90e49537e497cb13f742265fdefa48e9fd998bfe95103bb9102f31896'),
              ('task4.00.3a', 'a5d6e3d3fc0ca71af79488b830db20dc1b99ec486c0264ddc25e678e3cc2ffa0'),
              ('task4.00.3b', '4a71e4eb14a606a9f12f8c20c868349c82d97605726626795ce050c5b0ba93ba'),
              ('task4.part.01', 'cc247d9143d5e79f786c20fd8f020e091ed0e97b94a7022399897e119e8e6134'),
              ('task4.02.0', '9c5f3caad8042aa4130ddb3b5eee5d0ef90389ee289f5a38de60eba44f3fd116'),
              ('task4.02.1a', '1cc6c77c419b6b8eeaf7d2bac0969d72686e49154c24ad41d6649409f64c5bc5'),
              ('task4.02.1b', '3f785a3317bc6a1b107ce338b43a2d61e1f845a07a8ffc9f7a437b1affb19940'),
              ('task4.02.2', '9e00c806c38f80f631910deb0ee6a29ebd5212f1046d229860a403015f8cbbde'),
              ('task4.02.3', '041a2f353438880c010add43f383303df668535f350073333cd3daf26c9d5641'),
              ('task4.03.0', 'e58847995ba8bcd8013ad7aec05d42a31ec1685362fa29d7a4fdf59e6e806140'),
              ('task4.03.1', 'a76f002a98df16976228ff5624641ffcea8d017732f129908a7c68413f270ace'),
              ('task4.03.2', '1f91ac221be45e98080319d48a372b535f51931f7271c5e4839b3ccc7af03f5c'),
              ('task4.03.3', '5a8eef0a078119004ffec372a7c1673affb12109cd172d283532c7e149eeaae0'),
          )
          chunks = []
          mismatches = []
          for name, digest in expected:
              payload = (root / name).read_bytes()
              observed = sha256(payload).hexdigest()
              print(f'{name}: bytes={len(payload)} sha256={observed}')
              if observed != digest:
                  mismatches.append((name, observed, digest))
              chunks.append(payload)
          if mismatches:
              for name, observed, digest in mismatches:
                  print(f'MISMATCH {name}: {observed} != {digest}')
              raise SystemExit(f'{len(mismatches)} Task 4 transport chunks mismatch')
          data = b''.join(chunks)
          observed = sha256(data).hexdigest()
          print(f'task4 aggregate: bytes={len(data)} sha256={observed}')
          if len(data) != 30384 or observed != 'a4eabfd5480ce9df928aff3218c83583b4e87634a785ce9d3770808db470e73d':
              raise SystemExit('Task 4 aggregate transport mismatch')
          (root / 'task4.xz.b64').write_bytes(data)
          PY
      - name: Verify, commit, and fast-forward Task 4 and Task 5
        run: python .github/r4-task5-recovery/publish_task5.py
