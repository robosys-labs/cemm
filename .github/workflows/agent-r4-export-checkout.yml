name: Agent R4 export checkout

on:
  push:
    branches:
      - agent/r4-export-checkout-20260816
    paths:
      - .github/workflows/agent-r4-export-checkout.yml

permissions:
  contents: read

concurrency:
  group: agent-r4-export-checkout-20260816
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-export-checkout-20260816
          fetch-depth: 0
          persist-credentials: false
      - name: Package all remaining Task 4 staging branches
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p /tmp/r4-task4-staging
          for branch in \
            agent/r4-task4-publish-20260815 \
            codex/r4-task4-feasibility \
            codex/r4-task4-snapshot
          do
            safe="${branch//\//__}"
            git rev-parse "origin/$branch" > "/tmp/r4-task4-staging/$safe.commit"
            git archive --format=tar.gz \
              --output="/tmp/r4-task4-staging/$safe.tgz" \
              "origin/$branch"
          done
          (cd /tmp/r4-task4-staging && sha256sum *.tgz > SHA256SUMS)
      - name: Upload staging branch archives
        uses: actions/upload-artifact@v4
        with:
          name: cemm-r4-task4-staging-branches
          retention-days: 1
          if-no-files-found: error
          path: /tmp/r4-task4-staging/
