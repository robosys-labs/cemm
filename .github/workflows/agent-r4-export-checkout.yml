name: Agent R4 Task 7 authenticated hard-cut publisher

on:
  push:
    branches:
      - agent/r4-export-checkout-20260816
    paths:
      - .github/workflows/agent-r4-export-checkout.yml

permissions:
  contents: write

concurrency:
  group: agent-r4-task7-registered-helper-20260818
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-task7-training-hardcut-verified-20260818
          path: work
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-export-checkout-20260816
          path: helper
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Authenticate and apply reviewed patch
        run: |
          set -euo pipefail
          test "$(git -C work rev-parse HEAD)" = 'c1346377e9a2d52c8a1f62deeea47524dd252a96'
          test "$(sha256sum helper/.github/r4-task7/hardcut.patch.gz.b64 | awk '{print $1}')" = '31093ab3f93c29d5c071e482e595b0f9557bb90b54728a4ebd5da66c3482be08'
          base64 -d helper/.github/r4-task7/hardcut.patch.gz.b64 | gzip -d > /tmp/task7-hardcut.patch
          test "$(sha256sum /tmp/task7-hardcut.patch | awk '{print $1}')" = 'c78917c44fc487c8d90fa2cb236754c696e447af75fac898e03862154f3206b6'
          git -C work apply --check /tmp/task7-hardcut.patch
          git -C work apply /tmp/task7-hardcut.patch
          git -C work diff --check
          printf '%s\n' \
            hybrid_mvp/src/cemm_authoritative_hybrid/training.py \
            hybrid_mvp/tests/test_r5_data_isolation.py | sort > /tmp/expected
          git -C work diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
      - name: Install governed dependencies
        run: |
          set -euo pipefail
          python -m pip install 'pytest==8.4.0' 'numpy==2.5.2' 'safetensors==0.5.3'
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - id: verify
        name: Verify exact hard-cut candidate
        continue-on-error: true
        working-directory: work/hybrid_mvp
        env:
          PYTHONPATH: src:scripts:.
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python scripts/verify_r3_r4_test_metadata.py
            python -m py_compile src/cemm_authoritative_hybrid/training.py tests/test_r5_data_isolation.py
            python -m pytest \
              tests/test_r5_data_isolation.py \
              tests/test_r4_training_partition_boundary.py \
              tests/test_r4_release_training.py \
              tests/test_r5_foundation.py \
              -q -p no:cacheprovider
            python scripts/check_test_inventory.py --phase R4 --source-only
            python scripts/check_test_inventory.py --phase R5 --source-only
            python scripts/check_r3_r4_structure.py
            ! grep -nE '_TRAIN_PARTITION|_PARTITION_MANIFEST|load_partition_episodes_for_training|_check_partition_access|cemm_authoritative_hybrid\.partitions|from \.partitions' src/cemm_authoritative_hybrid/training.py
            ! grep -nE 'cemm_authoritative_hybrid\.partitions|load_partition_episodes_for_training' tests/test_r5_data_isolation.py
            git diff --check
            test -z "$(git status --short -- artifacts/r4)"
          } 2>&1 | tee /tmp/training-hardcut.log
      - name: Commit and push exact verified hard-cut
        if: steps.verify.outcome == 'success'
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- hybrid_mvp/src/cemm_authoritative_hybrid/training.py hybrid_mvp/tests/test_r5_data_isolation.py
          git diff --cached --check
          git commit -m 'refactor(r5): remove legacy training partition authority'
          git push origin HEAD:refs/heads/agent/r4-task7-training-hardcut-verified-20260818
      - name: Record outcome
        if: always()
        env:
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          SOURCE="$(git -C work rev-parse HEAD)"
          git clone --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status-repo
          cd status-repo
          git checkout agent/r4-export-checkout-20260816
          mkdir -p .github/r4-task7-status
          printf '{"training_hardcut":"%s","source":"%s"}\n' "$OUTCOME" "$SOURCE" > .github/r4-task7-status/training-hardcut.json
          cp /tmp/training-hardcut.log .github/r4-task7-status/training-hardcut.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/r4-task7-status/training-hardcut.json .github/r4-task7-status/training-hardcut.log
          git commit -m 'ci(r5): record authenticated training hard-cut'
          git push origin HEAD:refs/heads/agent/r4-export-checkout-20260816

