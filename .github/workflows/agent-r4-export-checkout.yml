name: Agent R4 export checkout

on:
  push:
    branches:
      - agent/r4-export-checkout-20260816
    paths:
      - .github/workflows/agent-r4-export-checkout.yml

permissions:
  contents: write

concurrency:
  group: agent-r4-export-checkout-20260816
  cancel-in-progress: false

jobs:
  publish-task6-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-task4-batch-publisher-20260816
          fetch-depth: 0
      - name: Record verified Task 6 checkpoint
        run: |
          set -euo pipefail
          EXPECTED='e53dd76dbf246ba7af30c564899d8c711e457177'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python - <<'PY'
          from pathlib import Path

          path = Path('hybrid_mvp/docs/superpowers/progress/2026-08-14-r4-partition-corrective-replay-progress.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '**Working branch:** `codex/r4-partition-corrective-replay`': '**Working branch:** `agent/r4-task4-batch-publisher-20260816`',
              '**Remote target:** `origin/codex/r4-partition-corrective-replay`': '**Remote target:** `origin/agent/r4-task4-batch-publisher-20260816`',
              '| P5 | Partition ABI and algorithm implementation | in_progress | RED corruption/feasibility tests | Global assignment and independent reconstruction green |': '| P5 | Partition ABI and algorithm implementation | complete | RED corruption/feasibility tests | Global assignment, Build Receipt ABI 4, temporary candidate generation, and independent reconstruction green |',
              '- [ ] Define Build Receipt ABI 4 exact artifact identities.': '- [x] Define Build Receipt ABI 4 exact artifact identities.',
              '- [ ] Reject every ABI 2 training allowlist and ABI 3 build receipt as current input.': '- [x] Reject every ABI 2 training allowlist and ABI 3 build receipt as current input.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'checkpoint anchor count {count}: {old}')
              text = text.replace(old, new, 1)

          section_anchor = '## 6. Detailed implementation checklist\n'
          checkpoint = '''### Task 6 verified source checkpoint — 2026-08-18\n\n- Source commit published to the corrective target: `e53dd76dbf246ba7af30c564899d8c711e457177` (`feat(r4): generate four-class partition evidence`).\n- Final verification snapshot: `3c5e9f3fd8e820b47505b1b76266f3118a0c7231`; its tree is exactly the tree published by the clean source commit.\n- Governed source/tests/inventory passed on the frozen snapshot.\n- Two independent temporary ABI 4 candidate trees were byte-identical, covered all 400 authentic episodes across four nonempty classes, and both passed independent candidate admission reconstruction.\n- Historical checked-in `artifacts/r4/**` remain unchanged invalidated ABI 3 evidence; no replacement artifact tree or R4 green admission is claimed here.\n- Next authorized source tranche is Task 7: migrate the active R5 train-only capability boundary and hard-cut legacy partition authority.\n\n'''
          if '### Task 6 verified source checkpoint — 2026-08-18' not in text:
              if text.count(section_anchor) != 1:
                  raise SystemExit('detailed checklist anchor missing or duplicated')
              text = text.replace(section_anchor, checkpoint + section_anchor, 1)

          log_heading = '## 10. Publication log\n'
          row = '| 2026-08-18 | `agent/r4-task4-batch-publisher-20260816@e53dd76dbf246ba7af30c564899d8c711e457177` | Task 6 Build Receipt ABI 4 and temporary four-class candidate generation source published | Governed source/tests/inventory green; two temporary candidate trees byte-identical and independently admitted; checked-in R4 artifacts unchanged |\n'
          if row not in text:
              start = text.find(log_heading)
              if start < 0:
                  raise SystemExit('publication log heading missing')
              table = text.find('| Date | Branch/commit | Event | Verification |', start)
              sep = text.find('\n', text.find('\n', table) + 1) + 1
              if table < 0 or sep <= 0:
                  raise SystemExit('publication log table header missing')
              text = text[:sep] + row + text[sep:]

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- hybrid_mvp/docs/superpowers/progress/2026-08-14-r4-partition-corrective-replay-progress.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- hybrid_mvp/docs/superpowers/progress/2026-08-14-r4-partition-corrective-replay-progress.md
          git commit -m 'docs(r4): record Task 6 candidate checkpoint'
          git push origin HEAD:refs/heads/agent/r4-task4-batch-publisher-20260816
