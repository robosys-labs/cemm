name: Agent R4 export checkout

on:
  push:
    branches:
      - agent/r4-export-checkout-20260816
    paths:
      - .github/workflows/agent-r4-export-checkout.yml

permissions:
  contents: write

concurrency:
  group: agent-r4-export-checkout-20260816
  cancel-in-progress: false

jobs:
  verify-task7-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d6d7ee32edcfa6e172b7a2f06f346556d21a3ac
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile and adversarially verify train-capability loader
        working-directory: hybrid_mvp
        env:
          PYTHONPATH: src:scripts:.
        run: |
          set -euo pipefail
          python -m py_compile src/cemm_authoritative_hybrid/r4_partition_access.py
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import tempfile

          from cemm_authoritative_hybrid.r4_partition_access import (
              AuthenticatedClassSnapshot,
              PartitionAccessError,
              load_r4_train_episodes,
          )
          from cemm_authoritative_hybrid.r4_partition_contracts import (
              R4ClassAuthorization,
              R4ClassCapability,
          )

          SOURCE = Path('artifacts/r4/episodes.jsonl')
          first = next(line for line in SOURCE.read_bytes().splitlines() if line)
          row = json.loads(first)
          episode_ref = row['episode_ref']
          payload = first + b'\n'
          revision = '9d6d7ee32edcfa6e172b7a2f06f346556d21a3ac'

          def build(root: Path):
              payload_path = root / 'artifacts/r4/splits/train.jsonl'
              capability_path = root / 'artifacts/r4/capabilities/train.json'
              authorization_path = root / 'artifacts/r4/authorizations/train.json'
              for path in (payload_path, capability_path, authorization_path):
                  path.parent.mkdir(parents=True, exist_ok=True)
              payload_path.write_bytes(payload)
              capability = R4ClassCapability.create(
                  purpose='training',
                  split='train',
                  payload_path='artifacts/r4/splits/train.jsonl',
                  payload_sha256=hashlib.sha256(payload).hexdigest(),
                  payload_count=1,
                  source_set_ref='source_set:test',
                  split_manifest_ref='split_manifest:test',
              )
              capability_raw = capability.to_json_bytes()
              capability_path.write_bytes(capability_raw)
              authorization = R4ClassAuthorization.create(
                  purpose='training',
                  expected_capability_ref=capability.capability_ref,
                  expected_capability_sha256=hashlib.sha256(capability_raw).hexdigest(),
                  artifact_graph_ref='r4_artifact_graph_v4:test',
                  generator_source_revision=revision,
                  authority_generation='authority-v1-2026-07-29',
              )
              authorization_raw = authorization.to_json_bytes()
              authorization_path.write_bytes(authorization_raw)
              return authorization_path, capability_path, payload_path, authorization, authorization_raw

          with tempfile.TemporaryDirectory(prefix='r4-task7-access-') as temp:
              root = Path(temp)
              auth_path, cap_path, payload_path, auth, auth_raw = build(root)
              expected_sha = hashlib.sha256(auth_raw).hexdigest()
              batch = load_r4_train_episodes(
                  'artifacts/r4/authorizations/train.json',
                  'artifacts/r4/capabilities/train.json',
                  root,
                  expected_authorization_ref=auth.authorization_ref,
                  expected_authorization_sha256=expected_sha,
              )
              assert [episode.episode_ref for episode in batch.episodes] == [episode_ref]
              assert type(batch.snapshot) is AuthenticatedClassSnapshot
              assert batch.snapshot.payload_bytes == payload
              assert batch.snapshot.episode_count == 1
              assert batch.authorization_ref == auth.authorization_ref
              assert batch.artifact_graph_ref == 'r4_artifact_graph_v4:test'

              # External authorization trust must fail before capability access.
              cap_path.unlink()
              try:
                  load_r4_train_episodes(
                      auth_path,
                      root / 'artifacts/r4/capabilities/train.json',
                      root,
                      expected_authorization_ref=auth.authorization_ref,
                      expected_authorization_sha256='0' * 64,
                  )
              except PartitionAccessError as exc:
                  assert 'authorization SHA' in str(exc)
              else:
                  raise AssertionError('wrong external authorization SHA was accepted')
              cap_path.parent.mkdir(parents=True, exist_ok=True)
              _, _, _, _, _ = build(root)

              # Legacy and sibling/copy paths are rejected before reading payload bytes.
              legacy = root / 'data/partitions/train.jsonl'
              legacy.parent.mkdir(parents=True)
              legacy.write_bytes(payload)
              for bad_auth, bad_cap in (
                  ('data/partitions/train.jsonl', 'artifacts/r4/capabilities/train.json'),
                  ('artifacts/r4/authorizations/train.json', 'data/partitions/train.jsonl'),
              ):
                  try:
                      load_r4_train_episodes(
                          bad_auth, bad_cap, root,
                          expected_authorization_ref=auth.authorization_ref,
                          expected_authorization_sha256=expected_sha,
                      )
                  except PartitionAccessError:
                      pass
                  else:
                      raise AssertionError('legacy path was accepted')

              copied = root / 'copied-capability.json'
              shutil.copyfile(root / 'artifacts/r4/capabilities/train.json', copied)
              try:
                  load_r4_train_episodes(
                      'artifacts/r4/authorizations/train.json', copied, root,
                      expected_authorization_ref=auth.authorization_ref,
                      expected_authorization_sha256=expected_sha,
                  )
              except PartitionAccessError:
                  pass
              else:
                  raise AssertionError('copied capability was accepted')

              # A payload mutation after capability minting must fail closed.
              payload_path.write_bytes(payload + payload)
              try:
                  load_r4_train_episodes(
                      'artifacts/r4/authorizations/train.json',
                      'artifacts/r4/capabilities/train.json',
                      root,
                      expected_authorization_ref=auth.authorization_ref,
                      expected_authorization_sha256=expected_sha,
                  )
              except PartitionAccessError as exc:
                  assert 'payload SHA' in str(exc)
              else:
                  raise AssertionError('mutated payload was accepted')

          print('Task 7 train-capability access smoke: PASS')
          PY
          git diff --check

  record:
    if: always()
    needs: verify-task7-access
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-export-checkout-20260816
          fetch-depth: 0
      - name: Record Task 7 access outcome
        env:
          RESULT: ${{ needs.verify-task7-access.result }}
        run: |
          set -euo pipefail
          mkdir -p .github/r4-task7-status
          printf '{"access":"%s","source":"%s"}\n' "$RESULT" '9d6d7ee32edcfa6e172b7a2f06f346556d21a3ac' > .github/r4-task7-status/access.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/r4-task7-status/access.json
          git commit -m 'ci(r4): record Task 7 access verification'
          git push origin HEAD:refs/heads/agent/r4-export-checkout-20260816
