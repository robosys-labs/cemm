name: Agent R4 export checkout

on:
  push:
    branches:
      - agent/r4-export-checkout-20260816
    paths:
      - .github/workflows/agent-r4-export-checkout.yml

permissions:
  contents: write

concurrency:
  group: agent-r4-export-checkout-20260816
  cancel-in-progress: false

jobs:
  governed:
    name: Task 6 governed source and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-task6-finalcheck-20260818
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==8.4.0' 'jsonschema==4.25.1'
      - name: Verify governed Task 6 source
        working-directory: hybrid_mvp
        env:
          PYTHONPATH: src:scripts:.
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '3c5e9f3fd8e820b47505b1b76266f3118a0c7231'
          python -m py_compile \
            src/cemm_authoritative_hybrid/r4_pipeline.py \
            src/cemm_authoritative_hybrid/r4_admission.py \
            src/cemm_authoritative_hybrid/r4_partition_contracts.py \
            scripts/build_r4_artifacts.py \
            scripts/validation_gate.py
          python scripts/verify_r3_r4_test_metadata.py
          python -m pytest \
            tests/test_r4_admission.py \
            tests/test_r4_authentic_episodes.py \
            tests/test_r4_partition_global_assignment.py \
            tests/test_r4_validation_gate.py \
            -q -p no:cacheprovider
          python scripts/check_r3_r4_structure.py
          python scripts/check_test_inventory.py --phase R4 --source-only
          python scripts/check_test_inventory.py --phase R5 --source-only
          git diff --check
          test -z "$(git status --short -- artifacts/r4)"

  candidate-ab:
    name: Task 6 authentic deterministic A/B candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-task6-finalcheck-20260818
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact governed runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install \
            'pytest==8.4.0' \
            'hypothesis==6.163.0' \
            'numpy==2.5.2' \
            'safetensors==0.5.3' \
            'fastapi==0.115.0' \
            'httpx==0.27.0' \
            'jsonschema==4.25.1'
          python -m pip install 'torch==2.6.0' \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Build, compare, and independently admit A/B candidates
        working-directory: hybrid_mvp
        env:
          PYTHONPATH: src:scripts:.
        run: |
          set -euo pipefail
          REVISION="$(git rev-parse HEAD)"
          test "$REVISION" = '3c5e9f3fd8e820b47505b1b76266f3118a0c7231'
          rm -rf /tmp/r4-task6-final-a /tmp/r4-task6-final-b
          python scripts/build_r4_artifacts.py \
            --environment src/cemm_authoritative_hybrid/r4_environment.py \
            --source-revision "$REVISION" \
            --output /tmp/r4-task6-final-a > /tmp/r4-task6-final-a.log
          python scripts/build_r4_artifacts.py \
            --environment src/cemm_authoritative_hybrid/r4_environment.py \
            --source-revision "$REVISION" \
            --output /tmp/r4-task6-final-b > /tmp/r4-task6-final-b.log
          diff -qr /tmp/r4-task6-final-a /tmp/r4-task6-final-b
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          from cemm_authoritative_hybrid.r4_admission import verify_r4_admission
          from cemm_authoritative_hybrid.r4_pipeline import R4BuildReceipt
          from cemm_authoritative_hybrid.r4_partition_contracts import SPLITS

          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          roots = (Path('/tmp/r4-task6-final-a'), Path('/tmp/r4-task6-final-b'))
          reports = []
          fingerprints = []
          for root in roots:
              receipt = R4BuildReceipt.from_dict(json.loads((root / 'BUILD_RECEIPT.json').read_text()))
              assert receipt.abi_version == 4
              assert receipt.source_revision == revision
              report = verify_r4_admission(
                  Path('.'),
                  expected_source_revision=revision,
                  expected_authority_generation=receipt.authority_generation,
                  candidate_root=root,
              )
              assert report['build_receipt_abi_version'] == 4
              reports.append(report)
              fingerprints.append([
                  (
                      path.relative_to(root).as_posix(),
                      len(path.read_bytes()),
                      hashlib.sha256(path.read_bytes()).hexdigest(),
                  )
                  for path in sorted(p for p in root.rglob('*') if p.is_file())
              ])
          assert fingerprints[0] == fingerprints[1]
          root = roots[0]
          inventory = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          required = {
              'partition_evidence.json',
              'partition_sufficiency.json',
              'split_manifest.json',
              'capabilities/train.json',
              'authorizations/train.json',
              'BUILD_RECEIPT.json',
          }
          assert required <= inventory
          assert 'training_allowlist.json' not in inventory
          assert not any(path.startswith('partitions/') for path in inventory)
          counts = {}
          all_refs = set()
          for split in SPLITS:
              rows = [json.loads(line) for line in (root / 'splits' / f'{split}.jsonl').read_text().splitlines() if line]
              refs = [row['episode_ref'] for row in rows]
              assert refs and refs == sorted(refs)
              assert not all_refs.intersection(refs)
              all_refs.update(refs)
              counts[split] = len(refs)
          assert sum(counts.values()) == 400, counts
          print(json.dumps({
              'counts': counts,
              'file_count': len(inventory),
              'integrity_ref': reports[0]['integrity_ref'],
              'receipt_ref': reports[0]['build_receipt_ref'],
          }, sort_keys=True, separators=(',', ':')))
          PY
          test -z "$(git status --short -- artifacts/r4)"
      - name: Upload compact final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-task6-final-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 2
          if-no-files-found: warn
          path: |
            /tmp/r4-task6-final-a.log
            /tmp/r4-task6-final-b.log

  record:
    if: always()
    needs:
      - governed
      - candidate-ab
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-export-checkout-20260816
          fetch-depth: 0
      - name: Record final Task 6 outcomes
        env:
          GOVERNED_RESULT: ${{ needs.governed.result }}
          CANDIDATE_RESULT: ${{ needs.candidate-ab.result }}
        run: |
          set -euo pipefail
          mkdir -p .github/r4-task6-status
          printf '{"candidate":"%s","governed":"%s","snapshot":"%s","workflow_sha":"%s"}\n' \
            "$CANDIDATE_RESULT" "$GOVERNED_RESULT" \
            '3c5e9f3fd8e820b47505b1b76266f3118a0c7231' "$GITHUB_SHA" \
            > .github/r4-task6-status/final.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/r4-task6-status/final.json
          git commit -m 'ci(r4): record Task 6 final verification'
          git push origin HEAD:refs/heads/agent/r4-export-checkout-20260816
