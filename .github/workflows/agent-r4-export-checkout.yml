name: Agent R4 export checkout

on:
  push:
    branches:
      - agent/r4-export-checkout-20260816
    paths:
      - .github/workflows/agent-r4-export-checkout.yml

permissions:
  contents: read

concurrency:
  group: agent-r4-export-checkout-20260816
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-export-checkout-20260816
          fetch-depth: 0
          persist-credentials: false
      - name: Export complete reachable Git graph
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git bundle create /tmp/cemm-r4-all-heads.bundle --all
          git bundle verify /tmp/cemm-r4-all-heads.bundle
          git show-ref > /tmp/cemm-r4-all-heads.refs
          sha256sum /tmp/cemm-r4-all-heads.bundle > /tmp/cemm-r4-all-heads.sha256
      - name: Upload Git graph
        uses: actions/upload-artifact@v4
        with:
          name: cemm-r4-all-heads-git-bundle
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          path: |
            /tmp/cemm-r4-all-heads.bundle
            /tmp/cemm-r4-all-heads.refs
            /tmp/cemm-r4-all-heads.sha256
