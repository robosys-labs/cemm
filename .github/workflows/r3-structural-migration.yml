name: R3 legacy test migration

on:
  push:
    branches:
      - codex/hybrid-mvp-r2
    paths:
      - .github/workflows/r3-structural-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hybrid_mvp
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hybrid-mvp-r2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8'
      - name: Migrate legacy tests
        run: |
          python scripts/migrate_r3_legacy_tests.py
          python scripts/finish_r3_legacy_migration.py
      - name: Verify migrated R3 test surface
        run: |
          python scripts/verify_r3_r4_test_metadata.py
          python scripts/check_test_inventory.py --phase R3 --source-only
          python scripts/audit_r3_r4_legacy_tests.py --strict --output /tmp/R3_LEGACY_AUDIT.json
          python scripts/check_r3_r4_structure.py
          pytest -q tests/test_r3_predecessor_supersession.py tests/test_r3_public_cycle.py tests/test_transition_simulation.py tests/test_r3_plan_contract.py tests/test_r3_owner_structure.py tests/test_r3_structure.py
          git diff --check
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tests
          git commit -m 'test(r3): supersede and remove legacy cognition tests'
          git push origin HEAD:codex/hybrid-mvp-r2
