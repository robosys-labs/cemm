name: R3 legacy inventory audit
on:
  push:
    branches: [codex/hybrid-mvp-r2]
    paths: [.github/workflows/r3-structural-migration.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hybrid_mvp
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hybrid-mvp-r2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inventory and legacy diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          legacy = {
            'tests/test_capability_derivation.py','tests/test_cognitive_loop_e2e.py','tests/test_effect_gateway.py','tests/test_effect_recovery.py','tests/test_epistemic_admission.py','tests/test_inference_bounds.py','tests/test_learning_distinctions.py','tests/test_learning_security.py','tests/test_program_abi2.py','tests/test_query_engine.py','tests/test_recursive_inference.py','tests/test_response_meaning.py','tests/test_restart_e2e.py','tests/test_safety_and_contracts.py','tests/test_synonym_acquisition.py','tests/test_temporal_state.py','tests/test_transition_simulation.py'
          }
          inv=json.loads(Path('governance/test_inventory.json').read_text())
          rows=[r for r in inv['source_tests'] if r['source_test_ref'].split('::',1)[0] in legacy]
          by={}
          for r in rows:
            p=r['source_test_ref'].split('::',1)[0]
            d=by.setdefault(p,{'retained':0,'rewritten':0,'historical':0,'cases':0})
            d[r['classification']]+=1; d['cases']+=len(r['case_node_ids'])
          print('LEGACY_INVENTORY',json.dumps(by,sort_keys=True))
          print('LEGACY_SOURCE_TESTS',len(rows),'LEGACY_CASES',sum(len(r['case_node_ids']) for r in rows))
          PY
          python scripts/verify_r3_r4_test_metadata.py || true
          python scripts/check_test_inventory.py --phase R3 --source-only || true
          python scripts/audit_r3_r4_legacy_tests.py --output /tmp/audit.json || true
          cat /tmp/audit.json
