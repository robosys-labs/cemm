name: R4 authentic episode phase diagnostic

on:
  push:
    branches:
      - codex/r4-phase-episodes-tranche
    paths:
      - .github/workflows/r4-phase-episodes-diagnostic.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: r4-phase-episodes-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r4-phase-episodes-tranche
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact governed dependencies
        run: |
          set -euo pipefail
          python -m pip install \
            'pytest==8.4.0' \
            'hypothesis==6.163.0' \
            'numpy==2.5.2' \
            'safetensors==0.5.3' \
            'fastapi==0.115.0' \
            'httpx==0.27.0'
          python -m pip install 'torch==2.6.0' \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Run untouched R4 phase gate and print exact failures
        working-directory: hybrid_mvp
        env:
          PYTHONPATH: src:scripts:.
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/r4-phase-outcome.jsonl
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, 'src')
          sys.path.insert(0, 'scripts')
          from cemm_authoritative_hybrid import process_control as process_control_module
          sys.modules['process_control'] = process_control_module
          from validation_gate import run_validation

          outcome = run_validation(Path('.').resolve(), phase='R4', tier='phase')
          print(json.dumps(outcome.to_dict(), sort_keys=True, separators=(',', ':')))
          for step in outcome.step_results:
              print(json.dumps({
                  'step_id': step.step_id,
                  'disposition': step.disposition,
                  'error_code': step.error_code,
                  'report': None if step.report is None else dict(step.report),
                  'observation_report': (
                      None if step.observation_report is None
                      else dict(step.observation_report)
                  ),
              }, sort_keys=True, separators=(',', ':')))
          if outcome.disposition == 'passed':
              raise SystemExit('R4 phase tier unexpectedly passed; diagnostic is complete')
          PY

      - name: Upload exact phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-phase-episodes-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/r4-phase-outcome.jsonl
            hybrid_mvp/artifacts/validation/runs/*.json
