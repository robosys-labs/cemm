name: R4 Task 4 feasibility envelope export

on:
  push:
    branches:
      - codex/r4-task4-feasibility
    paths:
      - .github/workflows/r4-task4-feasibility-envelope-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r4-task4-feasibility
          fetch-depth: 1

      - name: Copy and inventory feasibility envelope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/task4-feasibility-envelope
          cp -a .github/r4-task4/. /tmp/task4-feasibility-envelope/
          find /tmp/task4-feasibility-envelope -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/task4-feasibility-envelope/R4_TASK4_FEASIBILITY_ENVELOPE_SHA256SUMS
          cat /tmp/task4-feasibility-envelope/R4_TASK4_FEASIBILITY_ENVELOPE_SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: cemm-r4-task4-feasibility-envelope-v2
          path: /tmp/task4-feasibility-envelope
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
