name: R4 Task 8 evidence-policy patch

on:
  pull_request:
    branches:
      - agent/r4-task8-evidence-policy-ci-base-20260820
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: r4-task8-evidence-policy-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/r4-task8-evidence-policy-head-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: src:scripts:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-task8-evidence-policy-head-20260820
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-task8-evidence-policy-ci-base-20260820
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fence control, trigger, and reviewed parent
        run: |
          set -euo pipefail
          trigger_sha='490c025633af288f4175783a48805b52d7728b9b'
          reviewed_parent='b8b180a1faac6e0f9460f8939dd1386859cb99aa'
          test '${{ github.event.pull_request.base.ref }}' = 'agent/r4-task8-evidence-policy-ci-base-20260820'
          test '${{ github.event.pull_request.head.ref }}' = 'agent/r4-task8-evidence-policy-head-20260820'
          test "$(git -C candidate rev-parse HEAD)" = "$trigger_sha"
          test "$(git -C candidate rev-parse HEAD^)" = "$reviewed_parent"
          printf '%s\n' '.github/r4-task8-status/evidence-policy-trigger.json' > /tmp/expected-trigger
          git -C candidate diff --name-only HEAD^ HEAD | sort > /tmp/actual-trigger
          diff -u /tmp/expected-trigger /tmp/actual-trigger
          test "$(git -C control merge-base "$reviewed_parent" HEAD)" = "$reviewed_parent"
          printf '%s\n' \
            '.github/r4-task8/evidence-policy.patch.gz.b64' \
            '.github/workflows/r4-task8-evidence-policy-patch.yml' | sort > /tmp/expected-control
          git -C control diff --name-only "$reviewed_parent" HEAD | sort > /tmp/actual-control
          diff -u /tmp/expected-control /tmp/actual-control
          test "$(sha256sum control/.github/r4-task8/evidence-policy.patch.gz.b64 | cut -d' ' -f1)" = '4e298ddd6773a4f1083c8576da49def15d469025ddfa28c7da224cd1dad27c2b'
          git -C candidate checkout --detach "$reviewed_parent"
          test "$(git -C candidate rev-parse HEAD)" = "$reviewed_parent"
      - name: Authenticate and apply the reviewed patch
        run: |
          set -euo pipefail
          base64 --decode control/.github/r4-task8/evidence-policy.patch.gz.b64 > /tmp/cemm-task8-evidence-policy.patch.gz
          gzip -dc /tmp/cemm-task8-evidence-policy.patch.gz > /tmp/cemm-task8-evidence-policy.patch
          test "$(sha256sum /tmp/cemm-task8-evidence-policy.patch | cut -d' ' -f1)" = '35174abc6942786f253caa72a43296e468103806184df603ef1e293ea9d5e4c7'
          git -C candidate apply --check --directory=hybrid_mvp /tmp/cemm-task8-evidence-policy.patch
          git -C candidate apply --directory=hybrid_mvp /tmp/cemm-task8-evidence-policy.patch
          printf '%s\n' \
            'hybrid_mvp/scripts/update_replay_status.py' \
            'hybrid_mvp/scripts/validation_gate.py' \
            'hybrid_mvp/tests/test_r4_validation_gate.py' | sort > /tmp/expected
          git -C candidate diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git -C candidate diff --check
          test "$(git -C candidate hash-object hybrid_mvp/scripts/validation_gate.py)" = 'cce622b5576dc35e686c3f463057fdc3c4b45983'
          test "$(git -C candidate hash-object hybrid_mvp/scripts/update_replay_status.py)" = '7a41f7b68379e4258b70c036eee0f2c53a481db2'
          test "$(git -C candidate hash-object hybrid_mvp/tests/test_r4_validation_gate.py)" = 'b1cb58bf05600248546cede14397bc2ebb701f14'
      - name: Install focused verification dependency
        run: python -m pip install 'pytest==8.4.0'
      - name: Verify policy, metadata, inventory, and hard cuts
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python -m pytest tests/test_r4_validation_gate.py -q -p no:cacheprovider
          python scripts/verify_r3_r4_test_metadata.py
          for phase in G0 R1 R2 R3 R4 R5; do
            python scripts/check_test_inventory.py --phase "$phase" --source-only
          done
          python scripts/check_r3_r4_structure.py
          python scripts/audit_legacy_test_hard_cut.py
      - name: Reconstruct the exact historical ABI 3 admission
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys

          from cemm_authoritative_hybrid import process_control

          sys.modules['process_control'] = process_control
          import validation_gate as gate

          root = Path('.').resolve()
          receipt, evidence_paths = gate.load_verified_admission_receipt(
              root,
              phase='R4',
              expected_status='passed',
              run_ref='run:300579c997da31e29d1c1a06',
          )
          assert receipt.source_ref == '597348731965cf31f5ec6fe480d05aee9bc5ca1d'
          assert receipt.gate_result_ref == 'gate_result:c9a643b22f3df49f8a074466'
          selected = gate._required_admission_evidence_paths(
              'R4', root=root, receipt=receipt
          )
          assert selected == evidence_paths
          assert len(selected) == 16
          assert 'artifacts/r4/training_allowlist.json' in selected
          assert 'artifacts/r4/partition_evidence.json' not in selected
          PY
      - name: Lease-replace the trigger with one verified commit
        run: |
          set -euo pipefail
          find candidate/hybrid_mvp -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git -C candidate status --short --untracked-files=all | grep -vE '^ M hybrid_mvp/(scripts/(update_replay_status|validation_gate)\.py|tests/test_r4_validation_gate\.py)$' || true)"
          git -C candidate config user.name 'github-actions[bot]'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate add \
            hybrid_mvp/scripts/update_replay_status.py \
            hybrid_mvp/scripts/validation_gate.py \
            hybrid_mvp/tests/test_r4_validation_gate.py
          git -C candidate diff --cached --check
          git -C candidate commit -m 'fix(r4): select admission evidence by build ABI'
          git -C candidate push \
            --force-with-lease=refs/heads/agent/r4-task8-evidence-policy-head-20260820:490c025633af288f4175783a48805b52d7728b9b \
            origin HEAD:refs/heads/agent/r4-task8-evidence-policy-head-20260820
