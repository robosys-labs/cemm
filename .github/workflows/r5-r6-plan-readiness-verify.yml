name: R5 R6 plan readiness verification

on:
  pull_request:
    branches:
      - agent/r5-r6-plan-readiness-ci-base-20260822
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: r5-r6-plan-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/r5-r6-plan-readiness-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: hybrid_mvp
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: src:scripts:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ad76f8e30dfa293150b5b8acd79ca2c980c8c7d1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fence exact docs-only candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ad76f8e30dfa293150b5b8acd79ca2c980c8c7d1'
          test "$(git rev-parse HEAD^)" = '5c704399b417414cf91211d6d9a9a8c8ce84767c'
          printf '%s\n' \
            'hybrid_mvp/docs/IMPLEMENTATION_PLAN.md' \
            'hybrid_mvp/docs/superpowers/plans/2026-08-22-r5-neural-activation-r6-composition-plan.md' \
            'hybrid_mvp/docs/superpowers/progress/2026-08-22-r5-r6-plan-readiness-review.md' \
            'hybrid_mvp/docs/superpowers/specs/2026-08-22-r5-neural-activation-r6-composition-design.md' | sort > /tmp/expected
          git diff --name-only HEAD^ HEAD | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          test -z "$(git status --short --untracked-files=all)"
      - name: Check required plan contracts
        run: |
          set -euo pipefail
          review='docs/superpowers/progress/2026-08-22-r5-r6-plan-readiness-review.md'
          design='docs/superpowers/specs/2026-08-22-r5-neural-activation-r6-composition-design.md'
          plan='docs/superpowers/plans/2026-08-22-r5-neural-activation-r6-composition-plan.md'
          grep -Fq 'NO-GO for R5/R6 implementation' "$review"
          grep -Fq 'current R4 ABI-4 admission' "$design"
          grep -Fq 'Hashing the whole target surface into a class' "$design"
          grep -Fq 'all 25 deferred' "$design"
          grep -Fq 'Task 24 — Run R6 phase and admission' "$plan"
          grep -Fq 'R7 red (frozen-test evaluation not yet run)' "$plan"
          test "$(grep -c '^## Task ' "$plan")" -eq 25
      - name: Install focused dependencies
        run: python -m pip install 'pytest==8.4.0' 'jsonschema==4.25.1'
      - name: Verify governance and R5 foundation
        run: |
          python -m pytest tests/test_replay_governance.py tests/test_r5_foundation.py -q -p no:cacheprovider
      - name: Verify metadata and source-only inventory
        run: |
          set -euo pipefail
          python scripts/verify_r3_r4_test_metadata.py
          for phase in G0 R1 R2 R3 R4 R5; do
            python scripts/check_test_inventory.py --phase "$phase" --source-only
          done
      - name: Verify hard cuts and replay chain
        run: |
          set -euo pipefail
          python scripts/check_r3_r4_structure.py
          python scripts/audit_legacy_test_hard_cut.py
          python scripts/update_replay_status.py --verify-chain
      - name: Confirm clean checkout
        if: always()
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --short --untracked-files=all)"
