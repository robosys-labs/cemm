name: R4 Task 8 selector reconciliation

on:
  pull_request:
    branches:
      - agent/r4-task8-selector-final-ci-base-20260820
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: r4-task8-selector-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    if: github.event.pull_request.head.ref == 'agent/r4-task8-selector-final-candidate-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: src:scripts:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-task8-selector-final-candidate-20260820
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-task8-selector-final-ci-base-20260820
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fence candidate and control lineages
        run: |
          set -euo pipefail
          parent='8e09a87c14e167558834a1adf329d836ee75801a'
          head_sha="$(git -C candidate rev-parse HEAD)"
          test '${{ github.event.pull_request.base.ref }}' = 'agent/r4-task8-selector-final-ci-base-20260820'
          test '${{ github.event.pull_request.head.ref }}' = 'agent/r4-task8-selector-final-candidate-20260820'
          test "$(git -C candidate rev-parse HEAD^)" = "$parent"
          printf '%s\n' '.github/r4-task8-status/selector-final-trigger.json' > /tmp/trigger-paths
          printf '%s\n' \
            'hybrid_mvp/artifacts/validation/R5_TEST_DISPOSITIONS.json' \
            'hybrid_mvp/artifacts/validation/TEST_INVENTORY_RECEIPT.json' \
            'hybrid_mvp/configs/validation_gates.json' \
            'hybrid_mvp/tests/test_validation_gate.py' | sort > /tmp/source-paths
          git -C candidate diff --name-only "$parent" "$head_sha" | sort > /tmp/current-paths
          if diff -q /tmp/trigger-paths /tmp/current-paths >/dev/null; then
            test "$(git -C candidate hash-object .github/r4-task8-status/selector-final-trigger.json)" = 'a878cc8a460bbb66d798d520237136001748052b'
          else
            diff -u /tmp/source-paths /tmp/current-paths
          fi

          test "$(git -C control merge-base "$parent" HEAD)" = "$parent"
          printf '%s\n' \
            '.github/r4-task8-selector/transform.py.gz.b64' \
            '.github/workflows/r4-task8-selector-final.yml' | sort > /tmp/control-expected
          git -C control diff --name-only "$parent" HEAD | sort > /tmp/control-actual
          diff -u /tmp/control-expected /tmp/control-actual
          test "$(git -C control hash-object .github/r4-task8-selector/transform.py.gz.b64)" = '1b7db67c5ae22f5216acb8ad971d73ba4d2eb8db'
          printf 'INITIAL_HEAD_SHA=%s\n' "$head_sha" >> "$GITHUB_ENV"
          git -C candidate checkout --detach "$parent"

      - name: Reconstruct the exact reviewed source tree
        run: |
          set -euo pipefail
          base64 --decode control/.github/r4-task8-selector/transform.py.gz.b64 > /tmp/transform.py.gz
          test "$(sha256sum /tmp/transform.py.gz | cut -d' ' -f1)" = '0b37b754a84819d2edfc641084b3da1b0b8b41bb282e3765918b9982437fc195'
          gzip -dc /tmp/transform.py.gz > /tmp/transform.py
          test "$(sha256sum /tmp/transform.py | cut -d' ' -f1)" = '9fe38c42f9fa628c68a29f6a04a3ba91b5264a7a4494eaa0d7ce447210dcc29b'
          PYTHONPATH="$PWD/candidate/hybrid_mvp/src:$PWD/candidate/hybrid_mvp/scripts:$PWD/candidate/hybrid_mvp" \
            python /tmp/transform.py "$PWD/candidate/hybrid_mvp"
          git -C candidate diff --check
          printf '%s\n' \
            'hybrid_mvp/artifacts/validation/R5_TEST_DISPOSITIONS.json' \
            'hybrid_mvp/artifacts/validation/TEST_INVENTORY_RECEIPT.json' \
            'hybrid_mvp/configs/validation_gates.json' \
            'hybrid_mvp/tests/test_validation_gate.py' | sort > /tmp/source-paths
          git -C candidate diff --name-only | sort > /tmp/reconstructed-paths
          diff -u /tmp/source-paths /tmp/reconstructed-paths
          test "$(sha256sum candidate/hybrid_mvp/configs/validation_gates.json | cut -d' ' -f1)" = '759a8262f0a6e9c3c36f162571ef4d3d2223ae9c65c74f77b8d82ee5820ffec4'
          test "$(sha256sum candidate/hybrid_mvp/tests/test_validation_gate.py | cut -d' ' -f1)" = 'bbeca8944ef5615763405748695780cbd9325e9887c4b2f523f858cdf64492d6'
          test "$(sha256sum candidate/hybrid_mvp/artifacts/validation/TEST_INVENTORY_RECEIPT.json | cut -d' ' -f1)" = '07f0c15ce0adc1877720b828fb93371bb72b7a922721a6541386f00cee51882f'
          test "$(sha256sum candidate/hybrid_mvp/artifacts/validation/R5_TEST_DISPOSITIONS.json | cut -d' ' -f1)" = 'c0c6b217ddad34bc9358fc421887307439955b47a6bd96194b4e5788238116db'

      - name: Create deterministic candidate commit before governance checks
        run: |
          set -euo pipefail
          git -C candidate config user.name 'CEMM Verification Bot'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate add -- \
            hybrid_mvp/artifacts/validation/R5_TEST_DISPOSITIONS.json \
            hybrid_mvp/artifacts/validation/TEST_INVENTORY_RECEIPT.json \
            hybrid_mvp/configs/validation_gates.json \
            hybrid_mvp/tests/test_validation_gate.py
          git -C candidate diff --cached --check
          GIT_AUTHOR_NAME='CEMM Verification Bot' \
          GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_AUTHOR_DATE='2026-08-20T20:00:00+01:00' \
          GIT_COMMITTER_NAME='CEMM Verification Bot' \
          GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_COMMITTER_DATE='2026-08-20T20:00:00+01:00' \
            git -C candidate commit --no-gpg-sign -m 'fix(r4): reconcile validation selectors and receipts'
          test "$(git -C candidate rev-parse HEAD^)" = '8e09a87c14e167558834a1adf329d836ee75801a'
          test -z "$(git -C candidate status --short --untracked-files=all)"
          printf 'CANDIDATE_SHA=%s\n' "$(git -C candidate rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install governed verification dependencies
        run: |
          set -euo pipefail
          python -m pip install 'pytest==8.4.0' 'jsonschema==4.25.1' 'numpy==2.5.2' 'safetensors==0.5.3'
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and run affected owner suites
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python -m compileall -q src scripts
          python -m pytest \
            tests/test_validation_gate.py \
            tests/test_r4_validation_gate.py \
            tests/test_replay_governance.py \
            tests/test_g0_integration.py \
            tests/test_r5_foundation.py \
            tests/test_r4_partition_contracts.py \
            tests/test_r4_partition_global_assignment.py \
            tests/test_r4_admission.py \
            tests/test_r4_training_partition_boundary.py \
            tests/test_r5_data_isolation.py \
            -q -p no:cacheprovider

      - name: Verify canonical metadata, receipts, and selectors
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python scripts/verify_r3_r4_test_metadata.py
          python scripts/refresh_r3_r4_test_metadata.py
          python scripts/refresh_r5_test_metadata.py
          python scripts/generate_r5_test_dispositions.py --check artifacts/validation/R5_TEST_DISPOSITIONS.json
          for phase in G0 R1 R2 R3 R4 R5; do
            python scripts/check_test_inventory.py --phase "$phase" --source-only
          done
          python - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          from cemm_authoritative_hybrid import process_control
          sys.modules['process_control'] = process_control
          import test_inventory_core as core
          import validation_gate as gate

          root = Path('.').resolve()
          inventory_path = root / 'governance/test_inventory.json'
          inventory_sha = core.verify_document_authority_pin(root, inventory_path)
          inventory = core.load_and_verify(
              root, inventory_path, phase='G0', enforce_reviewed_counts=True,
              expected_sha256=inventory_sha,
          )
          graph = gate.load_gate_graph(root / 'configs/validation_gates.json')
          selector = gate.validate_inventory_contract(graph, inventory, phase='G0')
          expected = gate._expected_g0_inventory_receipt(
              authority_sha256=hashlib.sha256((root / 'docs/DOCUMENT_AUTHORITY.json').read_bytes()).hexdigest(),
              inventory_sha256=inventory_sha,
              inventory=inventory,
              selector=selector,
          )
          raw = json.dumps(expected, ensure_ascii=False, allow_nan=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          assert raw == (root / 'artifacts/validation/TEST_INVENTORY_RECEIPT.json').read_bytes()
          PY
          python scripts/check_r3_r4_structure.py
          python scripts/audit_legacy_test_hard_cut.py

      - name: Confirm candidate remains immutable after verification
        run: |
          set -euo pipefail
          find candidate/hybrid_mvp -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git -C candidate status --short --untracked-files=all)"

      - name: Publish only the verified candidate branch
        run: |
          set -euo pipefail
          candidate_ref='refs/heads/agent/r4-task8-selector-final-candidate-20260820'
          remote_head="$(git -C candidate ls-remote origin "$candidate_ref" | cut -f1)"
          if [ "$remote_head" != "$CANDIDATE_SHA" ]; then
            test "$remote_head" = "$INITIAL_HEAD_SHA"
            git -C candidate push --force-with-lease="$candidate_ref:$INITIAL_HEAD_SHA" origin HEAD:"$candidate_ref"
          fi
          test "$(git -C candidate ls-remote origin "$candidate_ref" | cut -f1)" = "$CANDIDATE_SHA"

      - name: Write verification receipt
        run: |
          python - "$CANDIDATE_SHA" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          sha = sys.argv[1]
          tree = subprocess.check_output(['git','-C','candidate','rev-parse',f'{sha}^{{tree}}'], text=True).strip()
          Path('/tmp/r4-task8-selector-verification.json').write_text(json.dumps({
              'candidate_sha': sha,
              'parent_sha': '8e09a87c14e167558834a1adf329d836ee75801a',
              'tree_sha': tree,
              'changed_paths': [
                  'hybrid_mvp/artifacts/validation/R5_TEST_DISPOSITIONS.json',
                  'hybrid_mvp/artifacts/validation/TEST_INVENTORY_RECEIPT.json',
                  'hybrid_mvp/configs/validation_gates.json',
                  'hybrid_mvp/tests/test_validation_gate.py',
              ],
              'file_sha256': {
                  'validation_gates.json': '759a8262f0a6e9c3c36f162571ef4d3d2223ae9c65c74f77b8d82ee5820ffec4',
                  'test_validation_gate.py': 'bbeca8944ef5615763405748695780cbd9325e9887c4b2f523f858cdf64492d6',
                  'TEST_INVENTORY_RECEIPT.json': '07f0c15ce0adc1877720b828fb93371bb72b7a922721a6541386f00cee51882f',
                  'R5_TEST_DISPOSITIONS.json': 'c0c6b217ddad34bc9358fc421887307439955b47a6bd96194b4e5788238116db',
              },
              'inventory_phases': ['G0','R1','R2','R3','R4','R5'],
              'metadata_records': 356,
          }, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cemm-r4-task8-selector-verification
          path: /tmp/r4-task8-selector-verification.json
          if-no-files-found: error
          retention-days: 7
