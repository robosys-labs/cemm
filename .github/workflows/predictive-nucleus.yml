name: Predictive nucleus — isolated scientific invariants

on:
  pull_request:
    paths:
      - 'experiments/predictive_nucleus/**'
      - '.github/workflows/predictive-nucleus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-and-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install CPU-only learned-kernel dependency
        run: python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify unchanged original frozen protocol
        run: python -m experiments.predictive_nucleus.protocol verify
      - name: Run isolated invariant tests
        run: python -m unittest discover -s experiments/predictive_nucleus/tests -v
      - name: Record unsealed evidence diagnostics (NOT a scientific gate)
        run: |
          python -m experiments.predictive_nucleus.probe_trial \
            --train 1200 --calibration 250 --validation 100 --steps 300 \
            --seeds 7,11,23,37,53 > g1c-validation.json
      - name: Archive unadmitted diagnostics for independent review
        uses: actions/upload-artifact@v4
        with:
          name: g1c-validation-not-a-gate
          path: g1c-validation.json
          retention-days: 30
      - name: Public G1d physics/noise stress (NOT an acceptance gate)
        run: |
          python -m experiments.predictive_nucleus.stress_trial \
            --train 600 --calibration 200 --worlds 10 --steps 200 \
            --seeds 7,11,23,37,53 > g1d-stress.json
      - name: Show compact G1d public diagnostic summary
        run: |
          python - <<'PY'
          import json, statistics
          report = json.load(open('g1d-stress.json'))
          for scenario in report['results'][0]['scenarios']:
              entries = [r['scenarios'][scenario]['policy'] for r in report['results']]
              def avg(policy, key):
                  return round(statistics.mean(v[policy][key] for v in entries), 4)
              print(json.dumps({
                  'scenario': scenario, 'gate': 'NOT_RUN',
                  'active_exact': avg('active', 'full_world_exact'),
                  'active_pair': avg('active', 'pair_both_exact'),
                  'active_alarm_rate': avg('active', 'alarm_world_rate'),
                  'active_probe_cost': avg('active', 'probes_mean'),
                  'random_contact_equal_cost_exact': avg('random_contact_cost_matched', 'full_world_exact'),
                  'random_any_equal_cost_exact': avg('random_any_cost_matched', 'full_world_exact'),
                  'passive_exact': avg('passive', 'full_world_exact'),
              }, sort_keys=True))
          PY
      - name: Archive G1d public diagnostic (not independent challenge)
        uses: actions/upload-artifact@v4
        with:
          name: g1d-public-stress-unadmitted
          path: g1d-stress.json
          retention-days: 30
      - name: G1d temporal falsification on fresh public development worlds (NOT G1)
        run: |
          python -m experiments.predictive_nucleus.stability_trial \
            --train 600 --calibration 200 --worlds 10 --steps 200 \
            --seeds 7,11,23,37,53 > g1d-temporal.json
      - name: Compact temporal validation scorecard
        run: |
          python - <<'PY'
          import json, statistics
          data = json.load(open('g1d-temporal.json'))
          for scenario in data['results'][0]['scenarios']:
              group = [r['scenarios'][scenario]['policy'] for r in data['results']]
              avg = lambda policy, metric: round(statistics.mean(x[policy][metric] for x in group), 4)
              print(json.dumps({
                  'gate': 'NOT_ADMITTED', 'scenario': scenario,
                  'verified_exact': avg('active_validate', 'full_world_exact'),
                  'vanilla_exact': avg('active', 'full_world_exact'),
                  'matched_random_exact': avg('random_contact', 'full_world_exact'),
                  'verified_probes': avg('active_validate', 'probes_mean'),
                  'verified_temporal_steps': avg('active_validate', 'mean_validation_probe_steps'),
                  'belief_conflict': avg('active_validate', 'belief_conflict_rate'),
                  'change_point_alarm': avg('active_validate', 'change_point_alarm_rate')
              }, sort_keys=True))
          PY
      - name: Archive unadmitted temporal validation results
        uses: actions/upload-artifact@v4
        with:
          name: g1d-public-temporal-validation-unadmitted
          path: g1d-temporal.json
          retention-days: 30
      - name: Paired evidence guard public audit (NOT G1)
        run: |
          python -m experiments.predictive_nucleus.guard_trial \
            --train 600 --calibration 200 --worlds 10 --steps 200 \
            --seeds 7,11,23,37,53 > g1d-guard-audit.json
      - name: Show paired risk and coverage per public stratum
        run: |
          python - <<'PY'
          import json, statistics
          report = json.load(open('g1d-guard-audit.json'))
          for split in ('opened_v4', 'fresh_public_v5'):
              for scenario in report['results'][0]['splits'][split]:
                  cases = [r['splits'][split][scenario] for r in report['results']]
                  mean = lambda values: round(statistics.mean(values), 4)
                  print(json.dumps({
                      'split': split, 'scenario': scenario, 'gate': 'NOT_ADMITTED',
                      'map_exact': mean(c['unconditional_map_exact'] for c in cases),
                      'legacy_coverage': mean(c['legacy']['coverage'] for c in cases),
                      'guard_coverage': mean(c['guard']['coverage'] for c in cases),
                      'legacy_wrong_per_query': mean(c['legacy']['covered_wrong_per_query'] for c in cases),
                      'guard_wrong_per_query': mean(c['guard']['covered_wrong_per_query'] for c in cases),
                      'guard_correct_abstained_per_query': mean(c['guard']['correct_abstained_per_query'] for c in cases),
                      'probes_per_world': mean(c['mean_physical_probes'] for c in cases),
                      'newly_covered_wrong': sum(len(c['newly_covered_wrong']) for c in cases),
                  }, sort_keys=True))
          PY
      - name: Archive paired unadmitted guard audit
        uses: actions/upload-artifact@v4
        with:
          name: g1d-paired-guard-audit-unadmitted
          path: g1d-guard-audit.json
          retention-days: 30
      - name: Paired observed-context audit (NOT G1)
        run: |
          python -m experiments.predictive_nucleus.context_trial \
            --train 600 --calibration 200 --worlds 10 --steps 200 \
            --seeds 7,11,23,37,53 > g1f-context-audit.json
      - name: Show paired context coverage and risk
        run: |
          python - <<'PY'
          import json, statistics
          report = json.load(open('g1f-context-audit.json'))
          for split in ('opened_v5', 'new_public_v6'):
              for scenario in report['results'][0]['splits'][split]:
                  cases = [r['splits'][split][scenario] for r in report['results']]
                  mean = lambda values: round(statistics.mean(values), 4)
                  print(json.dumps({
                      'split': split, 'scenario': scenario, 'gate': 'NOT_ADMITTED',
                      'map_exact': mean(c['unconditional_map_exact'] for c in cases),
                      'base_coverage': mean(c['baseline_guard']['coverage'] for c in cases),
                      'context_coverage': mean(c['context_guard']['coverage'] for c in cases),
                      'base_wrong_per_query': mean(c['baseline_guard']['covered_wrong_per_query'] for c in cases),
                      'context_wrong_per_query': mean(c['context_guard']['covered_wrong_per_query'] for c in cases),
                      'correct_newly_abstained': sum(len(c['previously_covered_correct_now_abstained']) for c in cases),
                      'wrong_newly_abstained': sum(len(c['previously_covered_wrong_now_abstained']) for c in cases),
                      'probes_per_world': mean(c['mean_physical_probes'] for c in cases),
                  }, sort_keys=True))
          PY
      - name: Archive unadmitted context diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: g1f-context-coverage-unadmitted
          path: g1f-context-audit.json
          retention-days: 30
