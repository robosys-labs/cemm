name: Predictive nucleus — isolated scientific invariants

on:
  pull_request:
    paths:
      - 'experiments/predictive_nucleus/**'
      - '.github/workflows/predictive-nucleus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-and-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install CPU-only learned-kernel dependency
        run: python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify unchanged original frozen protocol
        run: python -m experiments.predictive_nucleus.protocol verify
      - name: Verify every historical research manifest lock
        working-directory: experiments/predictive_nucleus
        run: |
          for lock in snapshots/*.sha256; do
            sha256sum -c "$lock"
          done
      - name: Run isolated invariant tests
        run: python -m unittest discover -s experiments/predictive_nucleus/tests -v
      - name: Compare pre-audit and corrected models on the same host
        run: |
          git cat-file -e e8ff892d22ea2c63eba7de7bcccd444e39cfd0ff^{commit}
          mkdir -p "$RUNNER_TEMP/cemm-pre-audit"
          git archive e8ff892d22ea2c63eba7de7bcccd444e39cfd0ff experiments/predictive_nucleus | tar -x -C "$RUNNER_TEMP/cemm-pre-audit"
          cp experiments/predictive_nucleus/audit_differential_runner.py "$RUNNER_TEMP/cemm-pre-audit/experiments/predictive_nucleus/"
          (
            cd "$RUNNER_TEMP/cemm-pre-audit"
            PYTHONHASHSEED=0 PYTHONPATH="$RUNNER_TEMP/cemm-pre-audit" python -m experiments.predictive_nucleus.audit_differential_runner > "$RUNNER_TEMP/cemm-before.json"
          )
          PYTHONHASHSEED=0 PYTHONPATH="$GITHUB_WORKSPACE" python -m experiments.predictive_nucleus.audit_differential_runner > "$RUNNER_TEMP/cemm-after.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          before = json.loads((root / 'cemm-before.json').read_text())
          after = json.loads((root / 'cemm-after.json').read_text())
          with open('g1i-same-host-regression.json', 'w') as output:
              json.dump({'before': before, 'after': after}, output, sort_keys=True)
          if before != after:
              for key in sorted(before.keys() | after.keys()):
                  if before.get(key) != after.get(key):
                      print('Differential mismatch:', key, before.get(key), after.get(key))
              raise SystemExit('Same-host before/after fingerprints do not match')
          print('Fixed-step training, sensor data, calibration and legacy trajectory fingerprints match on this host.')
          print('CPU:', after['cpu_model'], 'PyTorch:', after['torch'], 'seeds:', [r['seed'] for r in after['models']])
          PY
      - name: Archive same-host regression fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1i-same-host-regression
          path: g1i-same-host-regression.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Record unsealed evidence diagnostics (NOT a scientific gate)
        run: |
          python -m experiments.predictive_nucleus.probe_trial \
            --train 1200 --calibration 250 --validation 100 --steps 300 \
            --seeds 7,11,23,37,53 > g1c-validation.json
      - name: Archive unadmitted diagnostics for independent review
        uses: actions/upload-artifact@v4
        with:
          name: g1c-validation-not-a-gate
          path: g1c-validation.json
          retention-days: 30
      - name: Public G1d physics/noise stress (NOT an acceptance gate)
        run: |
          python -m experiments.predictive_nucleus.stress_trial \
            --train 600 --calibration 200 --worlds 10 --steps 200 \
            --seeds 7,11,23,37,53 > g1d-stress.json
      - name: Show compact G1d public diagnostic summary
        run: |
          python - <<'PY'
          import json, statistics
          report = json.load(open('g1d-stress.json'))
          for scenario in report['results'][0]['scenarios']:
              entries = [r['scenarios'][scenario]['policy'] for r in report['results']]
              def avg(policy, key):
                  return round(statistics.mean(v[policy][key] for v in entries), 4)
              print(json.dumps({
                  'scenario': scenario, 'gate': 'NOT_RUN',
                  'active_exact': avg('active', 'full_world_exact'),
                  'active_pair': avg('active', 'pair_both_exact'),
                  'active_alarm_rate': avg('active', 'alarm_world_rate'),
                  'active_probe_cost': avg('active', 'probes_mean'),
                  'random_contact_equal_cost_exact': avg('random_contact_cost_matched', 'full_world_exact'),
                  'random_any_equal_cost_exact': avg('random_any_cost_matched', 'full_world_exact'),
                  'passive_exact': avg('passive', 'full_world_exact'),
              }, sort_keys=True))
          PY
      - name: Archive G1d public diagnostic (not independent challenge)
        uses: actions/upload-artifact@v4
        with:
          name: g1d-public-stress-unadmitted
          path: g1d-stress.json
          retention-days: 30
      - name: G1d temporal falsification on fresh public development worlds (NOT G1)
        run: |
          python -m experiments.predictive_nucleus.stability_trial \
            --train 600 --calibration 200 --worlds 10 --steps 200 \
            --seeds 7,11,23,37,53 > g1d-temporal.json
      - name: Compact temporal validation scorecard
        run: |
          python - <<'PY'
          import json, statistics
          data = json.load(open('g1d-temporal.json'))
          for scenario in data['results'][0]['scenarios']:
              group = [r['scenarios'][scenario]['policy'] for r in data['results']]
              avg = lambda policy, metric: round(statistics.mean(x[policy][metric] for x in group), 4)
              print(json.dumps({
                  'gate': 'NOT_ADMITTED', 'scenario': scenario,
                  'verified_exact': avg('active_validate', 'full_world_exact'),
                  'vanilla_exact': avg('active', 'full_world_exact'),
                  'matched_random_exact': avg('random_contact', 'full_world_exact'),
                  'verified_probes': avg('active_validate', 'probes_mean'),
                  'verified_temporal_steps': avg('active_validate', 'mean_validation_probe_steps'),
                  'belief_conflict': avg('active_validate', 'belief_conflict_rate'),
                  'change_point_alarm': avg('active_validate', 'change_point_alarm_rate')
              }, sort_keys=True))
          PY
      - name: Archive unadmitted temporal validation results
        uses: actions/upload-artifact@v4
        with:
          name: g1d-public-temporal-validation-unadmitted
          path: g1d-temporal.json
          retention-days: 30
      - name: Paired evidence guard public audit (NOT G1)
        run: |
          python -m experiments.predictive_nucleus.guard_trial \
            --train 600 --calibration 200 --worlds 10 --steps 200 \
            --seeds 7,11,23,37,53 > g1d-guard-audit.json
      - name: Show paired risk and coverage per public stratum
        run: |
          python - <<'PY'
          import json, statistics
          report = json.load(open('g1d-guard-audit.json'))
          for split in ('opened_v4', 'fresh_public_v5'):
              for scenario in report['results'][0]['splits'][split]:
                  cases = [r['splits'][split][scenario] for r in report['results']]
                  mean = lambda values: round(statistics.mean(values), 4)
                  print(json.dumps({
                      'split': split, 'scenario': scenario, 'gate': 'NOT_ADMITTED',
                      'map_exact': mean(c['unconditional_map_exact'] for c in cases),
                      'legacy_coverage': mean(c['legacy']['coverage'] for c in cases),
                      'guard_coverage': mean(c['guard']['coverage'] for c in cases),
                      'legacy_wrong_per_query': mean(c['legacy']['covered_wrong_per_query'] for c in cases),
                      'guard_wrong_per_query': mean(c['guard']['covered_wrong_per_query'] for c in cases),
                      'guard_correct_abstained_per_query': mean(c['guard']['correct_abstained_per_query'] for c in cases),
                      'probes_per_world': mean(c['mean_physical_probes'] for c in cases),
                      'newly_covered_wrong': sum(len(c['newly_covered_wrong']) for c in cases),
                  }, sort_keys=True))
          PY
      - name: Archive paired unadmitted guard audit
        uses: actions/upload-artifact@v4
        with:
          name: g1d-paired-guard-audit-unadmitted
          path: g1d-guard-audit.json
          retention-days: 30
      - name: Paired observed-context audit (NOT G1)
        run: |
          python -m experiments.predictive_nucleus.context_trial \
            --train 600 --calibration 200 --worlds 10 --steps 200 \
            --seeds 7,11,23,37,53 > g1f-context-audit.json
      - name: Show paired context coverage and risk
        run: |
          python - <<'PY'
          import json, statistics
          report = json.load(open('g1f-context-audit.json'))
          for split in ('opened_v5', 'new_public_v6'):
              for scenario in report['results'][0]['splits'][split]:
                  cases = [r['splits'][split][scenario] for r in report['results']]
                  mean = lambda values: round(statistics.mean(values), 4)
                  print(json.dumps({
                      'split': split, 'scenario': scenario, 'gate': 'NOT_ADMITTED',
                      'map_exact': mean(c['unconditional_map_exact'] for c in cases),
                      'base_coverage': mean(c['baseline_guard']['coverage'] for c in cases),
                      'context_coverage': mean(c['context_guard']['coverage'] for c in cases),
                      'base_wrong_per_query': mean(c['baseline_guard']['covered_wrong_per_query'] for c in cases),
                      'context_wrong_per_query': mean(c['context_guard']['covered_wrong_per_query'] for c in cases),
                      'correct_newly_abstained': sum(len(c['previously_covered_correct_now_abstained']) for c in cases),
                      'wrong_newly_abstained': sum(len(c['previously_covered_wrong_now_abstained']) for c in cases),
                      'probes_per_world': mean(c['mean_physical_probes'] for c in cases),
                  }, sort_keys=True))
          PY
      - name: Archive unadmitted context diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: g1f-context-coverage-unadmitted
          path: g1f-context-audit.json
          retention-days: 30
      - name: Matched-parameter flat GRU public reference (NOT G1)
        run: |
          python -m experiments.predictive_nucleus.flat_trial \
            --train 600 --calibration 200 --worlds 10 --steps 200 \
            --seeds 7,11,23,37,53 > g1g-flat-reference.json
      - name: Show flat comparison and measured fit costs
        run: |
          python - <<'PY'
          import json, statistics
          report = json.load(open('g1g-flat-reference.json'))
          for r in report['results']:
              print(json.dumps({
                  'seed': r['model_seed'], 'gate': 'NOT_ADMITTED',
                  'structured_parameters': r['structured_training']['parameters'],
                  'flat_parameters': r['flat_training']['parameters'],
                  'structured_steps': r['structured_training']['gradient_steps'],
                  'flat_steps': r['flat_training']['gradient_steps'],
                  'structured_fit_seconds': r['structured_fit_seconds'],
                  'flat_fit_seconds': r['flat_training']['fit_seconds'],
                  'flat_budget_overshoot_seconds': r['flat_training']['overshoot_seconds'],
              }, sort_keys=True))
          for scenario in report['results'][0]['splits']['new_public_v7']:
              cases = [r['splits']['new_public_v7'][scenario] for r in report['results']]
              mean = lambda values: round(statistics.mean(values), 4)
              print(json.dumps({
                  'scenario': scenario, 'split': 'new_public_v7', 'gate': 'NOT_ADMITTED',
                  'structured_map_exact': mean(c['structured']['joint_map_exact'] for c in cases),
                  'flat_map_exact': mean(c['flat']['joint_map_exact'] for c in cases),
                  'structured_joint_nll': mean(c['structured']['joint_nll'] for c in cases),
                  'flat_joint_nll': mean(c['flat']['joint_nll'] for c in cases),
                      'joint_nll_note': 'LEGACY_CLIPPED_AT_1E-12',
                      'structured_floor_cases': sum(c['structured']['joint_log_score']['floor_applied_count'] for c in cases),
                      'structured_zero_probability_cases': sum(c['structured']['joint_log_score']['zero_probability_count'] for c in cases),
                      'flat_floor_cases': sum(c['flat']['joint_log_score']['floor_applied_count'] for c in cases),
                  'structured_coverage': mean(c['structured']['coverage'] for c in cases),
                  'flat_coverage': mean(c['flat']['coverage'] for c in cases),
                  'same_probes_per_world': mean(c['mean_physical_probes'] for c in cases),
              }, sort_keys=True))
          PY
      - name: Archive unadmitted flat reference
        uses: actions/upload-artifact@v4
        with:
          name: g1g-flat-recurrent-reference-unadmitted
          path: g1g-flat-reference.json
          retention-days: 30
      - name: Replay the recorded flat optimizer schedule
        run: |
          python - <<'PY'
          import json, subprocess, sys
          original = json.load(open('g1g-flat-reference.json'))
          steps = ','.join(str(r['flat_training']['gradient_steps']) for r in original['results'])
          command = [sys.executable, '-m', 'experiments.predictive_nucleus.flat_trial',
                     '--train', '600', '--calibration', '200', '--worlds', '10', '--steps', '200',
                     '--seeds', '7,11,23,37,53', '--flat-steps', steps]
          with open('g1g-flat-replay.json', 'w') as output:
              subprocess.run(command, stdout=output, check=True)
          replay = json.load(open('g1g-flat-replay.json'))
          for prior, again in zip(original['results'], replay['results'], strict=True):
              assert prior['model_seed'] == again['model_seed']
              assert prior['flat_training']['gradient_steps'] == again['flat_training']['gradient_steps']
              assert prior['flat_calibration'] == again['flat_calibration']
              for split in prior['splits']:
                  for scenario, old in prior['splits'][split].items():
                      new = again['splits'][split][scenario]
                      for key in ('structured', 'structured_context', 'flat',
                                  'structured_pair_both_exact', 'flat_pair_both_exact',
                                  'structured_correct_flat_wrong', 'flat_correct_structured_wrong',
                                  'structured_correct_case_ids', 'flat_correct_case_ids', 'public_trajectory_digests',
                                  'mean_physical_probes'):
                          assert old[key] == new[key], (split, scenario, key)
          print('Recorded optimizer schedules reproduce all paired scores; replay is not an independent challenge.')
          PY
      - name: Equal-update flat ablation (NOT G1)
        run: |
          python -m experiments.predictive_nucleus.flat_updates_trial \
            --train 600 --calibration 200 --worlds 10 --steps 200 \
            --seeds 7,11,23,37,53 > g1h-flat-updates.json
      - name: Show equal-update tradeoffs on new public worlds
        run: |
          python - <<'PY'
          import json, statistics
          report = json.load(open('g1h-flat-updates.json'))
          for r in report['results']:
              print(json.dumps({
                  'seed': r['model_seed'], 'gate': 'NOT_ADMITTED',
                  'structured_steps': r['structured_training']['gradient_steps'],
                  'wall_flat_steps': r['wall_flat_training']['gradient_steps'],
                  'equal_flat_steps': r['equal_flat_training']['gradient_steps'],
                  'structured_fit_seconds': r['structured_fit_seconds'],
                  'wall_flat_fit_seconds': r['wall_flat_training']['fit_seconds'],
                  'equal_flat_fit_seconds': r['equal_flat_training']['fit_seconds'],
                  'equal_to_structured_time_ratio': r['equal_flat_to_structured_fit_time_ratio'],
              }, sort_keys=True))
          for scenario in report['results'][0]['splits']['new_public_v8']:
              cases = [r['splits']['new_public_v8'][scenario] for r in report['results']]
              mean = lambda vals: round(statistics.mean(vals), 4)
              print(json.dumps({
                  'split': 'new_public_v8', 'scenario': scenario, 'gate': 'NOT_ADMITTED',
                  'structured_exact': mean(c['structured']['joint_map_exact'] for c in cases),
                  'wall_flat_exact': mean(c['wall_flat']['joint_map_exact'] for c in cases),
                  'equal_flat_exact': mean(c['equal_update_flat']['joint_map_exact'] for c in cases),
                  'structured_nll': mean(c['structured']['joint_nll'] for c in cases),
                  'wall_flat_nll': mean(c['wall_flat']['joint_nll'] for c in cases),
                  'equal_flat_nll': mean(c['equal_update_flat']['joint_nll'] for c in cases),
                  'joint_nll_note': 'LEGACY_CLIPPED_AT_1E-12',
                  'structured_floor_cases': sum(c['structured']['joint_log_score']['floor_applied_count'] for c in cases),
                  'structured_zero_probability_cases': sum(c['structured']['joint_log_score']['zero_probability_count'] for c in cases),
                  'equal_repairs': sum(len(c['equal_update_repairs']) for c in cases),
                  'equal_regressions': sum(len(c['equal_update_regressions']) for c in cases),
                  'probes_per_world': mean(c['mean_physical_probes'] for c in cases),
              }, sort_keys=True))
          PY
      - name: Archive unadmitted equal-update ablation
        uses: actions/upload-artifact@v4
        with:
          name: g1h-flat-equal-update-unadmitted
          path: g1h-flat-updates.json
          retention-days: 30
