name: Predictive nucleus — isolated scientific invariants
on:
  pull_request:
    paths:
      - 'experiments/predictive_nucleus/**'
      - '.github/workflows/predictive-nucleus*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-and-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.3.5'
      - name: Verify original protocol and every historical manifest
        run: |
          python -m experiments.predictive_nucleus.protocol verify
          cd experiments/predictive_nucleus
          for lock in snapshots/*.sha256; do sha256sum -c "$lock"; done
      - name: Run all isolated invariant tests including synthetic full pipeline
        run: python -m unittest discover -s experiments/predictive_nucleus/tests -v
      - name: Verify frozen comparison inputs without fitting
        run: python -m experiments.predictive_nucleus.comparison_execution --preflight > preflight.json
      - name: Retain preflight
        uses: actions/upload-artifact@v4
        with:
          name: common-objective-preflight-not-a-result
          path: preflight.json
          retention-days: 30
