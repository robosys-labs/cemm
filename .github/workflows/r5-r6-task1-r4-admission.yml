name: R5 R6 Task 1 current R4 ABI-4 admission

on:
  pull_request:
    branches:
      - agent/r5-r6-task1-r4-admission-ci-base-20260822
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: r5-r6-task1-r4-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ca4816bc892d14e7eb593f00977309e2031f131b
  TRIGGER_SHA: 4b45e32675ad0baa3b5cc8507735998a833c57d0
  CANDIDATE_BRANCH: agent/r5-r6-task1-r4-admission-candidate-20260822
  TARGET_BRANCH: agent/r4-task4-batch-publisher-20260816
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONHASHSEED: '0'
  PYTHONPATH: src:scripts:.

jobs:
  build_candidates:
    if: >-
      github.event.pull_request.head.ref == 'agent/r5-r6-task1-r4-admission-candidate-20260822' &&
      github.event.pull_request.head.sha == '4b45e32675ad0baa3b5cc8507735998a833c57d0'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca4816bc892d14e7eb593f00977309e2031f131b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fence exact source and install governed build dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --short --untracked-files=all)"
          python -m pip install \
            'pytest==8.4.0' \
            'hypothesis==6.163.0' \
            'numpy==2.5.2' \
            'safetensors==0.5.3' \
            'fastapi==0.115.0' \
            'httpx==0.27.0' \
            'jsonschema==4.25.1'
          python -m pip install 'torch==2.6.0' \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Build one authentic current-source ABI-4 candidate
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          output="/tmp/r4-task1-${{ matrix.slot }}"
          rm -rf "$output"
          python scripts/build_r4_artifacts.py \
            --environment src/cemm_authoritative_hybrid/r4_environment.py \
            --source-revision "$SOURCE_SHA" \
            --output "$output" \
            > "/tmp/r4-task1-${{ matrix.slot }}-build.json"
          python - "$output" "$SOURCE_SHA" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import sys

          from cemm_authoritative_hybrid.r4_admission import verify_r4_admission
          from cemm_authoritative_hybrid.r4_pipeline import R4BuildReceipt
          from cemm_authoritative_hybrid.r4_partition_contracts import SPLITS

          output = Path(sys.argv[1])
          source = sys.argv[2]
          receipt = R4BuildReceipt.from_dict(
              json.loads((output / 'BUILD_RECEIPT.json').read_text(encoding='utf-8'))
          )
          assert receipt.abi_version == 4
          assert receipt.source_revision == source
          report = verify_r4_admission(
              Path('.'),
              expected_source_revision=source,
              expected_authority_generation=receipt.authority_generation,
              candidate_root=output,
          )
          assert report['build_receipt_abi_version'] == 4
          assert report['artifact_count'] == 17
          paths = {
              path.relative_to(output).as_posix()
              for path in output.rglob('*')
              if path.is_file()
          }
          assert len(paths) == 17
          assert 'partition_evidence.json' in paths
          assert 'partition_sufficiency.json' in paths
          assert 'split_manifest.json' in paths
          assert 'capabilities/train.json' in paths
          assert 'authorizations/train.json' in paths
          assert 'training_allowlist.json' not in paths
          assert not any(path.startswith('partitions/') for path in paths)
          refs: set[str] = set()
          counts: dict[str, int] = {}
          for split in SPLITS:
              rows = [
                  json.loads(line)
                  for line in (output / 'splits' / f'{split}.jsonl')
                  .read_text(encoding='utf-8')
                  .splitlines()
                  if line
              ]
              assert rows
              episode_refs = [row['episode_ref'] for row in rows]
              assert episode_refs == sorted(episode_refs)
              assert not refs.intersection(episode_refs)
              refs.update(episode_refs)
              counts[split] = len(rows)
          assert sum(counts.values()) == 400
          manifest = []
          for path in sorted(item for item in output.rglob('*') if item.is_file()):
              raw = path.read_bytes()
              manifest.append({
                  'path': path.relative_to(output).as_posix(),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'size': len(raw),
              })
          (Path('/tmp') / 'r4-task1-${{ matrix.slot }}-manifest.json').write_text(
              json.dumps({
                  'counts': counts,
                  'files': manifest,
                  'receipt_ref': receipt.receipt_ref,
                  'report': report,
                  'source_revision': source,
              }, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
          test -z "$(git status --short --untracked-files=all)"
      - name: Create deterministic candidate archive
        run: |
          set -euo pipefail
          output="/tmp/r4-task1-${{ matrix.slot }}"
          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=gnu \
            -cf "/tmp/r4-task1-${{ matrix.slot }}.tar" \
            -C "$output" .
          sha256sum "/tmp/r4-task1-${{ matrix.slot }}.tar" \
            > "/tmp/r4-task1-${{ matrix.slot }}.tar.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: r4-task1-candidate-${{ matrix.slot }}
          path: |
            /tmp/r4-task1-${{ matrix.slot }}.tar
            /tmp/r4-task1-${{ matrix.slot }}.tar.sha256
            /tmp/r4-task1-${{ matrix.slot }}-manifest.json
            /tmp/r4-task1-${{ matrix.slot }}-build.json
          if-no-files-found: error
          retention-days: 7

  publish_artifact_commit:
    if: >-
      github.event.pull_request.head.ref == 'agent/r5-r6-task1-r4-admission-candidate-20260822' &&
      github.event.pull_request.head.sha == '4b45e32675ad0baa3b5cc8507735998a833c57d0'
    needs: build_candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_sha: ${{ steps.commit_artifacts.outputs.artifact_sha }}
      artifact_tree: ${{ steps.commit_artifacts.outputs.artifact_tree }}
      candidate_tar_sha256: ${{ steps.commit_artifacts.outputs.candidate_tar_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca4816bc892d14e7eb593f00977309e2031f131b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: r4-task1-candidate-a
          path: /tmp/download-a
      - uses: actions/download-artifact@v4
        with:
          name: r4-task1-candidate-b
          path: /tmp/download-b
      - name: Compare complete A/B bytes and independently reconstruct
        run: |
          set -euo pipefail
          sha_a="$(sha256sum /tmp/download-a/r4-task1-a.tar | cut -d' ' -f1)"
          sha_b="$(sha256sum /tmp/download-b/r4-task1-b.tar | cut -d' ' -f1)"
          test "$sha_a" = "$sha_b"
          test "$(cut -d' ' -f1 /tmp/download-a/r4-task1-a.tar.sha256)" = "$sha_a"
          test "$(cut -d' ' -f1 /tmp/download-b/r4-task1-b.tar.sha256)" = "$sha_b"
          diff -u \
            /tmp/download-a/r4-task1-a-manifest.json \
            /tmp/download-b/r4-task1-b-manifest.json
          rm -rf /tmp/r4-task1-candidate
          mkdir -p /tmp/r4-task1-candidate
          tar -xf /tmp/download-a/r4-task1-a.tar -C /tmp/r4-task1-candidate
          python -m pip install 'jsonschema==4.25.1'
          cd hybrid_mvp
          python - "$SOURCE_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys
          from cemm_authoritative_hybrid.r4_admission import verify_r4_admission
          from cemm_authoritative_hybrid.r4_pipeline import R4BuildReceipt

          source = sys.argv[1]
          candidate = Path('/tmp/r4-task1-candidate')
          receipt = R4BuildReceipt.from_dict(
              json.loads((candidate / 'BUILD_RECEIPT.json').read_text(encoding='utf-8'))
          )
          assert receipt.source_revision == source
          report = verify_r4_admission(
              Path('.'),
              expected_source_revision=source,
              expected_authority_generation=receipt.authority_generation,
              candidate_root=candidate,
          )
          assert report['build_receipt_abi_version'] == 4
          assert report['artifact_count'] == 17
          PY
      - name: Create exact artifact-only commit
        id: commit_artifacts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --short --untracked-files=all)"
          rm -rf hybrid_mvp/artifacts/r4
          mkdir -p hybrid_mvp/artifacts/r4
          cp -a /tmp/r4-task1-candidate/. hybrid_mvp/artifacts/r4/
          git add -A -- hybrid_mvp/artifacts/r4
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          test -z "$(printf '%s\n' "$changed" | grep -v '^hybrid_mvp/artifacts/r4/' || true)"
          test ! -e hybrid_mvp/artifacts/r4/training_allowlist.json
          test ! -d hybrid_mvp/artifacts/r4/partitions
          git config user.name 'CEMM Verification Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_AUTHOR_NAME='CEMM Verification Bot' \
          GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_AUTHOR_DATE='2026-08-22T12:00:00+01:00' \
          GIT_COMMITTER_NAME='CEMM Verification Bot' \
          GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_COMMITTER_DATE='2026-08-22T12:00:00+01:00' \
            git commit --no-gpg-sign -m 'build(r4): publish current ABI-4 artifact graph'
          artifact_sha="$(git rev-parse HEAD)"
          artifact_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test -z "$(git status --short --untracked-files=all)"
          candidate_tar_sha256="$(sha256sum /tmp/download-a/r4-task1-a.tar | cut -d' ' -f1)"
          printf 'artifact_sha=%s\n' "$artifact_sha" >> "$GITHUB_OUTPUT"
          printf 'artifact_tree=%s\n' "$artifact_tree" >> "$GITHUB_OUTPUT"
          printf 'candidate_tar_sha256=%s\n' "$candidate_tar_sha256" >> "$GITHUB_OUTPUT"
          candidate_ref="refs/heads/$CANDIDATE_BRANCH"
          git push \
            --force-with-lease="$candidate_ref:$TRIGGER_SHA" \
            origin HEAD:"$candidate_ref"
          test "$(git ls-remote origin "$candidate_ref" | cut -f1)" = "$artifact_sha"

  verify_r4_owners_and_phase:
    if: >-
      github.event.pull_request.head.ref == 'agent/r5-r6-task1-r4-admission-candidate-20260822' &&
      github.event.pull_request.head.sha == '4b45e32675ad0baa3b5cc8507735998a833c57d0'
    needs: publish_artifact_commit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARTIFACT_SHA: ${{ needs.publish_artifact_commit.outputs.artifact_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish_artifact_commit.outputs.artifact_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fence artifact-only lineage and install governed dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ARTIFACT_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          changed="$(git diff --name-only "$SOURCE_SHA" "$ARTIFACT_SHA")"
          test -n "$changed"
          test -z "$(printf '%s\n' "$changed" | grep -v '^hybrid_mvp/artifacts/r4/' || true)"
          test -z "$(git status --short --untracked-files=all)"
          python -m pip install \
            'pytest==8.4.0' \
            'hypothesis==6.163.0' \
            'numpy==2.5.2' \
            'safetensors==0.5.3' \
            'fastapi==0.115.0' \
            'httpx==0.27.0' \
            'jsonschema==4.25.1'
          python -m pip install 'torch==2.6.0' \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Run all exact R4 owner tiers
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          for owner in \
            artifact-integrity \
            expected-contract \
            governance \
            mutation-partition \
            structural-sufficiency \
            surface-expansion; do
            python scripts/validate_mvp.py \
              --phase R4 \
              --tier owner \
              --owner "$owner" \
              | tee "/tmp/r4-owner-$owner.json"
            python - "/tmp/r4-owner-$owner.json" "$owner" <<'PY'
          import json
          from pathlib import Path
          import sys
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert payload['phase'] == 'R4'
          assert payload['tier'] == 'owner'
          assert payload['owner'] == sys.argv[2]
          assert payload['disposition'] == 'passed', payload
          assert payload['fresh'] is True
          PY
          done
      - name: Run the exact R4 phase tier once
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          python scripts/validate_mvp.py --phase R4 --tier phase \
            | tee /tmp/r4-phase.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/r4-phase.json').read_text(encoding='utf-8'))
          assert payload['phase'] == 'R4'
          assert payload['tier'] == 'phase'
          assert payload['disposition'] == 'passed', payload
          assert payload['fresh'] is True
          PY
      - name: Verify metadata, inventory, hard cuts, and current red ledger
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          python scripts/verify_r3_r4_test_metadata.py
          for phase in G0 R1 R2 R3 R4 R5; do
            python scripts/check_test_inventory.py --phase "$phase" --source-only
          done
          python scripts/check_r3_r4_structure.py
          python scripts/audit_legacy_test_hard_cut.py
          status="$(python scripts/update_replay_status.py --verify-chain)"
          printf '%s\n' "$status"
          case "$status" in
            *'G0=green R1=green R2=green R3=green R4=red R5=red R6=red R7=red R8=red'*) ;;
            *) exit 1 ;;
          esac
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --short --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        with:
          name: r4-task1-owner-phase-evidence
          path: |
            /tmp/r4-owner-*.json
            /tmp/r4-phase.json
          if-no-files-found: error
          retention-days: 7

  admit_and_publish:
    if: >-
      github.event.pull_request.head.ref == 'agent/r5-r6-task1-r4-admission-candidate-20260822' &&
      github.event.pull_request.head.sha == '4b45e32675ad0baa3b5cc8507735998a833c57d0'
    needs: [publish_artifact_commit, verify_r4_owners_and_phase]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARTIFACT_SHA: ${{ needs.publish_artifact_commit.outputs.artifact_sha }}
      ARTIFACT_TREE: ${{ needs.publish_artifact_commit.outputs.artifact_tree }}
      CANDIDATE_TAR_SHA256: ${{ needs.publish_artifact_commit.outputs.candidate_tar_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish_artifact_commit.outputs.artifact_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fence exact artifact commit and install admission dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ARTIFACT_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$ARTIFACT_TREE"
          test -z "$(git status --short --untracked-files=all)"
          python -m pip install \
            'pytest==8.4.0' \
            'hypothesis==6.163.0' \
            'numpy==2.5.2' \
            'safetensors==0.5.3' \
            'fastapi==0.115.0' \
            'httpx==0.27.0' \
            'jsonschema==4.25.1'
          python -m pip install 'torch==2.6.0' \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Execute one fresh R4 admission
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          python scripts/validate_mvp.py --phase R4 --tier admission \
            | tee /tmp/r4-admission.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/r4-admission.json').read_text(encoding='utf-8'))
          assert payload['phase'] == 'R4'
          assert payload['tier'] == 'admission'
          assert payload['disposition'] == 'passed', payload
          assert payload['fresh'] is True
          assert payload['receipt_path'].startswith('artifacts/validation/runs/')
          assert payload['run_ref'].startswith('run:')
          assert payload['gate_result_ref'].startswith('gate_result:')
          Path('/tmp/r4-run-ref').write_text(payload['run_ref'], encoding='ascii')
          Path('/tmp/r4-gate-ref').write_text(payload['gate_result_ref'], encoding='ascii')
          Path('/tmp/r4-receipt-path').write_text(payload['receipt_path'], encoding='ascii')
          PY
      - name: Dry-run and append the exact green transition
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          run_ref="$(cat /tmp/r4-run-ref)"
          python scripts/update_replay_status.py \
            --phase R4 \
            --status green \
            --run-ref "$run_ref" \
            --dry-run \
            | tee /tmp/r4-status-candidate.json
          record_ref="$(python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/r4-status-candidate.json').read_text(encoding='utf-8'))
          assert value['phase'] == 'R4'
          assert value['status'] == 'green'
          print(value['record_ref'])
          PY
          )"
          python scripts/update_replay_status.py \
            --phase R4 \
            --status green \
            --run-ref "$run_ref" \
            --expect-record-ref "$record_ref" \
            --append \
            | tee /tmp/r4-status-appended.json
          diff -u /tmp/r4-status-candidate.json /tmp/r4-status-appended.json
          status="$(python scripts/update_replay_status.py --verify-chain)"
          printf '%s\n' "$status" | tee /tmp/r4-effective-status.txt
          case "$status" in
            *'G0=green R1=green R2=green R3=green R4=green R5=red R6=red R7=red R8=red'*) ;;
            *) exit 1 ;;
          esac
      - name: Commit exact admission evidence and publish target
        run: |
          set -euo pipefail
          receipt_relative="hybrid_mvp/$(cat /tmp/r4-receipt-path)"
          test -f "$receipt_relative"
          printf '%s\n' \
            "$receipt_relative" \
            'hybrid_mvp/governance/replay_status.jsonl' | sort > /tmp/expected-evidence-paths
          git status --short --untracked-files=all
          git add -- "$receipt_relative" hybrid_mvp/governance/replay_status.jsonl
          git diff --cached --name-only | sort > /tmp/actual-evidence-paths
          diff -u /tmp/expected-evidence-paths /tmp/actual-evidence-paths
          git diff --cached --check
          test -z "$(git status --short --untracked-files=all | grep -vE '^(A |M ) (hybrid_mvp/artifacts/validation/runs/[0-9a-f]{24}\.json|hybrid_mvp/governance/replay_status\.jsonl)$' || true)"
          git config user.name 'CEMM Verification Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --no-gpg-sign -m 'gov(r4): admit current ABI-4 artifact graph'
          final_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$ARTIFACT_SHA"
          test -z "$(git status --short --untracked-files=all)"

          candidate_ref="refs/heads/$CANDIDATE_BRANCH"
          target_ref="refs/heads/$TARGET_BRANCH"
          git push \
            --force-with-lease="$candidate_ref:$ARTIFACT_SHA" \
            origin HEAD:"$candidate_ref"
          test "$(git ls-remote origin "$candidate_ref" | cut -f1)" = "$final_sha"
          remote_target="$(git ls-remote origin "$target_ref" | cut -f1)"
          if [ "$remote_target" = "$SOURCE_SHA" ]; then
            git push origin HEAD:"$target_ref"
          else
            test "$remote_target" = "$final_sha"
          fi
          test "$(git ls-remote origin "$target_ref" | cut -f1)" = "$final_sha"
          printf '%s' "$final_sha" > /tmp/r4-final-sha
      - name: Write bounded Task 1 publication receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          final_sha = Path('/tmp/r4-final-sha').read_text(encoding='ascii')
          payload = {
              'schema': 'cemm-r5-r6-task1-r4-current-admission-v1',
              'source_sha': 'ca4816bc892d14e7eb593f00977309e2031f131b',
              'artifact_sha': '${{ needs.publish_artifact_commit.outputs.artifact_sha }}',
              'artifact_tree': '${{ needs.publish_artifact_commit.outputs.artifact_tree }}',
              'final_sha': final_sha,
              'candidate_tar_sha256': '${{ needs.publish_artifact_commit.outputs.candidate_tar_sha256 }}',
              'run_ref': Path('/tmp/r4-run-ref').read_text(encoding='ascii'),
              'gate_result_ref': Path('/tmp/r4-gate-ref').read_text(encoding='ascii'),
              'receipt_path': Path('/tmp/r4-receipt-path').read_text(encoding='ascii'),
              'effective_status': Path('/tmp/r4-effective-status.txt').read_text(encoding='utf-8').strip(),
              'artifact_file_count': 17,
              'episode_count': 400,
              'build_receipt_abi_version': 4,
              'r5_source_implementation_unblocked': True,
          }
          Path('/tmp/r5-r6-task1-r4-admission.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cemm-r5-r6-task1-r4-admission
          path: |
            /tmp/r4-admission.json
            /tmp/r4-status-candidate.json
            /tmp/r4-status-appended.json
            /tmp/r4-effective-status.txt
            /tmp/r5-r6-task1-r4-admission.json
          if-no-files-found: error
          retention-days: 7
