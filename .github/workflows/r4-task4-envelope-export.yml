name: R4 Task 4 envelope export

on:
  push:
    branches:
      - codex/r4-task4-publication
    paths:
      - .github/workflows/r4-task4-envelope-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r4-task4-publication
          fetch-depth: 1

      - name: Inventory all independently staged Task 4 payloads
        shell: bash
        run: |
          set -euo pipefail
          find .github -maxdepth 3 -type f \
            \( -path '.github/r4-task4-source-*/*' \
               -o -path '.github/r4-task4-publisher-*/*' \
               -o -name 'r4_task4_source_patch.gz.b64' \
               -o -name 'r4_task4_publish.py.gz.b64' \) \
            -print0 | sort -z | xargs -0 sha256sum \
            > /tmp/R4_TASK4_ALL_PAYLOAD_SHA256SUMS
          cat /tmp/R4_TASK4_ALL_PAYLOAD_SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: cemm-r4-task4-all-staged-payloads
          path: |
            .github/r4-task4-source-*/**
            .github/r4-task4-publisher-*/**
            .github/r4_task4_source_patch.gz.b64
            .github/r4_task4_publish.py.gz.b64
            /tmp/R4_TASK4_ALL_PAYLOAD_SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
