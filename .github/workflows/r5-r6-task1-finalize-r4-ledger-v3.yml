name: R5 R6 Task 1 observable final R4 ABI-4 closure

on:
  pull_request:
    branches:
      - agent/r5-r6-task1-r4-current-admission-ci-base-20260822
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: r5-r6-task1-observable-final-r4-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close-r4:
    if: >-
      github.event.pull_request.head.ref == 'agent/r5-r6-task1-r4-ledger-final-trigger-20260822' &&
      github.event.pull_request.head.sha == '1d31bfa770ed9224e1735a897cc69e5c1652bb3f'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONHASHSEED: '0'
      CANDIDATE_BRANCH: agent/r5-r6-task1-r4-ledger-fix2-candidate-20260822
      TARGET_BRANCH: agent/r4-task4-batch-publisher-20260816
      TARGET_BASE_SHA: ca4816bc892d14e7eb593f00977309e2031f131b
      STABILITY_SHA: 879e421cc731522677fe2db0006d18d6a634e9cb
      EVIDENCE_DIR: /tmp/r5-r6-task1-final-evidence
      BUILD_A: /tmp/r5-r6-task1-final-build-a
      BUILD_B: /tmp/r5-r6-task1-final-build-b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-r6-task1-r4-ledger-fix2-candidate-20260822
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Commit exact historical-evidence replay fix
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "${STABILITY_SHA}"
          python - <<'PY'
          from pathlib import Path

          path = Path('candidate/hybrid_mvp/scripts/update_replay_status.py')
          text = path.read_text(encoding='utf-8')
          old = """    captured_allowed = _normalize_allowed_evidence_paths(
              captured_paths, require_files=require_evidence_files
          )"""
          new = """    # These paths were already authenticated by _verify_admitted_runs and,
              # for a new transition, _validated_admission. Historical R4 ABI-3
              # evidence may be intentionally absent after the hard cut; the
              # revalidation closure below still enforces current evidence files.
              captured_allowed = _normalize_allowed_evidence_paths(
                  captured_paths, require_files=False
              )"""
          count = text.count(old)
          if count != 1:
              raise AssertionError(
                  f'expected post-write evidence normalization once, found {count}'
              )
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git -C candidate diff --check
          printf '%s\n' 'hybrid_mvp/scripts/update_replay_status.py' > /tmp/task1-source.expected
          git -C candidate diff --name-only | sort > /tmp/task1-source.actual
          diff -u /tmp/task1-source.expected /tmp/task1-source.actual
          git -C candidate config user.name 'CEMM Verification Bot'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate add -- hybrid_mvp/scripts/update_replay_status.py
          GIT_AUTHOR_NAME='CEMM Verification Bot' \
          GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_AUTHOR_DATE='2026-08-22T23:52:00+01:00' \
          GIT_COMMITTER_NAME='CEMM Verification Bot' \
          GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_COMMITTER_DATE='2026-08-22T23:52:00+01:00' \
            git -C candidate commit --no-gpg-sign -m 'fix(r4): retain historical admission evidence replay'
          SOURCE_SHA="$(git -C candidate rev-parse HEAD)"
          test "$(git -C candidate rev-parse HEAD^)" = "${STABILITY_SHA}"
          test -z "$(git -C candidate status --short --untracked-files=all)"
          ref="refs/heads/${CANDIDATE_BRANCH}"
          git -C candidate push \
            --force-with-lease="${ref}:${STABILITY_SHA}" \
            origin "${SOURCE_SHA}:${ref}"
          test "$(git -C candidate ls-remote origin "${ref}" | cut -f1)" = "${SOURCE_SHA}"
          printf 'SOURCE_SHA=%s\n' "${SOURCE_SHA}" >> "${GITHUB_ENV}"

      - name: Install governed R4 verification dependencies
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python -m pip install \
            'pytest==8.4.0' \
            'hypothesis==6.163.0' \
            'numpy==2.5.2' \
            'safetensors==0.5.3' \
            'fastapi==0.115.0' \
            'httpx==0.27.0' \
            'jsonschema==4.25.1'
          python -m pip install 'torch==2.6.0' \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Verify corrected source before artifact generation
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          test "$(git -C .. rev-parse HEAD)" = "${SOURCE_SHA}"
          python scripts/verify_r3_r4_test_metadata.py | tee "${EVIDENCE_DIR}/metadata-pre-build.txt"
          python scripts/generate_r5_test_dispositions.py \
            --check artifacts/validation/R5_TEST_DISPOSITIONS.json
          for phase in G0 R1 R2 R3 R4 R5; do
            python scripts/check_test_inventory.py --phase "${phase}" --source-only \
              > "${EVIDENCE_DIR}/inventory-pre-${phase}.json"
          done
          python scripts/check_r3_r4_structure.py | tee "${EVIDENCE_DIR}/structure-pre.txt"
          python scripts/audit_legacy_test_hard_cut.py | tee "${EVIDENCE_DIR}/legacy-pre.json"
          pre_status="$(python scripts/update_replay_status.py --verify-chain)"
          printf '%s\n' "${pre_status}" > "${EVIDENCE_DIR}/pre-status.txt"
          test "${pre_status}" = 'G0=green R1=green R2=green R3=green R4=red R5=red R6=red R7=red R8=red invalidations=6'
          python -m pytest \
            tests/test_r4_validation_gate.py::test_r4_admission_evidence_policy_is_sorted_and_unique \
            -q -p no:cacheprovider

      - name: Build and independently authenticate two ABI-4 graphs
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          rm -rf "${BUILD_A}" "${BUILD_B}"
          (
            python scripts/build_r4_artifacts.py \
              --environment src/cemm_authoritative_hybrid/r4_environment.py \
              --source-revision "${SOURCE_SHA}" \
              --output "${BUILD_A}" \
              > "${EVIDENCE_DIR}/build-a.json"
          ) & pid_a=$!
          (
            python scripts/build_r4_artifacts.py \
              --environment src/cemm_authoritative_hybrid/r4_environment.py \
              --source-revision "${SOURCE_SHA}" \
              --output "${BUILD_B}" \
              > "${EVIDENCE_DIR}/build-b.json"
          ) & pid_b=$!
          wait "${pid_a}"
          wait "${pid_b}"

          python - "${BUILD_A}" "${BUILD_B}" "${SOURCE_SHA}" "${EVIDENCE_DIR}" <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          import sys

          from cemm_authoritative_hybrid.r4_admission import verify_r4_admission
          from cemm_authoritative_hybrid.r4_pipeline import R4BuildReceipt
          from cemm_authoritative_hybrid.r4_partition_contracts import SPLITS

          a = Path(sys.argv[1])
          b = Path(sys.argv[2])
          source = sys.argv[3]
          evidence = Path(sys.argv[4])
          expected_paths = {
              'BUILD_RECEIPT.json',
              'authorizations/train.json',
              'capabilities/train.json',
              'episodes.jsonl',
              'expanded_cases.jsonl',
              'expected_contracts.jsonl',
              'expected_derivations.jsonl',
              'mutation_observations.jsonl',
              'mutations.jsonl',
              'partition_evidence.json',
              'partition_sufficiency.json',
              'split_manifest.json',
              'splits/calibration.jsonl',
              'splits/frozen_test.jsonl',
              'splits/selection.jsonl',
              'splits/train.jsonl',
              'structural_sufficiency.json',
          }

          def inspect(root: Path) -> dict[str, object]:
              receipt = R4BuildReceipt.from_dict(
                  json.loads((root / 'BUILD_RECEIPT.json').read_text())
              )
              assert receipt.abi_version == 4
              assert receipt.source_revision == source
              report = verify_r4_admission(
                  Path('.').resolve(),
                  expected_source_revision=source,
                  expected_authority_generation=receipt.authority_generation,
                  candidate_root=root,
              )
              assert report['build_receipt_abi_version'] == 4
              paths = {
                  p.relative_to(root).as_posix()
                  for p in root.rglob('*')
                  if p.is_file()
              }
              assert paths == expected_paths
              seen: set[str] = set()
              counts: dict[str, int] = {}
              for split in SPLITS:
                  rows = [
                      json.loads(line)
                      for line in (root / 'splits' / f'{split}.jsonl').read_text().splitlines()
                      if line
                  ]
                  refs = [row['episode_ref'] for row in rows]
                  assert refs == sorted(refs)
                  assert not seen.intersection(refs)
                  seen.update(refs)
                  counts[split] = len(rows)
              assert sum(counts.values()) == 400
              files = []
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  raw = path.read_bytes()
                  files.append(
                      {
                          'path': path.relative_to(root).as_posix(),
                          'sha256': hashlib.sha256(raw).hexdigest(),
                          'size': len(raw),
                      }
                  )
              return {
                  'counts': counts,
                  'files': files,
                  'receipt_ref': receipt.receipt_ref,
                  'report': report,
                  'source': source,
              }

          manifest_a = inspect(a)
          manifest_b = inspect(b)
          assert manifest_a == manifest_b
          (evidence / 'candidate-manifest.json').write_text(
              json.dumps(manifest_a, sort_keys=True, separators=(',', ':')) + '\n'
          )
          PY

          for slot in a b; do
            if test "${slot}" = a; then dir="${BUILD_A}"; else dir="${BUILD_B}"; fi
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --format=gnu \
              -cf "${EVIDENCE_DIR}/candidate-${slot}.tar" -C "${dir}" .
          done
          sha_a="$(sha256sum "${EVIDENCE_DIR}/candidate-a.tar" | cut -d' ' -f1)"
          sha_b="$(sha256sum "${EVIDENCE_DIR}/candidate-b.tar" | cut -d' ' -f1)"
          test "${sha_a}" = "${sha_b}"
          printf '%s\n' "${sha_a}" > "${EVIDENCE_DIR}/candidate-tar.sha256"
          printf 'CANDIDATE_TAR_SHA=%s\n' "${sha_a}" >> "${GITHUB_ENV}"

      - name: Publish artifact-only candidate commit
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "${SOURCE_SHA}"
          rm -rf candidate/hybrid_mvp/artifacts/r4
          mkdir -p candidate/hybrid_mvp/artifacts/r4
          cp -a "${BUILD_A}/." candidate/hybrid_mvp/artifacts/r4/
          git -C candidate add -A -- hybrid_mvp/artifacts/r4
          git -C candidate diff --cached --check
          changed="$(git -C candidate diff --cached --name-only)"
          test -n "${changed}"
          test -z "$(printf '%s\n' "${changed}" | grep -v '^hybrid_mvp/artifacts/r4/' || true)"
          test ! -e candidate/hybrid_mvp/artifacts/r4/training_allowlist.json
          test ! -d candidate/hybrid_mvp/artifacts/r4/partitions
          GIT_AUTHOR_NAME='CEMM Verification Bot' \
          GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_AUTHOR_DATE='2026-08-22T23:54:00+01:00' \
          GIT_COMMITTER_NAME='CEMM Verification Bot' \
          GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_COMMITTER_DATE='2026-08-22T23:54:00+01:00' \
            git -C candidate commit --no-gpg-sign -m 'build(r4): publish current ABI-4 artifact graph'
          ARTIFACT_SHA="$(git -C candidate rev-parse HEAD)"
          test "$(git -C candidate rev-parse HEAD^)" = "${SOURCE_SHA}"
          test -z "$(git -C candidate status --short --untracked-files=all)"
          ref="refs/heads/${CANDIDATE_BRANCH}"
          git -C candidate push \
            --force-with-lease="${ref}:${SOURCE_SHA}" \
            origin "${ARTIFACT_SHA}:${ref}"
          test "$(git -C candidate ls-remote origin "${ref}" | cut -f1)" = "${ARTIFACT_SHA}"
          printf 'ARTIFACT_SHA=%s\n' "${ARTIFACT_SHA}" >> "${GITHUB_ENV}"
          printf '%s\n' "${ARTIFACT_SHA}" > "${EVIDENCE_DIR}/artifact-sha.txt"

      - name: Execute all R4 owners, phase, admission, and green transition
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          test "$(git -C .. rev-parse HEAD)" = "${ARTIFACT_SHA}"

          assert_outcome() {
            python - "$1" "$2" "$3" "${4:-}" <<'PY'
          import json
          from pathlib import Path
          import sys
          path, phase, tier, owner = sys.argv[1:]
          value = json.loads(Path(path).read_text(encoding='utf-8'))
          assert value['phase'] == phase, value
          assert value['tier'] == tier, value
          assert value['disposition'] == 'passed', value
          assert value['fresh'] is True, value
          if owner:
              assert value['owner'] == owner, value
          PY
          }

          for owner in \
            artifact-integrity \
            expected-contract \
            governance \
            mutation-partition \
            structural-sufficiency \
            surface-expansion; do
            python scripts/validate_mvp.py --phase R4 --tier owner --owner "${owner}" \
              > "${EVIDENCE_DIR}/owner-${owner}.json"
            assert_outcome "${EVIDENCE_DIR}/owner-${owner}.json" R4 owner "${owner}"
          done

          python scripts/validate_mvp.py --phase R4 --tier phase \
            > "${EVIDENCE_DIR}/phase.json"
          assert_outcome "${EVIDENCE_DIR}/phase.json" R4 phase

          python scripts/verify_r3_r4_test_metadata.py \
            > "${EVIDENCE_DIR}/metadata-post-artifact.txt"
          for phase in G0 R1 R2 R3 R4 R5; do
            python scripts/check_test_inventory.py --phase "${phase}" --source-only \
              > "${EVIDENCE_DIR}/inventory-post-${phase}.json"
          done
          python scripts/check_r3_r4_structure.py \
            > "${EVIDENCE_DIR}/structure-post-artifact.txt"
          python scripts/audit_legacy_test_hard_cut.py \
            > "${EVIDENCE_DIR}/legacy-post-artifact.json"
          pre_status="$(python scripts/update_replay_status.py --verify-chain)"
          printf '%s\n' "${pre_status}" > "${EVIDENCE_DIR}/pre-admission-status.txt"
          test "${pre_status}" = 'G0=green R1=green R2=green R3=green R4=red R5=red R6=red R7=red R8=red invalidations=6'
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git -C .. status --short --untracked-files=all)"

          python scripts/validate_mvp.py --phase R4 --tier admission \
            > "${EVIDENCE_DIR}/admission.json"
          assert_outcome "${EVIDENCE_DIR}/admission.json" R4 admission

          readarray -t admission_fields < <(
            python - "${EVIDENCE_DIR}/admission.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text())
          assert value['run_ref'].startswith('run:')
          assert value['gate_result_ref'].startswith('gate_result:')
          assert value['receipt_path'].startswith('artifacts/validation/runs/')
          print(value['run_ref'])
          print(value['gate_result_ref'])
          print(value['receipt_path'])
          PY
          )
          RUN_REF="${admission_fields[0]}"
          GATE_REF="${admission_fields[1]}"
          RECEIPT_PATH="${admission_fields[2]}"

          python scripts/update_replay_status.py \
            --phase R4 --status green --run-ref "${RUN_REF}" --dry-run \
            > "${EVIDENCE_DIR}/status-candidate.json"
          RECORD_REF="$(
            python - "${EVIDENCE_DIR}/status-candidate.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text())
          assert value['phase'] == 'R4'
          assert value['status'] == 'green'
          print(value['record_ref'])
          PY
          )"
          python scripts/update_replay_status.py \
            --phase R4 --status green --run-ref "${RUN_REF}" \
            --expect-record-ref "${RECORD_REF}" --append \
            > "${EVIDENCE_DIR}/status-appended.json"
          diff -u \
            "${EVIDENCE_DIR}/status-candidate.json" \
            "${EVIDENCE_DIR}/status-appended.json"
          final_status="$(python scripts/update_replay_status.py --verify-chain)"
          printf '%s\n' "${final_status}" > "${EVIDENCE_DIR}/effective-status.txt"
          test "${final_status}" = 'G0=green R1=green R2=green R3=green R4=green R5=red R6=red R7=red R8=red invalidations=6'

          printf 'RUN_REF=%s\n' "${RUN_REF}" >> "${GITHUB_ENV}"
          printf 'GATE_REF=%s\n' "${GATE_REF}" >> "${GITHUB_ENV}"
          printf 'RECEIPT_PATH=%s\n' "${RECEIPT_PATH}" >> "${GITHUB_ENV}"
          printf 'FINAL_STATUS=%s\n' "${final_status}" >> "${GITHUB_ENV}"

      - name: Commit admission evidence and fast-forward production R4 target
        run: |
          set -euo pipefail
          RECEIPT_RELATIVE="hybrid_mvp/${RECEIPT_PATH}"
          test -f "candidate/${RECEIPT_RELATIVE}"
          printf '%s\n' \
            "${RECEIPT_RELATIVE}" \
            'hybrid_mvp/governance/replay_status.jsonl' | sort \
            > /tmp/task1-final.expected
          git -C candidate add -- \
            "${RECEIPT_RELATIVE}" \
            hybrid_mvp/governance/replay_status.jsonl
          git -C candidate diff --cached --name-only | sort > /tmp/task1-final.actual
          diff -u /tmp/task1-final.expected /tmp/task1-final.actual
          git -C candidate diff --cached --check
          unexpected="$(
            git -C candidate status --short --untracked-files=all |
              grep -vE '^(A |M ) (hybrid_mvp/artifacts/validation/runs/[0-9a-f]{24}\.json|hybrid_mvp/governance/replay_status\.jsonl)$' || true
          )"
          test -z "${unexpected}"
          GIT_AUTHOR_NAME='CEMM Verification Bot' \
          GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_AUTHOR_DATE='2026-08-22T23:56:00+01:00' \
          GIT_COMMITTER_NAME='CEMM Verification Bot' \
          GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_COMMITTER_DATE='2026-08-22T23:56:00+01:00' \
            git -C candidate commit --no-gpg-sign -m 'gov(r4): admit current ABI-4 artifact graph'
          FINAL_SHA="$(git -C candidate rev-parse HEAD)"
          test "$(git -C candidate rev-parse HEAD^)" = "${ARTIFACT_SHA}"
          test -z "$(git -C candidate status --short --untracked-files=all)"

          candidate_ref="refs/heads/${CANDIDATE_BRANCH}"
          git -C candidate push \
            --force-with-lease="${candidate_ref}:${ARTIFACT_SHA}" \
            origin "${FINAL_SHA}:${candidate_ref}"
          test "$(git -C candidate ls-remote origin "${candidate_ref}" | cut -f1)" = "${FINAL_SHA}"

          target_ref="refs/heads/${TARGET_BRANCH}"
          remote_target="$(git -C candidate ls-remote origin "${target_ref}" | cut -f1)"
          if test "${remote_target}" = "${TARGET_BASE_SHA}"; then
            git -C candidate push \
              --force-with-lease="${target_ref}:${TARGET_BASE_SHA}" \
              origin "${FINAL_SHA}:${target_ref}"
          else
            test "${remote_target}" = "${FINAL_SHA}"
          fi
          test "$(git -C candidate ls-remote origin "${target_ref}" | cut -f1)" = "${FINAL_SHA}"

          cd candidate/hybrid_mvp
          post_status="$(python scripts/update_replay_status.py --verify-chain)"
          test "${post_status}" = "${FINAL_STATUS}"
          cd ../..

          python - "${SOURCE_SHA}" "${ARTIFACT_SHA}" "${FINAL_SHA}" \
            "${CANDIDATE_TAR_SHA}" "${RUN_REF}" "${GATE_REF}" \
            "${RECEIPT_PATH}" "${FINAL_STATUS}" <<'PY'
          import json
          from pathlib import Path
          import sys
          source, artifact, final, tar_sha, run_ref, gate_ref, receipt_path, status = sys.argv[1:]
          Path('/tmp/r5-r6-task1-final-evidence/publication.json').write_text(
              json.dumps(
                  {
                      'schema': 'cemm-r5-r6-task1-r4-current-admission-v4',
                      'source_sha': source,
                      'artifact_sha': artifact,
                      'final_sha': final,
                      'candidate_tar_sha256': tar_sha,
                      'run_ref': run_ref,
                      'gate_result_ref': gate_ref,
                      'receipt_path': receipt_path,
                      'effective_status': status,
                      'artifact_file_count': 17,
                      'episode_count': 400,
                      'build_receipt_abi_version': 4,
                      'r5_source_implementation_unblocked': True,
                  },
                  sort_keys=True,
                  indent=2,
              ) + '\n'
          )
          PY
          printf 'FINAL_SHA=%s\n' "${FINAL_SHA}" >> "${GITHUB_ENV}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cemm-r5-r6-task1-observable-final-r4-v3
          path: /tmp/r5-r6-task1-final-evidence/**
          if-no-files-found: warn
          retention-days: 7
