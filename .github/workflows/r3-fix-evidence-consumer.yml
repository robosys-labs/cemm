name: R3 fix admission evidence consumer

on:
  push:
    branches: [codex/r3-r4-closeout-learning]
    paths: [.github/workflows/r3-fix-evidence-consumer.yml]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r3-r4-closeout-learning
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Extend closed evidence policy through R4
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/update_replay_status.py')
          text = path.read_text(encoding='utf-8')
          old_constants = "\n".join((
              '_FIXED_EVIDENCE_PATHS = {',
              '    "artifacts/validation/BASELINE_REPLAY_FINDINGS.json",',
              '    "artifacts/validation/TEST_INVENTORY_RECEIPT.json",',
              '}',
              '',
          ))
          new_constants = "\n".join((
              '_PHASE_ADMISSION_EVIDENCE_PATHS = {',
              '    "G0": frozenset(',
              '        {',
              '            "artifacts/validation/BASELINE_REPLAY_FINDINGS.json",',
              '            "artifacts/validation/TEST_INVENTORY_RECEIPT.json",',
              '        }',
              '    ),',
              '    "R1": frozenset(),',
              '    "R2": frozenset(),',
              '    "R3": frozenset(',
              '        {"artifacts/validation/R3_ACTIVATION_CANARIES.json"}',
              '    ),',
              '    "R4": frozenset(',
              '        {',
              '            "artifacts/r4/expected_contracts.jsonl",',
              '            "artifacts/r4/expected_derivations.jsonl",',
              '            "artifacts/r4/expanded_cases.jsonl",',
              '            "artifacts/r4/episodes.jsonl",',
              '            "artifacts/r4/mutations.jsonl",',
              '            "artifacts/r4/mutation_observations.jsonl",',
              '            "artifacts/r4/structural_sufficiency.json",',
              '            "artifacts/r4/partitions/general.json",',
              '            "artifacts/r4/partitions/lexical.json",',
              '            "artifacts/r4/partitions/semantic_target.json",',
              '            "artifacts/r4/partitions/topology.json",',
              '            "artifacts/r4/partitions/dialogue.json",',
              '            "artifacts/r4/partitions/mutation.json",',
              '            "artifacts/r4/partitions/realization.json",',
              '            "artifacts/r4/training_allowlist.json",',
              '            "artifacts/r4/BUILD_RECEIPT.json",',
              '            "data/review/R4_REVIEW_MANIFEST.json",',
              '        }',
              '    ),',
              '    "R5": frozenset(),',
              '    "R6": frozenset(),',
              '    "R7": frozenset(),',
              '    "R8": frozenset(),',
              '}',
              '_FIXED_EVIDENCE_PATHS = frozenset().union(',
              '    *_PHASE_ADMISSION_EVIDENCE_PATHS.values()',
              ')',
              '',
          ))
          if text.count(old_constants) != 1:
              raise SystemExit('unexpected replay evidence-allowlist source state')
          text = text.replace(old_constants, new_constants, 1)

          start = text.index('def _static_evidence_candidates(')
          end = text.index('\n\ndef _preflight_owner_import(', start)
          old_static = text[start:end]
          new_static = "\n".join((
              'def _static_evidence_candidates(',
              '    phase: str, run_ref: str | None',
              ') -> frozenset[str]:',
              '    if phase not in _PHASE_ADMISSION_EVIDENCE_PATHS:',
              '        raise GovernanceError("admission phase is invalid")',
              '    phase_evidence = _PHASE_ADMISSION_EVIDENCE_PATHS[phase]',
              '    if run_ref is None:',
              '        return phase_evidence',
              '    if _RUN_REF_RE.fullmatch(run_ref) is None:',
              '        raise GovernanceError("admission run_ref must be an exact run: content ref")',
              '    digest = run_ref.removeprefix("run:")',
              '    return frozenset(',
              '        {',
              '            *phase_evidence,',
              '            f"artifacts/validation/runs/{digest}.json",',
              '        }',
              '    )',
          ))
          if 'return frozenset(_FIXED_EVIDENCE_PATHS)' not in old_static:
              raise SystemExit('unexpected static-evidence candidate source state')
          text = text[:start] + new_static + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify evidence policy matches admission owner
        working-directory: hybrid_mvp
        env:
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, 'scripts')
          import update_replay_status as replay
          from cemm_authoritative_hybrid import process_control as process_control_module
          sys.modules['process_control'] = process_control_module
          import validation_gate as gate

          for phase in ('G0', 'R1', 'R2', 'R3', 'R4'):
              expected = frozenset(gate._required_admission_evidence_paths(phase))
              actual = replay._PHASE_ADMISSION_EVIDENCE_PATHS[phase]
              if actual != expected:
                  raise SystemExit(
                      f'evidence policy drift for {phase}: expected={sorted(expected)!r} actual={sorted(actual)!r}'
                  )
          expected_r3 = frozenset({
              'artifacts/validation/R3_ACTIVATION_CANARIES.json',
              'artifacts/validation/runs/' + 'a' * 24 + '.json',
          })
          if replay._static_evidence_candidates('R3', 'run:' + 'a' * 24) != expected_r3:
              raise SystemExit('R3 preflight evidence candidates are not phase-scoped')
          if 'artifacts/r4/BUILD_RECEIPT.json' in replay._static_evidence_candidates('R3', None):
              raise SystemExit('R3 preflight unexpectedly admits R4 evidence')
          normalized = replay._normalize_allowed_evidence_paths(
              ('artifacts/validation/R3_ACTIVATION_CANARIES.json',),
              root=Path('.'),
              require_files=True,
          )
          if normalized != frozenset({'artifacts/validation/R3_ACTIVATION_CANARIES.json'}):
              raise SystemExit('R3 canary evidence normalization failed')
          try:
              replay._normalize_allowed_evidence_paths(
                  ('artifacts/validation/NOT_REVIEWED.json',),
                  root=Path('.'),
                  require_files=False,
              )
          except replay.GovernanceError:
              pass
          else:
              raise SystemExit('unreviewed validation evidence path was accepted')
          print('Replay evidence policy matches reviewed admission evidence through R4')
          PY
          python -m pip install 'pytest==8.4.0'
          python -m pytest -q tests/test_replay_governance.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit evidence-consumer correction
        run: |
          set -euo pipefail
          rm -f .github/workflows/r3-fix-evidence-consumer.yml
          git add -A
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          expected = {
              '.github/workflows/r3-fix-evidence-consumer.yml',
              'hybrid_mvp/scripts/update_replay_status.py',
          }
          if changed != expected:
              raise SystemExit(f'unexpected replay-evidence diff: {sorted(changed)!r}')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(r3): consume phase-scoped admission evidence'
          git push origin HEAD:codex/r3-r4-closeout-learning
