name: R4 Task 8 evidence-policy verification and publication

on:
  pull_request:
    branches:
      - agent/r4-task8-evidence-policy-ci-base-20260820
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: r4-task8-evidence-policy-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.event.pull_request.head.ref == 'agent/r4-task8-evidence-policy-publish-head-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: src:scripts:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-task8-evidence-policy-publish-head-20260820
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-task8-evidence-policy-ci-base-20260820
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fence control and classify the current candidate head
        run: |
          set -euo pipefail
          reviewed_parent='b8b180a1faac6e0f9460f8939dd1386859cb99aa'
          head_sha="$(git -C candidate rev-parse HEAD)"
          test '${{ github.event.pull_request.base.ref }}' = 'agent/r4-task8-evidence-policy-ci-base-20260820'
          test '${{ github.event.pull_request.head.ref }}' = 'agent/r4-task8-evidence-policy-publish-head-20260820'
          test "$(git -C candidate rev-parse HEAD^)" = "$reviewed_parent"
          printf '%s\n' '.github/r4-task8-status/evidence-policy-publish-trigger.json' > /tmp/expected-trigger-head
          printf '%s\n' \
            'hybrid_mvp/scripts/update_replay_status.py' \
            'hybrid_mvp/scripts/validation_gate.py' \
            'hybrid_mvp/tests/test_r4_validation_gate.py' | sort > /tmp/expected-code-head
          git -C candidate diff --name-only "$reviewed_parent" "$head_sha" | sort > /tmp/actual-head
          if diff -q /tmp/expected-trigger-head /tmp/actual-head >/dev/null; then
            cat > /tmp/expected-trigger.json <<'JSON'
          {
            "purpose": "trigger the deterministic Task 8 evidence-policy verifier and publisher",
            "replace_with_parent": "b8b180a1faac6e0f9460f8939dd1386859cb99aa"
          }
          JSON
            cmp /tmp/expected-trigger.json candidate/.github/r4-task8-status/evidence-policy-publish-trigger.json
          else
            diff -u /tmp/expected-code-head /tmp/actual-head
          fi
          test "$(git -C control merge-base "$reviewed_parent" HEAD)" = "$reviewed_parent"
          printf '%s\n' \
            '.github/r4-task8/evidence-policy.patch.gz.b64' \
            '.github/workflows/r4-task8-evidence-policy-patch.yml' \
            '.github/workflows/r4-task8-evidence-policy-publish.yml' | sort > /tmp/expected-control
          git -C control diff --name-only "$reviewed_parent" HEAD | sort > /tmp/actual-control
          diff -u /tmp/expected-control /tmp/actual-control
          test "$(git -C control hash-object .github/r4-task8/evidence-policy.patch.gz.b64)" = '8cdd6366a88811f0b10ea30017f94fe32b399b6f'
          printf 'INITIAL_HEAD_SHA=%s\n' "$head_sha" >> "$GITHUB_ENV"
          git -C candidate checkout --detach "$reviewed_parent"
      - name: Reconstruct and authenticate the reviewed source tree
        run: |
          set -euo pipefail
          base64 --decode control/.github/r4-task8/evidence-policy.patch.gz.b64 > /tmp/cemm-task8-evidence-policy.patch.gz
          gzip -dc /tmp/cemm-task8-evidence-policy.patch.gz > /tmp/cemm-task8-evidence-policy.patch
          test "$(sha256sum /tmp/cemm-task8-evidence-policy.patch | cut -d' ' -f1)" = '35174abc6942786f253caa72a43296e468103806184df603ef1e293ea9d5e4c7'
          git -C candidate apply --check --directory=hybrid_mvp /tmp/cemm-task8-evidence-policy.patch
          git -C candidate apply --directory=hybrid_mvp /tmp/cemm-task8-evidence-policy.patch
          printf '%s\n' \
            'hybrid_mvp/scripts/update_replay_status.py' \
            'hybrid_mvp/scripts/validation_gate.py' \
            'hybrid_mvp/tests/test_r4_validation_gate.py' | sort > /tmp/expected
          git -C candidate diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git -C candidate diff --check
          test "$(git -C candidate hash-object hybrid_mvp/scripts/validation_gate.py)" = 'cce622b5576dc35e686c3f463057fdc3c4b45983'
          test "$(git -C candidate hash-object hybrid_mvp/scripts/update_replay_status.py)" = '7a41f7b68379e4258b70c036eee0f2c53a481db2'
          test "$(git -C candidate hash-object hybrid_mvp/tests/test_r4_validation_gate.py)" = 'b1cb58bf05600248546cede14397bc2ebb701f14'
      - name: Install governed verification dependencies
        run: |
          set -euo pipefail
          python -m pip install \
            'pytest==8.4.0' \
            'jsonschema==4.25.1' \
            'numpy==2.5.2' \
            'safetensors==0.5.3'
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Compile active source and scripts
        working-directory: candidate/hybrid_mvp
        run: python -m compileall -q src scripts
      - name: Verify exact policy and historical train boundary
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_r4_validation_gate.py \
            tests/test_r4_release_training.py \
            tests/test_r5_data_isolation.py \
            -q -p no:cacheprovider
      - name: Verify metadata, inventory, and structural hard cuts
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python scripts/verify_r3_r4_test_metadata.py
          for phase in G0 R1 R2 R3 R4 R5; do
            python scripts/check_test_inventory.py --phase "$phase" --source-only
          done
          python scripts/check_r3_r4_structure.py
          python scripts/audit_legacy_test_hard_cut.py
      - name: Reconstruct historical ABI 3 and bound dirty-path union
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys

          from cemm_authoritative_hybrid import process_control

          sys.modules['process_control'] = process_control
          import validation_gate as gate
          import update_replay_status as replay

          root = Path('.').resolve()
          receipt, evidence_paths = gate.load_verified_admission_receipt(
              root,
              phase='R4',
              expected_status='passed',
              run_ref='run:300579c997da31e29d1c1a06',
          )
          assert receipt.source_ref == '597348731965cf31f5ec6fe480d05aee9bc5ca1d'
          assert receipt.gate_result_ref == 'gate_result:c9a643b22f3df49f8a074466'
          selected = gate._required_admission_evidence_paths(
              'R4', root=root, receipt=receipt
          )
          assert selected == evidence_paths
          assert len(selected) == 16
          assert 'artifacts/r4/training_allowlist.json' in selected
          assert 'artifacts/r4/partition_evidence.json' not in selected
          assert replay._PHASE_ADMISSION_EVIDENCE_PATHS['R4'] == gate._PHASE_ADMISSION_EVIDENCE_PATHS['R4']
          assert set(selected) < set(replay._PHASE_ADMISSION_EVIDENCE_PATHS['R4'])
          PY
      - name: Create the deterministic candidate commit
        run: |
          set -euo pipefail
          find candidate/hybrid_mvp -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git -C candidate status --short --untracked-files=all | grep -vE '^ M hybrid_mvp/(scripts/(update_replay_status|validation_gate)\.py|tests/test_r4_validation_gate\.py)$' || true)"
          git -C candidate config user.name 'CEMM Verification Bot'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate add \
            hybrid_mvp/scripts/update_replay_status.py \
            hybrid_mvp/scripts/validation_gate.py \
            hybrid_mvp/tests/test_r4_validation_gate.py
          git -C candidate diff --cached --check
          GIT_AUTHOR_NAME='CEMM Verification Bot' \
          GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_AUTHOR_DATE='2026-08-20T12:00:00+01:00' \
          GIT_COMMITTER_NAME='CEMM Verification Bot' \
          GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_COMMITTER_DATE='2026-08-20T12:00:00+01:00' \
            git -C candidate commit --no-gpg-sign -m 'fix(r4): select admission evidence by build ABI'
          candidate_sha="$(git -C candidate rev-parse HEAD)"
          test "$(git -C candidate rev-parse HEAD^)" = 'b8b180a1faac6e0f9460f8939dd1386859cb99aa'
          printf 'CANDIDATE_SHA=%s\n' "$candidate_sha" >> "$GITHUB_ENV"
          python - "$candidate_sha" <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          candidate_sha = sys.argv[1]
          tree_sha = subprocess.check_output(
              ['git', '-C', 'candidate', 'rev-parse', f'{candidate_sha}^{{tree}}'],
              text=True,
          ).strip()
          payload = {
              'candidate_sha': candidate_sha,
              'parent_sha': 'b8b180a1faac6e0f9460f8939dd1386859cb99aa',
              'tree_sha': tree_sha,
              'patch_sha256': '35174abc6942786f253caa72a43296e468103806184df603ef1e293ea9d5e4c7',
              'changed_paths': [
                  'hybrid_mvp/scripts/update_replay_status.py',
                  'hybrid_mvp/scripts/validation_gate.py',
                  'hybrid_mvp/tests/test_r4_validation_gate.py',
              ],
              'verification': {
                  'focused_tests': [
                      'tests/test_r4_validation_gate.py',
                      'tests/test_r4_release_training.py',
                      'tests/test_r5_data_isolation.py',
                  ],
                  'metadata_records': 356,
                  'inventory_phases': ['G0', 'R1', 'R2', 'R3', 'R4', 'R5'],
                  'historical_abi3_evidence_count': 16,
              },
          }
          Path('/tmp/r4-task8-evidence-policy-verification.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: SHA-fenced publication to candidate and target branches
        run: |
          set -euo pipefail
          target_ref='refs/heads/agent/r4-task4-batch-publisher-20260816'
          candidate_ref='refs/heads/agent/r4-task8-evidence-policy-publish-head-20260820'
          reviewed_parent='b8b180a1faac6e0f9460f8939dd1386859cb99aa'
          git -C candidate push \
            --force-with-lease="$candidate_ref:$INITIAL_HEAD_SHA" \
            origin HEAD:"$candidate_ref"
          test "$(git -C candidate ls-remote origin "$candidate_ref" | cut -f1)" = "$CANDIDATE_SHA"
          remote_target="$(git -C candidate ls-remote origin "$target_ref" | cut -f1)"
          if [ "$remote_target" = "$reviewed_parent" ]; then
            git -C candidate push origin HEAD:"$target_ref"
          else
            test "$remote_target" = "$CANDIDATE_SHA"
          fi
          test "$(git -C candidate ls-remote origin "$target_ref" | cut -f1)" = "$CANDIDATE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: cemm-r4-task8-evidence-policy-verification
          path: /tmp/r4-task8-evidence-policy-verification.json
          if-no-files-found: error
          retention-days: 7
