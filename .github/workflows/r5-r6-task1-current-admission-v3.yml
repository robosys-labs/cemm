name: R5 R6 Task 1 current R4 ABI-4 admission v3

on:
  pull_request:
    branches:
      - agent/r5-r6-task1-r4-current-admission-ci-base-20260822
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: r5-r6-task1-current-r4-admission-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-admit-publish:
    if: >-
      github.event.pull_request.head.ref == 'agent/r5-r6-task1-r4-current-admission-v3-candidate-20260822' &&
      github.event.pull_request.head.sha == 'd4be105c99fc7975650a432a1bf8689caa06286f'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d4be105c99fc7975650a432a1bf8689caa06286f
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-r6-task1-r4-current-admission-ci-base-20260822
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize authenticated v3 wrapper control assumptions
        run: |
          set -euo pipefail
          patch='control/.github/r5-r6-task1/source-owner-repair.patch.gz.b64'
          actual_patch_sha="$(sha256sum "$patch" | cut -d' ' -f1)"
          test "$actual_patch_sha" = '97322ae51aa45628b2db1411a7a485f89d3c87cd12766df8fa1fa17fa18c327f'
          python - <<'PY'
          from pathlib import Path

          path = Path('control/.github/r5-r6-task1/run-current-admission-v3.sh')
          text = path.read_text(encoding='utf-8')

          trap_old = '''trap 'rc=$?; printf \\"Task 1 v3 wrapper failed at line %s: %s\\\\n\\" \\"${LINENO}\\" \\"${BASH_COMMAND}\\" >&2; exit \\"${rc}\\"' ERR'''
          trap_new = '''trap 'rc=$?; printf "Task 1 v3 wrapper failed at line %s: %s\\n" "${LINENO}" "${BASH_COMMAND}" >&2; exit "${rc}"' ERR'''
          hash_old = 'abc439ec63ed804e31829b0858d2927594c4601672f7bfcbcf935d6510bc4670'
          hash_new = '97322ae51aa45628b2db1411a7a485f89d3c87cd12766df8fa1fa17fa18c327f'
          trigger_blob_pattern_old = '03b5a3aa800e1dcb1444ae4f876e60220c3ca795'
          trigger_blob_pattern_new = '950d485c5859182c54192fb1d6950e45e9659412'
          trigger_block_old = '''replace_once(
              '.github/r5-r6-task1/current-admission-trigger.json',
              '.github/r5-r6-task1/current-admission-v3-trigger.json',
              'trigger path',
          )'''
          trigger_block_new = '''old_trigger_path = '.github/r5-r6-task1/current-admission-trigger.json'
          new_trigger_path = '.github/r5-r6-task1/current-admission-v3-trigger.json'
          trigger_path_count = text.count(old_trigger_path)
          if trigger_path_count != 2:
              raise AssertionError(
                  f'trigger path: expected two occurrences, found {trigger_path_count}'
              )
          text = text.replace(old_trigger_path, new_trigger_path)'''

          for old, new, label in (
              (trap_old, trap_new, 'malformed ERR trap'),
              (hash_old, hash_new, 'stale source-owner payload hash'),
              (trigger_blob_pattern_old, trigger_blob_pattern_new, 'stale old-trigger blob pattern'),
              (trigger_block_old, trigger_block_new, 'two-use trigger-path migration'),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'expected {label} exactly once')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          bash -n control/.github/r5-r6-task1/run-current-admission-v3.sh
      - name: Install governed R4 verification dependencies
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python -m pip install \
            'pytest==8.4.0' \
            'hypothesis==6.163.0' \
            'numpy==2.5.2' \
            'safetensors==0.5.3' \
            'fastapi==0.115.0' \
            'httpx==0.27.0' \
            'jsonschema==4.25.1'
          python -m pip install 'torch==2.6.0' \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Repair owners, rebuild twice, verify, admit, and publish
        run: |
          set -euo pipefail
          bash control/.github/r5-r6-task1/run-current-admission-v3.sh \
            "$GITHUB_WORKSPACE/candidate" \
            "$GITHUB_WORKSPACE/control"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cemm-r5-r6-task1-current-r4-admission-v3
          path: /tmp/r5-r6-task1-evidence/**
          if-no-files-found: warn
          retention-days: 7
