name: R5 R6 Task 1 correct wrapper payload hashes

on:
  push:
    branches:
      - agent/r5-r6-task1-r4-current-admission-ci-base-20260822
    paths:
      - .github/workflows/r5-r6-task1-fix-wrapper-hashes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-r6-task1-r4-current-admission-ci-base-20260822
          fetch-depth: 0
      - name: Correct exact stored-payload hashes
        run: |
          set -euo pipefail
          branch_ref='refs/heads/agent/r5-r6-task1-r4-current-admission-ci-base-20260822'
          expected_head="$(git rev-parse HEAD)"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/r5-r6-task1/run-current-admission-v3.sh')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "67ca65e542816550222a319e70496c737b540683059e2bee3dc76607ffec02dc":
                  "67ca3d489d39ff100e5943624b43f61ee024f926802ec0953db535c8c78e3a7c",
              "b53d38d454408ce2a83024e80324f573e4c5ca1cc01e01b85e993fd1d0d81fd1":
                  "b53f1bc56c796d04a8d224560273640b5c4e00d70c3ed187e5a03bca27ec27f6",
              "ad54998477b35790f67b4d34870d053a20a94ee3c971933f229a5a8f0d92c0ea":
                  "ad541eeaa81f419ec25d90a04267e000c8d045cb459475a8bc9bc6b61fce86a5",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f'{old}: expected one occurrence, found {count}')
              text = text.replace(old, new, 1)
          anchor = 'set -euo pipefail\n'
          diagnostic = (
              "set -euo pipefail\n"
              "trap 'rc=$?; printf \\\"Task 1 v3 wrapper failed at line %s: %s\\\\n\\\" "
              "\\\"${LINENO}\\\" \\\"${BASH_COMMAND}\\\" >&2; exit \\\"${rc}\\\"' ERR\n"
          )
          if text.count(anchor) != 1:
              raise AssertionError('unexpected shell preamble')
          text = text.replace(anchor, diagnostic, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          printf '%s\n' '.github/r5-r6-task1/run-current-admission-v3.sh' > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git config user.name 'CEMM Verification Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/r5-r6-task1/run-current-admission-v3.sh
          git commit --no-gpg-sign -m 'ci(r5-r6): correct Task 1 payload hashes'
          git push --force-with-lease="$branch_ref:$expected_head" origin HEAD:"$branch_ref"
