name: R3 migration snapshot

on:
  push:
    branches:
      - codex/r3-r4-closeout-learning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: r3-migration-snapshot
          path: hybrid_mvp
          if-no-files-found: error
          retention-days: 1
