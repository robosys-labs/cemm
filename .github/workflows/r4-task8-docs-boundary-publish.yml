name: R4 Task 8 corrected partition-boundary docs

on:
  pull_request:
    branches:
      - agent/r4-task8-docs-ci-base-20260822
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: r4-task8-docs-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.event.pull_request.head.ref == 'agent/r4-task8-docs-candidate-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: src:scripts:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-task8-docs-candidate-20260822
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-task8-docs-ci-base-20260822
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fence candidate and control histories
        run: |
          set -euo pipefail
          parent='4c247d7284014f06a2764510b448af675a4ecb07'
          candidate_head="$(git -C candidate rev-parse HEAD)"
          test "$(git -C candidate rev-parse HEAD^)" = "$parent"
          printf '%s\n' '.github/r4-task8-status/docs-boundary-trigger.json' > /tmp/trigger-path
          cat > /tmp/docs-paths <<'EOF'
          hybrid_mvp/docs/ABI_REGISTRY.md
          hybrid_mvp/docs/ARCHITECTURE.md
          hybrid_mvp/docs/superpowers/plans/2026-07-31-hybrid-mvp-corrective-replay-master-plan.md
          hybrid_mvp/docs/superpowers/plans/2026-08-05-hybrid-mvp-r3-r4-implementation-plan.md
          hybrid_mvp/docs/superpowers/plans/2026-08-12-r4-final-admission-closeout-plan.md
          hybrid_mvp/docs/superpowers/plans/2026-08-12-r4-repository-owned-admission-plan.md
          hybrid_mvp/docs/superpowers/progress/2026-08-14-r4-partition-corrective-replay-progress.md
          hybrid_mvp/docs/superpowers/specs/2026-07-31-hybrid-mvp-corrective-replay-admission-design.md
          hybrid_mvp/docs/superpowers/specs/2026-08-12-r4-final-admission-closeout-design.md
          hybrid_mvp/docs/superpowers/specs/2026-08-12-r4-repository-owned-admission-design.md
          EOF
          sort -o /tmp/docs-paths /tmp/docs-paths
          git -C candidate diff --name-only "$parent" "$candidate_head" | sort > /tmp/candidate-paths
          if diff -q /tmp/trigger-path /tmp/candidate-paths >/dev/null; then
            test "$(git -C candidate hash-object .github/r4-task8-status/docs-boundary-trigger.json)" = '5dd5c58bb901ad08cd7039413ea9d24d51e42ae2'
          else
            diff -u /tmp/docs-paths /tmp/candidate-paths
          fi

          test "$(git -C control merge-base "$parent" HEAD)" = "$parent"
          printf '%s\n' \
            '.github/r4-task8/docs-boundary.patch.gz.b64' \
            '.github/workflows/r4-task8-docs-boundary-publish.yml' | sort > /tmp/control-expected
          git -C control diff --name-only "$parent" HEAD | sort > /tmp/control-actual
          diff -u /tmp/control-expected /tmp/control-actual
          printf 'INITIAL_HEAD_SHA=%s\n' "$candidate_head" >> "$GITHUB_ENV"
          git -C candidate checkout --detach "$parent"

      - name: Authenticate and apply exact documentation patch
        run: |
          set -euo pipefail
          payload='control/.github/r4-task8/docs-boundary.patch.gz.b64'
          test "$(sha256sum "$payload" | cut -d' ' -f1)" = '473753915eb962a71b5e0536bba684c7ffadef9df72de6ef6cd221d535c7984d'
          base64 --decode "$payload" > /tmp/docs.patch.gz
          test "$(sha256sum /tmp/docs.patch.gz | cut -d' ' -f1)" = '4038cd6a909c6264891626f5edc92b4bccca3ff94b4db32b14fd97ecabe721d1'
          gzip -dc /tmp/docs.patch.gz > /tmp/docs.patch
          test "$(sha256sum /tmp/docs.patch | cut -d' ' -f1)" = '3bbd23ab290ee039cbe43d4b86f4b49153a2a20b7177ea2d2f58f1899e01de45'
          git -C candidate apply --check /tmp/docs.patch
          git -C candidate apply /tmp/docs.patch
          git -C candidate diff --check
          git -C candidate diff --name-only | sort > /tmp/applied-paths
          diff -u /tmp/docs-paths /tmp/applied-paths

          test "$(git -C candidate hash-object hybrid_mvp/docs/ABI_REGISTRY.md)" = '9f2eed24d6b22aa1ca04bf1b4d1520e8fa011506'
          test "$(git -C candidate hash-object hybrid_mvp/docs/ARCHITECTURE.md)" = 'bfcdf4276ccd0fe08137894a3566c4171d2595e2'
          test "$(git -C candidate hash-object hybrid_mvp/docs/superpowers/plans/2026-07-31-hybrid-mvp-corrective-replay-master-plan.md)" = 'd8b64782f24e61cc2694df5e0a20e621417df372'
          test "$(git -C candidate hash-object hybrid_mvp/docs/superpowers/plans/2026-08-05-hybrid-mvp-r3-r4-implementation-plan.md)" = 'a90ebefae1473d5677213ea3e6287f519c85fcb9'
          test "$(git -C candidate hash-object hybrid_mvp/docs/superpowers/plans/2026-08-12-r4-final-admission-closeout-plan.md)" = '0297d2ce182ff3ea05befb11c4a6d7354f34147d'
          test "$(git -C candidate hash-object hybrid_mvp/docs/superpowers/plans/2026-08-12-r4-repository-owned-admission-plan.md)" = '6843c9d3fd1be4cb3411a9c7234801426aed2f8b'
          test "$(git -C candidate hash-object hybrid_mvp/docs/superpowers/progress/2026-08-14-r4-partition-corrective-replay-progress.md)" = 'aa0011989a742cc8e804efc115e00a61134f6f5f'
          test "$(git -C candidate hash-object hybrid_mvp/docs/superpowers/specs/2026-07-31-hybrid-mvp-corrective-replay-admission-design.md)" = '80c072270eb239eb94a75ddbccf910d6a4013b87'
          test "$(git -C candidate hash-object hybrid_mvp/docs/superpowers/specs/2026-08-12-r4-final-admission-closeout-design.md)" = '3d1ea0546e1ccfa5153a8487ecaa61f86cdfb972'
          test "$(git -C candidate hash-object hybrid_mvp/docs/superpowers/specs/2026-08-12-r4-repository-owned-admission-design.md)" = '28affb7b9837919829055bab487ecd545e72d408'

      - name: Commit deterministic candidate before governance checks
        run: |
          set -euo pipefail
          git -C candidate config user.name 'CEMM Verification Bot'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate add -- $(cat /tmp/docs-paths)
          git -C candidate diff --cached --check
          GIT_AUTHOR_NAME='CEMM Verification Bot' \
          GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_AUTHOR_DATE='2026-08-22T06:30:00+01:00' \
          GIT_COMMITTER_NAME='CEMM Verification Bot' \
          GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_COMMITTER_DATE='2026-08-22T06:30:00+01:00' \
            git -C candidate commit --no-gpg-sign -m 'docs(r4): publish corrected partition boundary'
          test "$(git -C candidate rev-parse HEAD^)" = '4c247d7284014f06a2764510b448af675a4ecb07'
          test -z "$(git -C candidate status --short --untracked-files=all)"
          printf 'CANDIDATE_SHA=%s\n' "$(git -C candidate rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install focused verification dependencies
        run: python -m pip install 'pytest==8.4.0' 'jsonschema==4.25.1'

      - name: Verify documentation and ABI owners
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_replay_governance.py \
            tests/test_r4_partition_contracts.py::test_partition_abi_registry_declares_hard_cut_without_activation_claim \
            -q -p no:cacheprovider

      - name: Verify metadata and frozen inventory
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python scripts/verify_r3_r4_test_metadata.py
          for phase in G0 R1 R2 R3 R4 R5; do
            python scripts/check_test_inventory.py --phase "$phase" --source-only
          done

      - name: Verify structural, legacy, and ledger contracts
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python scripts/check_r3_r4_structure.py
          python scripts/audit_legacy_test_hard_cut.py
          python scripts/update_replay_status.py --verify-chain

      - name: Confirm clean candidate and write verification receipt
        run: |
          set -euo pipefail
          find candidate/hybrid_mvp -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git -C candidate status --short --untracked-files=all)"
          python - "$CANDIDATE_SHA" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          sha = sys.argv[1]
          tree = subprocess.check_output(
              ['git', '-C', 'candidate', 'rev-parse', f'{sha}^{{tree}}'], text=True
          ).strip()
          Path('/tmp/task8-docs-verification.json').write_text(
              json.dumps({
                  'candidate_sha': sha,
                  'parent_sha': '4c247d7284014f06a2764510b448af675a4ecb07',
                  'tree_sha': tree,
                  'patch_sha256': '3bbd23ab290ee039cbe43d4b86f4b49153a2a20b7177ea2d2f58f1899e01de45',
                  'changed_path_count': 10,
                  'metadata_records': 356,
                  'inventory_phases': ['G0', 'R1', 'R2', 'R3', 'R4', 'R5'],
                  'effective_status': 'G0=green R1=green R2=green R3=green R4=red R5=red R6=red R7=red R8=red',
              }, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: SHA-fenced publication
        run: |
          set -euo pipefail
          candidate_ref='refs/heads/agent/r4-task8-docs-candidate-20260822'
          target_ref='refs/heads/agent/r4-task4-batch-publisher-20260816'
          parent='4c247d7284014f06a2764510b448af675a4ecb07'
          git -C candidate push \
            --force-with-lease="$candidate_ref:$INITIAL_HEAD_SHA" \
            origin HEAD:"$candidate_ref"
          test "$(git -C candidate ls-remote origin "$candidate_ref" | cut -f1)" = "$CANDIDATE_SHA"
          remote_target="$(git -C candidate ls-remote origin "$target_ref" | cut -f1)"
          if [ "$remote_target" = "$parent" ]; then
            git -C candidate push origin HEAD:"$target_ref"
          else
            test "$remote_target" = "$CANDIDATE_SHA"
          fi
          test "$(git -C candidate ls-remote origin "$target_ref" | cut -f1)" = "$CANDIDATE_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: cemm-r4-task8-docs-boundary-verification
          path: /tmp/task8-docs-verification.json
          if-no-files-found: error
          retention-days: 7
