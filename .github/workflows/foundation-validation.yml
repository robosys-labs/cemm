name: CEMM foundation validation
on:
  push:
    branches:
      - 'codex/cemm-foundation-*'
  pull_request:
    paths:
      - 'hybrid_mvp/src/**'
      - 'hybrid_mvp/tests/test_foundation_*'
      - '.github/workflows/foundation-validation.yml'
      - 'pyproject.toml'
  workflow_dispatch:
jobs:
  semantic-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install canonical hybrid package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './hybrid_mvp[test]'
      - name: Syntax and import validation
        run: |
          python -m compileall -q hybrid_mvp/src/cemm_authoritative_hybrid
          python -c "import cemm_authoritative_hybrid.foundation"
      - name: Foundation end-to-end and R3 regression tests
        run: |
          cd hybrid_mvp
          pytest -q tests/test_foundation_semantic_surface.py tests/test_r5_realization_boundary.py tests/test_r3_learning_response.py tests/test_r3_learning_transaction.py
