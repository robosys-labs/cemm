name: CEMM foundation validation
on:
  push:
    branches:
      - main
      - 'codex/cemm-foundation-*'
  pull_request:
  workflow_dispatch:
jobs:
  semantic-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install canonical root package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Syntax, import and package cutover
        run: |
          python -m compileall -q hybrid_mvp/src/cemm_authoritative_hybrid
          python -c "import cemm_authoritative_hybrid.foundation"
          python -m pip wheel --no-deps --wheel-dir /tmp/cemm-foundation-wheel .
          python - <<'PY'
          import glob
          import zipfile
          wheels = glob.glob("/tmp/cemm-foundation-wheel/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as z:
              files = set(z.namelist())
          assert "cemm_authoritative_hybrid/foundation.py" in files
          assert "cemm_authoritative_hybrid/foundation_cli.py" in files
          assert not any(p.startswith("cemm/") for p in files), "legacy root package in canonical wheel"
          print("packaging hard cut: canonical hybrid only")
          PY
      - name: Foundation end-to-end and R3 regression tests
        run: |
          cd hybrid_mvp
          pytest -q tests/test_foundation_*.py tests/test_r5_realization_boundary.py tests/test_r3_learning_response.py tests/test_r3_learning_transaction.py

      - name: Adjacent parser, verifier, query and effect owner regressions
        run: |
          cd hybrid_mvp
          pytest -q tests/test_r2_recursive_proposer.py tests/test_r2_unknown_frontier.py tests/test_r2_verifier_reconstruction.py tests/test_r3_recursive_query.py tests/test_r3_expression_projection.py tests/test_r3_form_mode_integration.py tests/test_r3_effect_receipts.py

      - name: Observational public-path capability probe
        run: python hybrid_mvp/scripts/foundation_probe.py
      - name: Observational learning-request probe (diagnostic only)
        run: python hybrid_mvp/scripts/learning_request_probe.py

  hybrid-regression:
    name: Full Hybrid MVP regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install canonical root package and full test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run every active Hybrid MVP test
        run: |
          cd hybrid_mvp
          pytest -q tests --disable-warnings --maxfail=10
