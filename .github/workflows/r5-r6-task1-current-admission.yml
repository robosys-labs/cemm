name: R5 R6 Task 1 current R4 ABI-4 admission v2

on:
  pull_request:
    branches:
      - agent/r5-r6-task1-r4-current-admission-ci-base-20260822
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: r5-r6-task1-current-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-admit-publish:
    if: >-
      github.event.pull_request.head.ref == 'agent/r5-r6-task1-r4-current-admission-candidate-20260822' &&
      github.event.pull_request.head.sha == '5d3523f54223285e26b4d315cd5dbe176aabc1f3'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d3523f54223285e26b4d315cd5dbe176aabc1f3
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-r6-task1-r4-current-admission-ci-base-20260822
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install governed R4 verification dependencies once
        working-directory: candidate/hybrid_mvp
        run: |
          set -euo pipefail
          python -m pip install \
            'pytest==8.4.0' \
            'hypothesis==6.163.0' \
            'numpy==2.5.2' \
            'safetensors==0.5.3' \
            'fastapi==0.115.0' \
            'httpx==0.27.0' \
            'jsonschema==4.25.1'
          python -m pip install 'torch==2.6.0' \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Repair owners, rebuild twice, admit, and publish
        run: bash "$(pwd)/control/.github/r5-r6-task1/run-current-admission.sh" "$(pwd)/candidate" "$(pwd)/control"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cemm-r5-r6-task1-current-r4-admission
          path: /tmp/r5-r6-task1-evidence
          if-no-files-found: warn
          retention-days: 7
