name: Public full-sensor paired development study

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/full-sensor-study.yml'

permissions:
  contents: read

jobs:
  public-study:
    # Run once on the reviewed runner's immediate successor; later PR updates
    # must not silently repeat an already-opened diagnostic.
    if: github.event.pull_request.number == 47 && github.event.action == 'synchronize' && github.event.before == '64f3ff5fd7e9b4d04a02c24b4d5cd578dda516d3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install the frozen CPU dependency
        run: python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify both protocol locks
        working-directory: experiments/predictive_nucleus
        run: sha256sum -c snapshots/full_sensor_paired_protocol_v1.sha256 snapshots/full_sensor_paired_protocol_v2.sha256
      - name: Require the independently reviewed runner and tests
        run: |
          printf '%s  %s\n' \
            ef2bcba62114d3a9809cfffc1406321b211930514dc8318ad3c793862cc2fba3 experiments/predictive_nucleus/factorial_run.py \
            28b3ff1b5cb37fb92c0c8233973ff588cc3252c309049cf004dd96c6aae0c4d6 experiments/predictive_nucleus/tests/test_factorial_run.py | sha256sum -c
      - name: Verify runner and input invariants before fitting
        run: |
          python -m unittest experiments.predictive_nucleus.tests.test_factorial_run \
            experiments.predictive_nucleus.tests.test_factorial_training_data \
            experiments.predictive_nucleus.tests.test_full_sensor_evaluation \
            experiments.predictive_nucleus.tests.test_role_history_memory -v
      - name: Run frozen public diagnostic (NOT G1)
        timeout-minutes: 22
        run: PYTHONHASHSEED=0 python -m experiments.predictive_nucleus.factorial_run --output-dir "$RUNNER_TEMP/cemm-full-sensor-paired"
      - name: Preserve complete or incomplete research output
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: full-sensor-paired-public-development
          path: ${{ runner.temp }}/cemm-full-sensor-paired/
          if-no-files-found: warn
          retention-days: 30
