name: R4 compiler and successor closeout

on:
  push:
    branches: [codex/r3-r4-closeout-learning]
    paths: [.github/workflows/r4-compiler-closeout.yml]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r3-r4-closeout-learning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply content-addressed R4 compiler patch
        run: |
          set -euo pipefail
          printf '%s' ' ' | base64 -d > /tmp/r4-closeout.patch
          test "$(sha256sum /tmp/r4-closeout.patch | awk '{print $1}')" = 'd276fba64a3f7ca2565744ed124b9866b31ee4377a3318849226d3c6c060b87a'
          git apply --check /tmp/r4-closeout.patch
          git apply /tmp/r4-closeout.patch
      - name: Synchronize governed R4 selectors
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('configs/validation_gates.json')
          c=json.loads(p.read_text(encoding='utf-8'))
          owner=c['steps']['r4_contract_review_owner_tests']['exact_nodes']
          owner_nodes=(
            'tests/test_r4_closeout_regressions.py::test_every_reviewed_surface_compiles_and_round_trips_canonically',
            'tests/test_r4_closeout_regressions.py::test_singleton_polysemy_is_not_fabricated_as_ambiguity',
            'tests/test_r4_closeout_regressions.py::test_external_sensor_provenance_is_not_mistaken_for_active_adapter_authority',
            'tests/test_r4_closeout_regressions.py::test_learning_reported_speech_and_effect_contracts_have_connected_compatible_topology',
          )
          for node in owner_nodes:
              if node not in owner: owner.append(node)
          owner.sort()
          phase=c['steps']['r4_phase_tests']['exact_nodes']
          phase_nodes=(
            'tests/test_r4_authentic_episodes.py::test_every_accepted_episode_binds_coverage_program_and_action_identity',
            'tests/test_r4_authentic_episodes.py::test_every_emitted_episode_contains_complete_six_phase_artifacts',
            'tests/test_r4_authentic_episodes.py::test_every_episode_binds_exact_authority_and_revision_identity',
          )
          for node in phase_nodes:
              if node not in phase: phase.append(node)
          phase.sort()
          for step_name, file in (
              ('r4_contract_review_owner_tests','tests/test_r4_closeout_regressions.py'),
              ('r4_phase_tests','tests/test_r4_authentic_episodes.py'),
          ):
              inputs=c['steps'][step_name]['inputs']
              if file not in inputs: inputs.append(file)
              inputs.sort()
          p.write_text(json.dumps(c,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          PY
      - name: Validate compiler and immutable successor lineage
        working-directory: hybrid_mvp
        env:
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install 'pytest==8.4.0'
          python -m pytest -q \
            tests/test_r4_closeout_regressions.py \
            tests/test_r4_assertion_compiler.py \
            tests/test_r4_expansion_and_review.py \
            tests/test_r4_mutations_and_partitions.py \
            tests/test_r4_sufficiency.py \
            tests/test_r4_structure.py
          python scripts/check_test_inventory.py --phase R4 --source-only
          python scripts/verify_r3_r4_test_metadata.py
          python scripts/check_r3_r4_structure.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Commit R4 compiler closeout
        run: |
          set -euo pipefail
          rm -f .github/workflows/r4-compiler-closeout.yml
          git add -A
          git diff --cached --check
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={
            '.github/workflows/r4-compiler-closeout.yml',
            'hybrid_mvp/configs/validation_gates.json',
            'hybrid_mvp/src/cemm_authoritative_hybrid/r4_contracts.py',
            'hybrid_mvp/src/cemm_authoritative_hybrid/r4_episodes.py',
            'hybrid_mvp/tests/test_r4_closeout_regressions.py',
            'hybrid_mvp/tests/test_r4_authentic_episodes.py',
          }
          if changed != expected:
              raise SystemExit(f'unexpected R4 closeout diff: {sorted(changed)!r}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(r4): compile reviewed corpus and preserve episode lineage'
          git push origin HEAD:codex/r3-r4-closeout-learning
