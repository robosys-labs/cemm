name: R4 compiler and successor closeout

on:
  push:
    branches: [codex/r3-r4-closeout-learning]
    paths: [.github/workflows/r4-compiler-closeout.yml]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r3-r4-closeout-learning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply asserted R4 compiler and comparator edits
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          contracts = Path('src/cemm_authoritative_hybrid/r4_contracts.py')
          text = contracts.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, found {count}')
              text = text.replace(old, new, 1)

          old = "\n".join((
              '        outcome, relation, owner = self._outcome(families, expressions)',
              '        mode = self._mode(modes, families)',
              '        gap = gaps[0] if gaps else None',
          ))
          new = "\n".join((
              '        gap = gaps[0] if gaps else None',
              '        if gap is None:',
              '            outcome, relation, owner = self._outcome(families, expressions)',
              '        else:',
              '            outcome = ExpectedOutcomeKind.GAP',
              '            relation = ExpressionRelation.NONE',
              '            owner = gap.recommended_owner',
              '            expressions = []',
              '        mode = self._mode(modes, families)',
          ))
          replace_once(old, new, 'typed gap precedence')

          marker = "\n".join((
              '        if family in {',
              '            "evidence",',
              '            "control",',
          ))
          inserted = "\n".join((
              '        if family == "control" and assertion.kind == "adapter":',
              '            try:',
              '                expression = self._control_expression(',
              '                    fields, assertion.assertion_ref, assertion.kind',
              '                )',
              '            except ValueError as exc:',
              '                if not (',
              '                    str(exc).startswith("authority ref is absent:")',
              '                    or str(exc).startswith("adapter is absent from authority index:")',
              '                ):',
              '                    raise',
              '                return (), normalized, self._family_mode(family), ExpectedGapContract(',
              '                    kind="authority",',
              '                    status="missing",',
              '                    recommended_owner="authority-link",',
              '                    safe_response_action="stop_without_surface",',
              '                    error_code="authority_ref_missing",',
              '                )',
              '            return (expression,), normalized, self._family_mode(family), None',
              marker,
          ))
          replace_once(marker, inserted, 'explicit missing adapter gap')

          old = '                if type(value) is ApplicationFiller:'
          new = "\n".join((
              '                if isinstance(',
              '                    value,',
              '                    (GroundedReference, LiteralValue, BoundVariable, ApplicationFiller, UnresolvedValue),',
              '                ):',
          ))
          replace_once(old, new, 'canonical event filler preservation')

          old = "\n".join((
              '        if getattr(self._authority.atoms[child_ref], "kind", None) == "event_type":',
              '            child, child_unresolved = self._event_application(',
              '                child_ref,',
              '                {"role:actor": speaker},',
              '                assertion_ref=assertion_ref,',
              '                suffix="content",',
              '            )',
          ))
          new = "\n".join((
              '        if getattr(self._authority.atoms[child_ref], "kind", None) == "event_type":',
              '            child_supplied: dict[str, Any] = {}',
              '            child_signature = self._authority.event_signatures.get(child_ref)',
              '            speaker_kind = getattr(self._authority.atoms[speaker], "kind", None)',
              '            if child_signature is not None:',
              '                actor_spec = next(',
              '                    (row for row in child_signature.roles if row.role == "role:actor"),',
              '                    None,',
              '                )',
              '                if (',
              '                    actor_spec is not None',
              '                    and (not actor_spec.filler_kinds or speaker_kind in actor_spec.filler_kinds)',
              '                ):',
              '                    child_supplied["role:actor"] = speaker',
              '            child, child_unresolved = self._event_application(',
              '                child_ref,',
              '                child_supplied,',
              '                assertion_ref=assertion_ref,',
              '                suffix="content",',
              '            )',
          ))
          replace_once(old, new, 'attributed child role compatibility')

          old = "\n".join((
              '            qualifiers: list[RoleBinding] = []',
              '            if fields.get("adapter") is not None:',
              '                qualifiers.append(',
              '                    RoleBinding(',
              '                        "role:source",',
              '                        GroundedReference(',
              '                            self._authority.require_adapter(fields["adapter"])',
              '                        ),',
              '                    )',
              '                )',
          ))
          new = "\n".join((
              '            # Sensor/operation adapter refs are provenance identities, not',
              '            # necessarily active effect adapters in the admitted authority.',
              '            # Preserve them in normalized review data/environment evidence rather',
              '            # than changing the semantic state application signature.',
              '            if fields.get("adapter") is not None:',
              '                exact_text(fields["adapter"], "evidence adapter")',
              '            qualifiers: list[RoleBinding] = []',
          ))
          replace_once(old, new, 'sensor provenance separation')

          start_marker = '        # Effect and learning-family assertions are event contracts.  Missing\n'
          end_marker = '\n    def _relation_query('
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          new = "\n".join((
              '        # Effect and learning-family assertions are event contracts.  Missing',
              '        # required event roles remain explicit unresolved fillers.',
              '        event = fields.get("event")',
              '        if event is None:',
              '            raise AssertionCompilerError("event_contract_lacks_event", assertion_ref)',
              '        supplied: dict[str, Any] = {}',
              '        if kind == "effect":',
              '            signature = self._authority.event_signatures.get(event)',
              '            if signature is None:',
              '                raise ValueError(f"event signature is absent: {event}")',
              '            specs = {row.role: row for row in signature.roles}',
              '            subject_value = fields.get("subject")',
              '            if subject_value is not None:',
              '                subject_ref = self._authority.require_ref(subject_value, "effect subject")',
              '                subject_kind = getattr(self._authority.atoms[subject_ref], "kind", None)',
              '                compatible = [',
              '                    role',
              '                    for role in ("role:actor", "role:target", "role:subject")',
              '                    if role in specs',
              '                    and (',
              '                        not specs[role].filler_kinds',
              '                        or subject_kind in specs[role].filler_kinds',
              '                    )',
              '                ]',
              '                if not compatible:',
              '                    raise ValueError("effect subject has no compatible event role")',
              '                supplied[compatible[0]] = subject_ref',
              '            actor = specs.get("role:actor")',
              '            if (',
              '                "role:actor" not in supplied',
              '                and actor is not None',
              '                and (not actor.filler_kinds or "participant" in actor.filler_kinds)',
              '            ):',
              '                supplied["role:actor"] = "participant:system"',
              '        else:',
              '            if fields.get("subject") is not None:',
              '                supplied["role:actor"] = fields["subject"]',
              '            elif kind in {"learning", "learning_directive", "teaching_claim", "teaching"}:',
              '                supplied["role:actor"] = "participant:system"',
              '            if fields.get("target") is not None:',
              '                supplied["role:target"] = fields["target"]',
              '',
              '        nested_designation = None',
              '        if fields.get("surface") is not None:',
              '            surface = exact_text(fields["surface"], "surface", maximum=16_384)',
              '            target = self._authority.require_ref(fields["target"], "learning target")',
              '            signature = self._authority.event_signatures.get(event)',
              '            roles = {row.role: row for row in signature.roles} if signature is not None else {}',
              '            if "role:surface" in roles and "literal" in roles["role:surface"].filler_kinds:',
              '                supplied["role:surface"] = LiteralValue("string", surface)',
              '            elif "role:content" in roles and roles["role:content"].proposition_valued:',
              '                nested_designation = self._designation(surface, target)',
              '                supplied["role:content"] = ApplicationFiller(',
              '                    nested_designation.root_refs[0]',
              '                )',
              '',
              '        app, unresolved = self._event_application(',
              '            event,',
              '            supplied,',
              '            assertion_ref=assertion_ref,',
              '            suffix=kind,',
              '        )',
              '        applications = (',
              '            (app,)',
              '            if nested_designation is None',
              '            else (*nested_designation.applications, app)',
              '        )',
              '        return SemanticExpression.create(',
              '            applications=applications,',
              '            root_refs=(app.application_ref,),',
              '            unresolved_fillers=unresolved,',
              '        )',
          ))
          if 'designation = self._designation(' not in old or 'roots = (app.application_ref,)' not in old:
              raise SystemExit('event contract source block is not the reviewed predecessor shape')
          text = text[:start] + new + text[end:]

          replace_once(
              '        if "polysemy" in families:',
              '        if "polysemy" in families and len(expressions) > 1:',
              'singleton polysemy outcome',
          )

          contracts.write_text(text, encoding='utf-8')

          episodes = Path('src/cemm_authoritative_hybrid/r4_episodes.py')
          episode_text = episodes.read_text(encoding='utf-8')
          old = "\n".join((
              'def _effect_match(contract: ExpectedCycleContract, effect: object | None) -> bool:',
              '    expected = contract.expected_effect',
              '    if expected.kind is ExpectedEffectKind.EFFECT:',
          ))
          new = "\n".join((
              'def _effect_match(contract: ExpectedCycleContract, effect: object | None) -> bool:',
              '    expected = contract.expected_effect',
              '    if effect is None and contract.outcome_kind in {',
              '        ExpectedOutcomeKind.GAP,',
              '        ExpectedOutcomeKind.VERIFICATION_REJECTION,',
              '        ExpectedOutcomeKind.RESTART,',
              '    }:',
              '        return expected.kind is ExpectedEffectKind.NO_EFFECT',
              '    if expected.kind is ExpectedEffectKind.EFFECT:',
          ))
          if episode_text.count(old) != 1:
              raise SystemExit('episode effect comparator source shape drifted')
          episodes.write_text(episode_text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Synchronize governed R4 selectors
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('configs/validation_gates.json')
          config = json.loads(path.read_text(encoding='utf-8'))
          owner = config['steps']['r4_contract_review_owner_tests']['exact_nodes']
          owner_nodes = (
              'tests/test_r4_closeout_regressions.py::test_every_reviewed_surface_compiles_and_round_trips_canonically',
              'tests/test_r4_closeout_regressions.py::test_singleton_polysemy_is_not_fabricated_as_ambiguity',
              'tests/test_r4_closeout_regressions.py::test_external_sensor_provenance_is_not_mistaken_for_active_adapter_authority',
              'tests/test_r4_closeout_regressions.py::test_learning_reported_speech_and_effect_contracts_have_connected_compatible_topology',
          )
          for node in owner_nodes:
              if node not in owner:
                  owner.append(node)
          owner.sort()
          phase = config['steps']['r4_phase_tests']['exact_nodes']
          phase_nodes = (
              'tests/test_r4_authentic_episodes.py::test_every_accepted_episode_binds_coverage_program_and_action_identity',
              'tests/test_r4_authentic_episodes.py::test_every_emitted_episode_contains_complete_six_phase_artifacts',
              'tests/test_r4_authentic_episodes.py::test_every_episode_binds_exact_authority_and_revision_identity',
          )
          for node in phase_nodes:
              if node not in phase:
                  phase.append(node)
          phase.sort()
          for step_name, test_file in (
              ('r4_contract_review_owner_tests', 'tests/test_r4_closeout_regressions.py'),
              ('r4_phase_tests', 'tests/test_r4_authentic_episodes.py'),
          ):
              inputs = config['steps'][step_name]['inputs']
              if test_file not in inputs:
                  inputs.append(test_file)
              inputs.sort()
          path.write_text(
              json.dumps(config, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate compiler and immutable successor lineage
        working-directory: hybrid_mvp
        env:
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install 'pytest==8.4.0'
          python -m pytest -q \
            tests/test_r4_closeout_regressions.py \
            tests/test_r4_assertion_compiler.py \
            tests/test_r4_expansion_and_review.py \
            tests/test_r4_mutations_and_partitions.py \
            tests/test_r4_sufficiency.py \
            tests/test_r4_structure.py
          python scripts/check_test_inventory.py --phase R4 --source-only
          python scripts/verify_r3_r4_test_metadata.py
          python scripts/check_r3_r4_structure.py
          python -m py_compile \
            src/cemm_authoritative_hybrid/r4_contracts.py \
            src/cemm_authoritative_hybrid/r4_episodes.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit R4 compiler closeout
        run: |
          set -euo pipefail
          rm -f .github/workflows/r4-compiler-closeout.yml
          git add -A
          git diff --cached --check
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          expected = {
              '.github/workflows/r4-compiler-closeout.yml',
              'hybrid_mvp/configs/validation_gates.json',
              'hybrid_mvp/src/cemm_authoritative_hybrid/r4_contracts.py',
              'hybrid_mvp/src/cemm_authoritative_hybrid/r4_episodes.py',
          }
          if changed != expected:
              raise SystemExit(f'unexpected R4 compiler diff: {sorted(changed)!r}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(r4): compile reviewed corpus and preserve episode lineage'
          git push origin HEAD:codex/r3-r4-closeout-learning
