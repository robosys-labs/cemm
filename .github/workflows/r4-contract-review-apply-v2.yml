name: R4 contract-review bounded tranche v2

on:
  push:
    branches:
      - codex/r4-contract-review-tranche
    paths:
      - .github/workflows/r4-contract-review-apply-v2.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: r4-contract-review-bounded-tranche-v2
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_SHA: 4eb6c2770217e540a7b4446a13b06c8fc74310ab
      STAGING_SHA: 50fcb3a213ac52f233a376bf5c018a07c5d7db39
      PATCH_SHA256: c1aa490aebca8e55d45a3948e2d8de9e5d5be6408caaa75ebb203a4165312edf
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r4-contract-review-tranche
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact governed dependencies
        run: |
          set -euo pipefail
          python -m pip install \
            'pytest==8.4.0' \
            'hypothesis==6.163.0' \
            'numpy==2.5.2' \
            'safetensors==0.5.3' \
            'fastapi==0.115.0' \
            'httpx==0.27.0'
          python -m pip install 'torch==2.6.0' \
            --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          import fastapi, httpx, hypothesis, numpy, pytest, safetensors, torch
          expected = {
              'pytest': '8.4.0',
              'hypothesis': '6.163.0',
              'numpy': '2.5.2',
              'safetensors': '0.5.3',
              'fastapi': '0.115.0',
              'httpx': '0.27.0',
              'torch': '2.6.0+cpu',
          }
          actual = {
              'pytest': pytest.__version__,
              'hypothesis': hypothesis.__version__,
              'numpy': numpy.__version__,
              'safetensors': safetensors.__version__,
              'fastapi': fastapi.__version__,
              'httpx': httpx.__version__,
              'torch': torch.__version__,
          }
          if actual != expected:
              raise SystemExit(f'dependency drift: expected={expected!r} actual={actual!r}')
          PY

      - name: Verify exact base and reconstruct the reviewed source patch
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python - <<'PY'
          import os
          import subprocess

          base = os.environ['BASE_SHA']
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', base, 'HEAD'], text=True
              ).splitlines()
          )
          allowed = {
              '.github/workflows/r4-owner-inventory-diagnostic.yml',
              '.github/workflows/r4-owner-step-diagnostic.yml',
              '.github/workflows/r4-phase-selector-diagnostic.yml',
              '.github/workflows/r4-contract-review-apply.yml',
              '.github/workflows/r4-contract-review-apply-v2.yml',
          }
          if changed != allowed:
              raise SystemExit(
                  f'pre-implementation branch drift: '
                  f'missing={sorted(allowed - changed)!r} '
                  f'extra={sorted(changed - allowed)!r}'
              )
          PY
          : > /tmp/r4-contract-review.patch.b64
          for part in 00 01 02 03 04 05 06 07 08; do
            git show "$STAGING_SHA:.github/r4-designation-event-patch/${part}.b64" \
              >> /tmp/r4-contract-review.patch.b64
          done
          tr -d '\n' < /tmp/r4-contract-review.patch.b64 \
            | base64 --decode \
            > /tmp/r4-contract-review.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/r4-contract-review.patch')
          data = path.read_bytes()
          corrupt = (
              b'raw = row.get(nam, ())\n'
              b'+                return exact_refs(tuple(raw))\n'
              b'+t_refs(raw, f"explicit {name}")'
          )
          exact = (
              b'raw = row.get(name, ())\n'
              b'+                return exact_refs(raw, f"explicit {name}")'
          )
          if data.count(corrupt) != 1:
              raise SystemExit('reviewed staging-byte correction did not match exactly once')
          path.write_bytes(data.replace(corrupt, exact))
          PY
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/r4-contract-review.patch \
            | sha256sum -c -
          git apply --check /tmp/r4-contract-review.patch

      - name: Apply compiler corrections and derive exact R4 selectors
        env:
          PYTHONPATH: src:scripts:.
        run: |
          set -euo pipefail
          git apply /tmp/r4-contract-review.patch
          cd hybrid_mvp

          cp data/scenarios/use_cases.jsonl /tmp/r4-reviewed-scenarios.expected.jsonl
          python scripts/generate_scenarios.py
          cmp /tmp/r4-reviewed-scenarios.expected.jsonl data/scenarios/use_cases.jsonl

          python scripts/refresh_r3_r4_test_metadata.py
          python scripts/verify_r3_r4_test_metadata.py

          python - <<'PY' | tee /tmp/r4-selector-alignment.json
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          sys.path.insert(0, str(root / 'src'))
          sys.path.insert(0, str(root / 'scripts'))
          from cemm_authoritative_hybrid import process_control as process_control_module
          sys.modules['process_control'] = process_control_module
          from test_inventory_core import load_and_verify, verify_document_authority_pin
          from validation_gate import (
              _expected_g0_inventory_receipt,
              canonical_json_bytes,
              load_gate_graph,
              validate_inventory_contract,
          )

          inventory_path = root / 'governance/test_inventory.json'
          inventory_sha = verify_document_authority_pin(root, inventory_path)
          r4_inventory = load_and_verify(
              root,
              inventory_path,
              phase='R4',
              enforce_reviewed_counts=True,
              expected_sha256=inventory_sha,
          )
          owner_nodes = {
              owner: list(nodes)
              for owner, nodes in r4_inventory.owner_node_ids.items()
          }
          expected_owner_keys = {
              'expected-contract',
              'surface-review',
              'mutation-partition',
              'structural-sufficiency',
          }
          if set(owner_nodes) != expected_owner_keys:
              raise SystemExit(
                  f'R4 literal owner drift: expected={sorted(expected_owner_keys)!r} '
                  f'actual={sorted(owner_nodes)!r}'
              )
          new_expected_nodes = {
              'tests/test_r4_assertion_compiler.py::test_explicit_cycle_contract_rows_are_complete_and_override_defaults',
              'tests/test_r4_closeout_regressions.py::test_reviewed_scenario_source_matches_deterministic_generator',
              'tests/test_r4_closeout_regressions.py::test_reviewed_greeting_and_farewell_surfaces_match_authentic_r3_cycles',
          }
          if not new_expected_nodes <= set(owner_nodes['expected-contract']):
              raise SystemExit('new designation-event tests are not owned by expected-contract')

          config_path = root / 'configs/validation_gates.json'
          config = json.loads(config_path.read_text(encoding='utf-8'))
          phase = config['phases']['R4']
          if phase['owners'] != {
              'contract-review': ['r4_contract_review_owner_tests'],
              'sufficiency-mutation-partition': ['r4_data_owner_tests'],
          }:
              raise SystemExit('unexpected pre-split R4 owner configuration')

          config['steps']['r4_contract_review_owner_tests'] = {
              'depends_on': ['source_compile'],
              'exact_nodes': sorted(owner_nodes['expected-contract']),
              'inputs': sorted({
                  'data/authority/',
                  'data/scenarios/SCENARIO_COVERAGE.md',
                  'data/scenarios/use_cases.jsonl',
                  'scripts/generate_scenarios.py',
                  'src/cemm_authoritative_hybrid/bootstrap.py',
                  'src/cemm_authoritative_hybrid/canonical.py',
                  'src/cemm_authoritative_hybrid/config.py',
                  'src/cemm_authoritative_hybrid/persistence.py',
                  'src/cemm_authoritative_hybrid/proposal.py',
                  'src/cemm_authoritative_hybrid/r4_contracts.py',
                  'src/cemm_authoritative_hybrid/r4_episodes.py',
                  'src/cemm_authoritative_hybrid/r4_expansion.py',
                  'src/cemm_authoritative_hybrid/r4_pipeline.py',
                  'tests/test_r4_assertion_compiler.py',
                  'tests/test_r4_closeout_regressions.py',
              }),
              'kind': 'pytest',
          }
          config['steps']['r4_surface_review_owner_tests'] = {
              'depends_on': ['source_compile'],
              'exact_nodes': sorted(owner_nodes['surface-review']),
              'inputs': sorted({
                  'src/cemm_authoritative_hybrid/r4_expansion.py',
                  'src/cemm_authoritative_hybrid/r4_review.py',
                  'tests/test_r4_expansion_and_review.py',
              }),
              'kind': 'pytest',
          }
          config['steps']['r4_data_owner_tests'] = {
              'depends_on': ['source_compile'],
              'exact_nodes': sorted(owner_nodes['mutation-partition']),
              'inputs': sorted({
                  'src/cemm_authoritative_hybrid/r4_mutations.py',
                  'src/cemm_authoritative_hybrid/r4_partitions.py',
                  'tests/test_r4_mutations_and_partitions.py',
              }),
              'kind': 'pytest',
          }
          config['steps']['r4_structural_sufficiency_owner_tests'] = {
              'depends_on': ['source_compile'],
              'exact_nodes': sorted(owner_nodes['structural-sufficiency']),
              'inputs': sorted({
                  'src/cemm_authoritative_hybrid/r4_sufficiency.py',
                  'tests/test_r4_sufficiency.py',
              }),
              'kind': 'pytest',
          }
          phase['owners'] = {
              'expected-contract': ['r4_contract_review_owner_tests'],
              'mutation-partition': ['r4_data_owner_tests'],
              'structural-sufficiency': ['r4_structural_sufficiency_owner_tests'],
              'surface-review': ['r4_surface_review_owner_tests'],
          }

          phase_step = config['steps']['r4_phase_tests']
          configured_phase = set(phase_step['exact_nodes'])
          literal_phase = set(r4_inventory.phase_node_ids)
          expected_missing = {
              'tests/test_episode_generation_hard_cut.py::test_episode_abi2_accepts_exact_authenticated_wire',
              'tests/test_episode_generation_hard_cut.py::test_episode_abi2_is_exact_active_diagnostic_version',
              'tests/test_episode_generation_hard_cut.py::test_episode_abi2_preserves_diagnostic_lineage_without_gold_claim',
              'tests/test_episode_generation_hard_cut.py::test_episode_abi2_r1_shape_supersedes_complete_six_phase_claim',
              'tests/test_episode_generation_hard_cut.py::test_episode_abi2_rejects_missing_r1_no_later_artifact_marker',
              'tests/test_episode_generation_hard_cut.py::test_episode_abi2_rejects_unknown_version',
              'tests/test_episode_generation_hard_cut.py::test_episode_abi2_serializes_authenticated_diagnostic_wire',
              'tests/test_episode_generation_hard_cut.py::test_r4_committed_program_abi1_corpus_remains_quarantined',
              'tests/test_episode_generation_hard_cut.py::test_r4_episode_generation_determinism_remains_unadmitted',
          }
          if configured_phase - literal_phase:
              raise SystemExit(
                  f'R4 phase selector has unexpected nodes: '
                  f'{sorted(configured_phase - literal_phase)!r}'
              )
          if literal_phase - configured_phase != expected_missing:
              raise SystemExit(
                  f'R4 phase selector missing-set drift: '
                  f'expected={sorted(expected_missing)!r} '
                  f'actual={sorted(literal_phase - configured_phase)!r}'
              )
          phase_step['exact_nodes'] = sorted(literal_phase)
          phase_step['inputs'] = sorted(
              set(phase_step['inputs']) | {'tests/test_episode_generation_hard_cut.py'}
          )

          config_path.write_text(
              json.dumps(
                  config,
                  ensure_ascii=False,
                  allow_nan=False,
                  separators=(',', ':'),
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          graph = load_gate_graph(config_path)
          r4_selector = validate_inventory_contract(graph, r4_inventory, phase='R4')
          if len(r4_selector.active_node_ids) != 1455:
              raise SystemExit(
                  f'R4 active inventory count drifted: {len(r4_selector.active_node_ids)}'
              )

          g0_inventory = load_and_verify(
              root,
              inventory_path,
              phase='G0',
              enforce_reviewed_counts=True,
              expected_sha256=inventory_sha,
          )
          g0_selector = validate_inventory_contract(graph, g0_inventory, phase='G0')
          authority_raw = (root / 'docs/DOCUMENT_AUTHORITY.json').read_bytes()
          receipt = _expected_g0_inventory_receipt(
              authority_sha256=hashlib.sha256(authority_raw).hexdigest(),
              inventory_sha256=inventory_sha,
              inventory=g0_inventory,
              selector=g0_selector,
          )
          (root / 'artifacts/validation/TEST_INVENTORY_RECEIPT.json').write_bytes(
              canonical_json_bytes(receipt)
          )

          print(json.dumps({
              'active_node_count': len(r4_selector.active_node_ids),
              'configured_owner_keys': sorted(graph.phases['R4'].owners),
              'literal_owner_keys': sorted(owner_nodes),
              'owner_node_counts': {
                  owner: len(nodes) for owner, nodes in sorted(owner_nodes.items())
              },
              'phase_node_count': len(r4_inventory.phase_node_ids),
              'phase_nodes_added': sorted(expected_missing),
          }, sort_keys=True, separators=(',', ':')))
          PY

          python scripts/verify_r3_r4_test_metadata.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Run focused designation-event red-green tests
        working-directory: hybrid_mvp
        env:
          PYTHONPATH: src:scripts:.
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_r4_assertion_compiler.py::test_explicit_cycle_contract_rows_are_complete_and_override_defaults \
            tests/test_r4_closeout_regressions.py::test_reviewed_scenario_source_matches_deterministic_generator \
            tests/test_r4_closeout_regressions.py::test_reviewed_greeting_and_farewell_surfaces_match_authentic_r3_cycles \
            | tee /tmp/r4-focused-red-green.log

      - name: Commit only the bounded governed tranche
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/r4-owner-inventory-diagnostic.yml \
            .github/workflows/r4-owner-step-diagnostic.yml \
            .github/workflows/r4-phase-selector-diagnostic.yml \
            .github/workflows/r4-contract-review-apply.yml \
            .github/workflows/r4-contract-review-apply-v2.yml
          git add -A
          python - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--cached', '--name-only'], text=True
              ).splitlines()
          )
          temporary = {
              '.github/workflows/r4-owner-inventory-diagnostic.yml',
              '.github/workflows/r4-owner-step-diagnostic.yml',
              '.github/workflows/r4-phase-selector-diagnostic.yml',
              '.github/workflows/r4-contract-review-apply.yml',
              '.github/workflows/r4-contract-review-apply-v2.yml',
          }
          substantive = {
              'hybrid_mvp/artifacts/validation/TEST_INVENTORY_RECEIPT.json',
              'hybrid_mvp/configs/validation_gates.json',
              'hybrid_mvp/data/scenarios/SCENARIO_COVERAGE.md',
              'hybrid_mvp/data/scenarios/use_cases.jsonl',
              'hybrid_mvp/scripts/generate_scenarios.py',
              'hybrid_mvp/src/cemm_authoritative_hybrid/r4_contracts.py',
              'hybrid_mvp/tests/test_r4_assertion_compiler.py',
              'hybrid_mvp/tests/test_r4_closeout_regressions.py',
          }
          allowed = temporary | substantive
          if changed != allowed:
              raise SystemExit(
                  f'bounded tranche path drift: '
                  f'missing={sorted(allowed - changed)!r} '
                  f'extra={sorted(changed - allowed)!r}'
              )
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(r4): align literal selectors and designation-event contracts'
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import os
          import subprocess

          base = os.environ['BASE_SHA']
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', base, 'HEAD'], text=True
              ).splitlines()
          )
          expected = {
              'hybrid_mvp/artifacts/validation/TEST_INVENTORY_RECEIPT.json',
              'hybrid_mvp/configs/validation_gates.json',
              'hybrid_mvp/data/scenarios/SCENARIO_COVERAGE.md',
              'hybrid_mvp/data/scenarios/use_cases.jsonl',
              'hybrid_mvp/scripts/generate_scenarios.py',
              'hybrid_mvp/src/cemm_authoritative_hybrid/r4_contracts.py',
              'hybrid_mvp/tests/test_r4_assertion_compiler.py',
              'hybrid_mvp/tests/test_r4_closeout_regressions.py',
          }
          if actual != expected:
              raise SystemExit(
                  f'final branch scope drift: '
                  f'missing={sorted(expected - actual)!r} '
                  f'extra={sorted(actual - expected)!r}'
              )
          PY

      - name: Run all four clean R4 owner gates
        working-directory: hybrid_mvp
        env:
          PYTHONPATH: src:scripts:.
        run: |
          set -euo pipefail
          python scripts/verify_r3_r4_test_metadata.py
          python - <<'PY' | tee /tmp/r4-owner-gates.jsonl
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, 'src')
          sys.path.insert(0, 'scripts')
          from cemm_authoritative_hybrid import process_control as process_control_module
          sys.modules['process_control'] = process_control_module
          from validation_gate import run_validation

          root = Path('.').resolve()
          for owner in (
              'expected-contract',
              'surface-review',
              'mutation-partition',
              'structural-sufficiency',
          ):
              outcome = run_validation(root, phase='R4', tier='owner', owner=owner)
              print(json.dumps(
                  outcome.to_dict(), sort_keys=True, separators=(',', ':')
              ))
              if outcome.disposition != 'passed':
                  raise SystemExit(
                      f'R4 owner failed: {owner}: '
                      f'{outcome.disposition} {outcome.error_code}'
                  )
          PY
          test -z "$(git status --porcelain)"

      - name: Prove the admitted R3 predecessor is unchanged
        working-directory: hybrid_mvp
        env:
          PYTHONPATH: src:scripts:.
        run: |
          set -euo pipefail
          python scripts/update_replay_status.py --verify-chain
          python - <<'PY' | tee /tmp/r3-after-r4-owner-tranche.json
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          sys.path.insert(0, str(root / 'src'))
          sys.path.insert(0, str(root / 'scripts'))
          from cemm_authoritative_hybrid import process_control as process_control_module
          sys.modules['process_control'] = process_control_module
          from test_inventory_core import load_and_verify, verify_document_authority_pin

          path = root / 'governance/test_inventory.json'
          sha = verify_document_authority_pin(root, path)
          inventory = load_and_verify(
              root,
              path,
              phase='R3',
              enforce_reviewed_counts=True,
              expected_sha256=sha,
          )
          if len(inventory.active_node_ids) != 1378:
              raise SystemExit(
                  f'R3 active inventory drifted: {len(inventory.active_node_ids)}'
              )
          new_r4_nodes = {
              'tests/test_r4_assertion_compiler.py::test_explicit_cycle_contract_rows_are_complete_and_override_defaults',
              'tests/test_r4_closeout_regressions.py::test_reviewed_scenario_source_matches_deterministic_generator',
              'tests/test_r4_closeout_regressions.py::test_reviewed_greeting_and_farewell_surfaces_match_authentic_r3_cycles',
          }
          if new_r4_nodes & set(inventory.active_node_ids):
              raise SystemExit('R4 tests leaked into the R3 active inventory')
          rows = [
              json.loads(line)
              for line in (root / 'governance/replay_status.jsonl').read_text(
                  encoding='utf-8'
              ).splitlines()
              if line.strip()
          ]
          latest = max(
              (row for row in rows if row['phase'] == 'R3'),
              key=lambda row: row['sequence'],
          )
          expected = {
              'status': 'green',
              'admission_run_ref': 'run:596863b3fb95f7bc247a4f57',
              'admission_gate_result_ref': 'gate_result:3a09cf54007fe7290560328c',
              'source_base': '8497f3b87bb4212d262110b13174c9f68d26ee8a',
          }
          actual = {key: latest[key] for key in expected}
          if actual != expected:
              raise SystemExit(f'R3 admission changed: {actual!r}')
          print(json.dumps({
              'active_node_count': len(inventory.active_node_ids),
              'latest_r3_record': actual,
          }, sort_keys=True, separators=(',', ':')))
          PY
          test -z "$(git status --porcelain)"

      - name: Publish the verified bounded tranche
        run: |
          set -euo pipefail
          git push origin HEAD:codex/r4-contract-review-tranche

      - name: Upload bounded tranche evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-contract-review-v2-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/r4-contract-review.patch
            /tmp/r4-selector-alignment.json
            /tmp/r4-focused-red-green.log
            /tmp/r4-owner-gates.jsonl
            /tmp/r3-after-r4-owner-tranche.json
