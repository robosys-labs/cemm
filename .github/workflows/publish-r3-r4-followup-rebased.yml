name: Publish rebased verified R3-R4 follow-up batches

on:
  push:
    branches:
      - codex/hybrid-mvp-r2

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[r3r4-rebased-publisher]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hybrid-mvp-r2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Decode verified rebased repair bundle
        run: |
          cat .github/repair/rebased_part_*.txt > /tmp/r3r4.b64
          base64 -d /tmp/r3r4.b64 > /tmp/r3r4.zip
          test "$(sha256sum /tmp/r3r4.zip | awk '{print $1}')" = '58c5fb9ba16700db4599135a80fcec725473a920ae97a9e26492d3fa2eda45db'
          mkdir -p /tmp/r3r4
          unzip -q /tmp/r3r4.zip -d /tmp/r3r4
      - name: Batch 1 - R3 admission control plane
        run: |
          python /tmp/r3r4/cemm_r3r4_followup_rebased_9d3c/batches/01_r3_admission.py "$GITHUB_WORKSPACE"
          git push origin HEAD:codex/hybrid-mvp-r2
      - name: Batch 2 - R4 build and review owner APIs
        run: |
          python /tmp/r3r4/cemm_r3r4_followup_rebased_9d3c/batches/02_r4_build_wiring.py "$GITHUB_WORKSPACE"
          git push origin HEAD:codex/hybrid-mvp-r2
      - name: Batch 3 - R4 admission integrity
        run: |
          python /tmp/r3r4/cemm_r3r4_followup_rebased_9d3c/batches/03_r4_admission_integrity.py "$GITHUB_WORKSPACE"
          git push origin HEAD:codex/hybrid-mvp-r2
      - name: Batch 4 - reconcile ABI registry
        run: |
          python /tmp/r3r4/cemm_r3r4_followup_rebased_9d3c/batches/04_abi_registry.py "$GITHUB_WORKSPACE"
          git push origin HEAD:codex/hybrid-mvp-r2
      - name: Remove temporary publisher
        run: |
          git rm .github/repair/rebased_part_*.txt .github/workflows/publish-r3-r4-followup-rebased.yml
          git commit -m 'chore: remove temporary rebased R3-R4 publisher'
          git push origin HEAD:codex/hybrid-mvp-r2
