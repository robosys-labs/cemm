name: R3 post-VERIFY close v2

on:
  push:
    branches: [codex/r3-r4-closeout-learning]
    paths: [.github/workflows/r3-postverify-close-v2.yml]

permissions:
  contents: write

jobs:
  close-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: hybrid_mvp/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r3-r4-closeout-learning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install R3 test dependencies
        run: python -m pip install 'pytest>=8' 'hypothesis>=6'
      - name: Apply literal R3 selector migration
        run: |
          python .github/r3_selector_patch.py
          git diff --check
      - name: Verify inventory and every R3 diagnostic tier
        working-directory: hybrid_mvp
        run: |
          python scripts/check_test_inventory.py --phase R3 --source-only
          python scripts/validate_mvp.py --tier owner --phase R3 --owner capability-effect
          python scripts/validate_mvp.py --tier owner --phase R3 --owner decision-query-proof
          python scripts/validate_mvp.py --tier owner --phase R3 --owner effect-learning-response
          python scripts/validate_mvp.py --tier owner --phase R3 --owner learning-response
          python scripts/validate_mvp.py --tier owner --phase R3 --owner situation-context
          python scripts/validate_mvp.py --tier phase --phase R3
      - name: Commit reviewed selector migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hybrid_mvp/configs/validation_gates.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'no selector migration produced'; exit 1; } || true
          git commit -m 'fix(r3): align gates with literal diagnostic inventory'
          git push origin HEAD:codex/r3-r4-closeout-learning
          test -z "$(git status --porcelain --untracked-files=all)"
