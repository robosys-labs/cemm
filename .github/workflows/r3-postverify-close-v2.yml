name: R3 post-VERIFY close v2

on:
  push:
    branches: [codex/r3-r4-closeout-learning]
    paths: [.github/workflows/r3-postverify-close-v2.yml]

permissions:
  contents: write

jobs:
  close-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: hybrid_mvp/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r3-r4-closeout-learning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install admission dependencies
        run: |
          python -m pip install 'pytest>=8' 'hypothesis>=6' 'numpy>=2' 'safetensors>=0.5'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify clean governance and predecessor
        working-directory: hybrid_mvp
        run: |
          python scripts/update_replay_status.py --verify-chain
          python scripts/check_test_inventory.py --phase R3 --source-only
          python scripts/validate_mvp.py --tier phase --phase R2
      - name: Reverify R3 diagnostic tiers on committed source
        working-directory: hybrid_mvp
        run: |
          python scripts/validate_mvp.py --tier owner --phase R3 --owner capability-effect
          python scripts/validate_mvp.py --tier owner --phase R3 --owner decision-query-proof
          python scripts/validate_mvp.py --tier owner --phase R3 --owner effect-learning-response
          python scripts/validate_mvp.py --tier owner --phase R3 --owner learning-response
          python scripts/validate_mvp.py --tier owner --phase R3 --owner situation-context
          python scripts/validate_mvp.py --tier phase --phase R3
      - name: Run R3 admission
        working-directory: hybrid_mvp
        run: |
          python scripts/validate_mvp.py --tier admission --phase R3 | tee /tmp/r3-admission.json
          python - <<'PY'
          import json
          outcome = json.load(open('/tmp/r3-admission.json', encoding='utf-8'))
          if outcome.get('disposition') != 'passed' or not outcome.get('run_ref'):
              raise SystemExit('R3 admission did not pass')
          print('R3_RUN_REF=' + outcome['run_ref'])
          print('R3_GATE_RESULT_REF=' + outcome['gate_result_ref'])
          PY
