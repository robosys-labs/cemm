name: R3 formal close

on:
  workflow_dispatch: {}
  push:
    branches: [codex/r3-r4-closeout-learning]
    paths: [.github/workflows/r3-postverify-close-v2.yml]

permissions:
  contents: write

jobs:
  close-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: hybrid_mvp/src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r3-r4-closeout-learning
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned admission dependencies
        run: |
          set -euo pipefail
          python -m pip install \
            'pytest==8.4.0' \
            'hypothesis==6.163.0' \
            'numpy==2.5.2' \
            'safetensors==0.5.3' \
            'fastapi==0.115.0' \
            'httpx==0.27.0'
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          import fastapi, httpx, hypothesis, numpy, pytest, safetensors, torch

          expected = {
              'pytest': '8.4.0',
              'hypothesis': '6.163.0',
              'numpy': '2.5.2',
              'safetensors': '0.5.3',
              'fastapi': '0.115.0',
              'httpx': '0.27.0',
              'torch': '2.6.0+cpu',
          }
          actual = {
              'pytest': pytest.__version__,
              'hypothesis': hypothesis.__version__,
              'numpy': numpy.__version__,
              'safetensors': safetensors.__version__,
              'fastapi': fastapi.__version__,
              'httpx': httpx.__version__,
              'torch': torch.__version__,
          }
          if actual != expected:
              raise SystemExit(f'admission dependency drift: expected={expected!r} actual={actual!r}')
          PY

      - name: Verify committed R3 hard cut and governance inputs
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          export PYTHONPATH=src:.
          python scripts/audit_r3_r4_legacy_tests.py --strict --output /tmp/r3-active-legacy-audit.json
          python scripts/check_test_inventory.py --phase R1 --source-only > /tmp/r1-inventory.json
          python scripts/check_test_inventory.py --phase R2 --source-only > /tmp/r2-inventory.json
          python scripts/check_test_inventory.py --phase R3 --source-only > /tmp/r3-inventory.json
          python scripts/verify_r3_r4_test_metadata.py
          python scripts/check_r3_r4_structure.py
          python -m compileall -q src scripts tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test -z "$(git status --porcelain)"

      - name: Prove R2 current owners and phase remain green
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          export PYTHONPATH=src:.
          python scripts/update_replay_status.py --verify-chain
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, 'src')
          sys.path.insert(0, 'scripts')
          from cemm_authoritative_hybrid import process_control as process_control_module
          sys.modules['process_control'] = process_control_module
          from validation_gate import run_validation

          root = Path('.').resolve()
          owners = (
              'exact-verifier',
              'expression-compiler',
              'form-context',
              'recursive-composer',
              'runtime-boundary',
          )
          for owner in owners:
              outcome = run_validation(root, phase='R2', tier='owner', owner=owner)
              print(json.dumps(outcome.to_dict(), sort_keys=True, separators=(',', ':')))
              if outcome.disposition != 'passed':
                  raise SystemExit(
                      f'R2 current owner gate failed: {owner}: '
                      f'{outcome.disposition} {outcome.error_code}'
                  )

          phase = run_validation(root, phase='R2', tier='phase')
          print(json.dumps(phase.to_dict(), sort_keys=True, separators=(',', ':')))
          if phase.disposition != 'passed':
              raise SystemExit(
                  f'R2 current phase gate failed: {phase.disposition} {phase.error_code}'
              )
          PY
          test -z "$(git status --porcelain)"

      - name: Replay full R2 admission on exact admitted R2 source
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/r2-baseline.env
          from __future__ import annotations

          import json
          from pathlib import Path
          import shlex

          root = Path('hybrid_mvp')
          records = [
              json.loads(line)
              for line in (root / 'governance' / 'replay_status.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          r2_green = [
              row for row in records
              if row.get('phase') == 'R2' and row.get('status') == 'green'
          ]
          if not r2_green:
              raise SystemExit('no governed green R2 record exists')
          row = max(r2_green, key=lambda item: int(item['sequence']))
          run_ref = row.get('run_ref')
          if type(run_ref) is not str or not run_ref.startswith('run:'):
              raise SystemExit(f'invalid governed R2 run ref: {run_ref!r}')
          receipt_path = root / 'artifacts' / 'validation' / 'runs' / f"{run_ref.split(':', 1)[1]}.json"
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          if receipt.get('phase') != 'R2' or receipt.get('tier') != 'admission':
              raise SystemExit('governed R2 receipt is not an R2 admission receipt')
          if receipt.get('overall_disposition') != 'passed':
              raise SystemExit('governed R2 receipt is not passed')
          source_ref = receipt.get('source_ref')
          if type(source_ref) is not str or len(source_ref) != 40:
              raise SystemExit(f'invalid governed R2 source ref: {source_ref!r}')
          print(f'R2_RUN_REF={shlex.quote(run_ref)}')
          print(f'R2_SOURCE_REF={shlex.quote(source_ref)}')
          PY
          source /tmp/r2-baseline.env
          printf 'Replaying governed %s at source %s\n' "$R2_RUN_REF" "$R2_SOURCE_REF"
          git cat-file -e "${R2_SOURCE_REF}^{commit}"
          git merge-base --is-ancestor "$R2_SOURCE_REF" HEAD
          rm -rf /tmp/cemm-r2-replay
          git worktree add --detach /tmp/cemm-r2-replay "$R2_SOURCE_REF"
          cleanup() {
            git worktree remove --force /tmp/cemm-r2-replay >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          (
            cd /tmp/cemm-r2-replay/hybrid_mvp
            export PYTHONPATH=src:.
            export PYTHONDONTWRITEBYTECODE=1
            python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, 'src')
          sys.path.insert(0, 'scripts')
          from cemm_authoritative_hybrid import process_control as process_control_module
          sys.modules['process_control'] = process_control_module
          from validation_gate import run_validation

          root = Path('.').resolve()
          outcome = run_validation(root, phase='R2', tier='admission')
          print(json.dumps(outcome.to_dict(), sort_keys=True, separators=(',', ':')))
          if outcome.disposition != 'passed' or not outcome.receipt_path:
              if outcome.receipt_path:
                  receipt = json.loads((root / outcome.receipt_path).read_text(encoding='utf-8'))
                  for step in receipt.get('step_results', []):
                      if step.get('disposition') != 'passed':
                          print(json.dumps({
                              'step_id': step.get('step_id'),
                              'disposition': step.get('disposition'),
                              'error_code': step.get('error_code'),
                              'report': step.get('report'),
                          }, sort_keys=True, separators=(',', ':')))
              raise SystemExit(
                  f'historical R2 admission replay failed: '
                  f'{outcome.disposition} {outcome.error_code}'
              )
          if outcome.source_ref != Path('.').resolve().parents[0].joinpath('.').resolve().name:
              pass
          PY
          )
          cleanup
          trap - EXIT
          test -z "$(git status --porcelain)"

      - name: Run R3 owner and phase gates
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          export PYTHONPATH=src:.
          python scripts/audit_r3_r4_legacy_tests.py --strict --output /tmp/r3-active-legacy-audit-committed.json
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, 'src')
          sys.path.insert(0, 'scripts')
          from cemm_authoritative_hybrid import process_control as process_control_module
          sys.modules['process_control'] = process_control_module
          from validation_gate import run_validation

          root = Path('.').resolve()
          owners = (
              'capability-effect',
              'decision-query-proof',
              'effect-learning-response',
              'learning-response',
              'situation-context',
          )
          for owner in owners:
              outcome = run_validation(root, phase='R3', tier='owner', owner=owner)
              print(json.dumps(outcome.to_dict(), sort_keys=True, separators=(',', ':')))
              if outcome.disposition != 'passed':
                  raise SystemExit(
                      f'R3 owner gate failed: {owner}: '
                      f'{outcome.disposition} {outcome.error_code}'
                  )

          phase = run_validation(root, phase='R3', tier='phase')
          print(json.dumps(phase.to_dict(), sort_keys=True, separators=(',', ':')))
          if phase.disposition != 'passed':
              raise SystemExit(f'R3 phase gate failed: {phase.disposition} {phase.error_code}')
          PY
          test -z "$(git status --porcelain)"

      - name: Run fresh R3 admission
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          export PYTHONPATH=src:.
          python - <<'PY' > /tmp/r3-outcome.json
          from pathlib import Path
          import json, sys

          sys.path.insert(0, 'src')
          sys.path.insert(0, 'scripts')
          from cemm_authoritative_hybrid import process_control as process_control_module
          sys.modules['process_control'] = process_control_module
          from validation_gate import run_validation

          outcome = run_validation(Path('.'), phase='R3', tier='admission')
          print(json.dumps(outcome.to_dict(), sort_keys=True, separators=(',', ':')))
          PY
          cat /tmp/r3-outcome.json
          python - <<'PY'
          from pathlib import Path
          import json

          outcome = json.loads(Path('/tmp/r3-outcome.json').read_text(encoding='utf-8'))
          receipt_path = outcome.get('receipt_path')
          if receipt_path:
              receipt = json.loads(Path(receipt_path).read_text(encoding='utf-8'))
              for step in receipt.get('step_results', []):
                  if step.get('disposition') == 'passed':
                      continue
                  observation = step.get('observation_report')
                  if isinstance(observation, dict):
                      observation = {
                          key: value
                          for key, value in observation.items()
                          if key in {
                              'schema', 'disposition', 'error_codes', 'errors',
                              'collection_errors', 'collection_mismatch', 'counts',
                              'selected_node_ids', 'expected_collected_node_ids',
                              'active_node_ids', 'exit_status'
                          }
                      }
                  print(json.dumps({
                      'step_id': step.get('step_id'),
                      'disposition': step.get('disposition'),
                      'error_code': step.get('error_code'),
                      'report': step.get('report'),
                      'observation_report': observation,
                  }, sort_keys=True, separators=(',', ':')))
          if (
              outcome.get('disposition') != 'passed'
              or not outcome.get('run_ref')
              or not outcome.get('receipt_path')
          ):
              raise SystemExit(
                  f"R3 admission did not pass: {outcome.get('disposition')} "
                  f"{outcome.get('error_code')}"
              )
          PY

      - name: Consume fresh R3 admission
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          export PYTHONPATH=src:.
          RUN_REF="$(python -c 'import json; print(json.load(open("/tmp/r3-outcome.json"))["run_ref"])')"
          python scripts/update_replay_status.py --phase R3 --status green --run-ref "$RUN_REF" --dry-run > /tmp/r3-candidate.json
          cat /tmp/r3-candidate.json
          RECORD_REF="$(python -c 'import json; print(json.load(open("/tmp/r3-candidate.json"))["record_ref"])')"
          python scripts/update_replay_status.py --phase R3 --status green --run-ref "$RUN_REF" --append --expect-record-ref "$RECORD_REF"
          python scripts/update_replay_status.py --verify-chain

      - name: Upload R3 admission diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-formal-close-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            /tmp/r2-baseline.env
            /tmp/r3-outcome.json
            /tmp/r3-candidate.json
            /tmp/r3-active-legacy-audit*.json
            /tmp/r*-inventory.json
            hybrid_mvp/artifacts/validation/runs/*.json

      - name: Commit exact R3 receipt and ledger transition
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hybrid_mvp/artifacts/validation/runs hybrid_mvp/governance/replay_status.jsonl
          git diff --cached --check
          git diff --cached --quiet && { echo 'R3 closeout produced no governed changes'; exit 1; }
          git commit -m 'admit(r3): consume fresh closure receipt'
          git push origin HEAD:codex/r3-r4-closeout-learning
          test -z "$(git status --porcelain)"
