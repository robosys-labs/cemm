name: R3 post-VERIFY close v2

on:
  push:
    branches: [codex/r3-r4-closeout-learning]
    paths: [.github/workflows/r3-postverify-close-v2.yml]

permissions:
  contents: write

jobs:
  close-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r3-r4-closeout-learning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Print exact admission governance error
        working-directory: hybrid_mvp
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys
          sys.path.insert(0, 'src')
          sys.path.insert(0, 'scripts')
          from cemm_authoritative_hybrid import process_control as process_control_module
          sys.modules['process_control'] = process_control_module
          from validation_gate import run_validation
          outcome = run_validation(Path('.'), phase='R3', tier='admission')
          governance = outcome.step_results[0]
          print('DISPOSITION=' + outcome.disposition)
          print('GOVERNANCE=' + json.dumps(governance.to_dict(), sort_keys=True, separators=(',', ':')))
          if outcome.receipt_path:
              path = Path(outcome.receipt_path)
              if path.exists():
                  print('RECEIPT=' + path.read_text(encoding='utf-8'))
          PY
