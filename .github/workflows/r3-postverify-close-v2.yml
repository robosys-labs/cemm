name: R3 post-VERIFY close v2

on:
  push:
    branches: [codex/r3-r4-closeout-learning]
    paths: [.github/workflows/r3-postverify-close-v2.yml]

permissions:
  contents: write

jobs:
  close-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r3-r4-closeout-learning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Enumerate exact R3 inventory roles
        working-directory: hybrid_mvp
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys
          sys.path.insert(0, 'scripts')
          from test_inventory_core import load_and_verify, verify_document_authority_pin
          root = Path('.').resolve()
          path = root / 'governance' / 'test_inventory.json'
          result = load_and_verify(
              root, path, phase='R3', enforce_reviewed_counts=True,
              expected_sha256=verify_document_authority_pin(root, path),
          )
          print('OWNER_GROUPS=' + json.dumps(
              {k: list(v) for k, v in result.owner_node_ids.items()},
              sort_keys=True, separators=(',', ':')
          ))
          print('PHASE_NODES=' + json.dumps(list(result.phase_node_ids), separators=(',', ':')))
          print('ADMISSION_ONLY=' + json.dumps(list(result.admission_only_node_ids), separators=(',', ':')))
          PY
