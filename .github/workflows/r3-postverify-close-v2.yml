name: R3 post-VERIFY close v2

on:
  push:
    branches: [codex/r3-r4-closeout-learning]
    paths: [.github/workflows/r3-postverify-close-v2.yml]

permissions:
  contents: read

jobs:
  diagnose-r3-active:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: hybrid_mvp/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r3-r4-closeout-learning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install admission dependencies
        run: |
          python -m pip install 'pytest>=8' 'hypothesis>=6' 'numpy>=2' 'safetensors>=0.5'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Print exact pytest-active report
        working-directory: hybrid_mvp
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys
          sys.path.insert(0, 'src')
          sys.path.insert(0, 'scripts')
          from cemm_authoritative_hybrid import process_control as process_control_module
          sys.modules['process_control'] = process_control_module
          from validation_gate import run_validation
          outcome = run_validation(Path('.'), phase='R3', tier='admission')
          print('OUTCOME=' + outcome.disposition)
          for step in outcome.step_results:
              if step.step_id == 'pytest_active':
                  material = step.to_dict()
                  print('PYTEST_ACTIVE=' + json.dumps(material, sort_keys=True, separators=(',', ':')))
                  report = material.get('report')
                  if isinstance(report, dict):
                      for key in ('errors','collection_errors','counts','disposition','error_codes'):
                          if key in report:
                              print(key.upper() + '=' + json.dumps(report[key], sort_keys=True, separators=(',', ':')))
          PY
