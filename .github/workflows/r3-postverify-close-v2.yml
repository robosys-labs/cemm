name: R3 post-VERIFY close v2

on:
  push:
    branches: [codex/r3-r4-closeout-learning]
    paths: [.github/workflows/r3-postverify-close-v2.yml]

permissions:
  contents: write

jobs:
  close-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: hybrid_mvp/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r3-r4-closeout-learning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install admission dependencies
        run: |
          python -m pip install 'pytest>=8' 'hypothesis>=6' 'numpy>=2' 'safetensors>=0.5'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify clean governance and predecessor
        working-directory: hybrid_mvp
        run: |
          python scripts/update_replay_status.py --verify-chain
          python scripts/check_test_inventory.py --phase R3 --source-only
          python scripts/validate_mvp.py --tier phase --phase R2
      - name: Run complete R3 admission
        working-directory: hybrid_mvp
        run: |
          python scripts/validate_mvp.py --tier admission --phase R3 | tee /tmp/r3-admission.json
          python - <<'PY'
          import json
          outcome = json.load(open('/tmp/r3-admission.json', encoding='utf-8'))
          if outcome.get('disposition') != 'passed' or not outcome.get('run_ref'):
              raise SystemExit('R3 admission did not pass')
          print('R3_RUN_REF=' + outcome['run_ref'])
          print('R3_GATE_RESULT_REF=' + outcome['gate_result_ref'])
          PY
      - name: Append governed R3 green transition
        working-directory: hybrid_mvp
        run: |
          RUN_REF="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/r3-admission.json', encoding='utf-8'))['run_ref'])
          PY
          )"
          python scripts/update_replay_status.py --phase R3 --status green --run-ref "$RUN_REF" --dry-run | tee /tmp/r3-status.json
          RECORD_REF="$(python - <<'PY'
          import json
          value=json.load(open('/tmp/r3-status.json', encoding='utf-8'))
          if not value.get('record_ref'):
              raise SystemExit('R3 dry-run did not produce record_ref')
          print(value['record_ref'])
          PY
          )"
          python scripts/update_replay_status.py --phase R3 --status green --run-ref "$RUN_REF" --expect-record-ref "$RECORD_REF" --append
          python scripts/update_replay_status.py --verify-chain
      - name: Commit R3 admission evidence and ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hybrid_mvp/artifacts/validation/runs hybrid_mvp/governance/replay_status.jsonl
          git diff --cached --check
          git diff --cached --quiet && { echo 'no R3 admission evidence to commit'; exit 1; } || true
          git commit -m 'chore(r3): record fresh governed admission'
          git push origin HEAD:codex/r3-r4-closeout-learning
