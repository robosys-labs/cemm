name: R3 post-VERIFY close v2

on:
  push:
    branches: [codex/r3-r4-closeout-learning]
    paths: [.github/workflows/r3-postverify-close-v2.yml]

permissions:
  contents: write

jobs:
  close-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: hybrid_mvp/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r3-r4-closeout-learning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install R3 test dependencies
        run: python -m pip install 'pytest>=8' 'hypothesis>=6'
      - name: Apply selector migration and retire obsolete phase assertion
        run: |
          python .github/r3_selector_patch.py
          python .github/r3_stale_phase_patch.py
          git diff --check
      - name: Verify literal inventory and R3 phase diagnostics
        working-directory: hybrid_mvp
        run: |
          python scripts/check_test_inventory.py --phase R3 --source-only
          pytest -q --tb=short \
            tests/test_r3_no_program_as_meaning.py \
            tests/test_r3_owner_structure.py \
            tests/test_r3_plan_contract.py \
            tests/test_r3_public_cycle.py \
            tests/test_r3_structure.py
      - name: Verify every R3 formal diagnostic tier
        working-directory: hybrid_mvp
        run: |
          python scripts/validate_mvp.py --tier owner --phase R3 --owner capability-effect
          python scripts/validate_mvp.py --tier owner --phase R3 --owner decision-query-proof
          python scripts/validate_mvp.py --tier owner --phase R3 --owner effect-learning-response
          python scripts/validate_mvp.py --tier owner --phase R3 --owner learning-response
          python scripts/validate_mvp.py --tier owner --phase R3 --owner situation-context
          python scripts/validate_mvp.py --tier phase --phase R3
      - name: Commit reviewed R3 test/gate migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            hybrid_mvp/configs/validation_gates.json \
            hybrid_mvp/tests/test_r3_no_program_as_meaning.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'no R3 migration changes produced'; exit 1; } || true
          git commit -m 'test(r3): retire stale pre-activation boundary and align gates'
          git push origin HEAD:codex/r3-r4-closeout-learning
          test -z "$(git status --porcelain --untracked-files=all)"
