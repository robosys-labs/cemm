name: R4 Task 4 feasibility publisher

on:
  push:
    branches:
      - codex/r4-task4-publication
    paths:
      - .github/workflows/r4-task4-publisher.yml

permissions:
  contents: write

concurrency:
  group: r4-task4-feasibility-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout authenticated publication payload
        uses: actions/checkout@v4
        with:
          ref: codex/r4-task4-publication
          fetch-depth: 0

      - name: Set up canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: hybrid_mvp/pyproject.toml

      - name: Preserve authenticated payloads
        shell: bash
        run: |
          set -euo pipefail
          cp .github/r4_task4_source_patch.gz.b64 /tmp/r4_task4_source_patch.gz.b64
          cp .github/r4_task4_publish.py.gz.b64 /tmp/r4_task4_publish.py.gz.b64

      - name: Checkout exact corrective target
        uses: actions/checkout@v4
        with:
          ref: codex/r4-partition-corrective-replay
          fetch-depth: 0
          clean: true

      - name: Execute exact Task 4 publication transaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          encoded = Path('/tmp/r4_task4_publish.py.gz.b64').read_bytes()
          canonical_encoded = b''.join(encoded.split()).rstrip(b'=')
          canonical_encoded += b'=' * (-len(canonical_encoded) % 4)
          raw = gzip.decompress(base64.b64decode(canonical_encoded, validate=True))
          observed = hashlib.sha256(raw).hexdigest()
          expected = 'd8fd599a45a0d18b1590b9425542d698933d424d73c92f7ec546b1205313fb81'
          if observed != expected:
              raise SystemExit(f'publisher SHA-256 mismatch: {observed}')
          Path('/tmp/r4_task4_publish.py').write_bytes(raw)
          PY
          python /tmp/r4_task4_publish.py
