name: R4 Task 4 feasibility publisher

on:
  push:
    branches:
      - codex/r4-task4-publication
    paths:
      - .github/workflows/r4-task4-publisher.yml

permissions:
  contents: write

concurrency:
  group: r4-task4-feasibility-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout authenticated publication payload
        uses: actions/checkout@v4
        with:
          ref: codex/r4-task4-publication
          fetch-depth: 0

      - name: Set up canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: hybrid_mvp/pyproject.toml

      - name: Preserve authenticated publisher chunks
        shell: bash
        run: |
          set -euo pipefail
          cp .github/r4-task4-publisher-v3/publisher.00 /tmp/r4_task4_publisher.00
          cp .github/r4-task4-publisher-v3/publisher.01 /tmp/r4_task4_publisher.01
          cp .github/r4-task4-publisher-v3/publisher.02 /tmp/r4_task4_publisher.02

      - name: Checkout exact corrective target
        uses: actions/checkout@v4
        with:
          ref: codex/r4-partition-corrective-replay
          fetch-depth: 0
          clean: true

      - name: Execute exact Task 4 publication transaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import lzma

          encoded = b''.join(
              Path(f'/tmp/r4_task4_publisher.{index:02d}').read_bytes()
              for index in range(3)
          )
          canonical_encoded = b''.join(encoded.split()).rstrip(b'=')
          canonical_encoded += b'=' * (-len(canonical_encoded) % 4)
          raw = lzma.decompress(
              base64.b64decode(canonical_encoded, validate=True),
              format=lzma.FORMAT_XZ,
          )
          observed = hashlib.sha256(raw).hexdigest()
          expected = '3266f335c069d331d069ecfe6b79aea680e65cd468ecd5955cf1675c02656726'
          if observed != expected:
              raise SystemExit(f'publisher SHA-256 mismatch: {observed}')
          Path('/tmp/r4_task4_publish.py').write_bytes(raw)
          PY
          python /tmp/r4_task4_publish.py
