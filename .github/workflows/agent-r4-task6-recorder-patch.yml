name: Agent R4 Task 6 recorder patch

on:
  push:
    branches:
      - agent/r4-export-checkout-20260816
    paths:
      - .github/workflows/agent-r4-task6-recorder-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-export-checkout-20260816
          fetch-depth: 0
      - name: Add self-reporting integration result
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/agent-r4-task6-integration.yml')
          text = path.read_text('utf-8')
          text = text.replace('permissions:\n  contents: read\n', 'permissions:\n  contents: write\n', 1)
          marker = '\n  record:\n'
          if marker not in text:
              text += '''\n\n  record:\n    if: always()\n    needs:\n      - historical-and-contracts\n      - candidate-ab-admission\n    runs-on: ubuntu-24.04\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: agent/r4-export-checkout-20260816\n          fetch-depth: 0\n      - name: Record parallel outcomes\n        env:\n          HISTORICAL_RESULT: ${{ needs.historical-and-contracts.result }}\n          CANDIDATE_RESULT: ${{ needs.candidate-ab-admission.result }}\n        run: |\n          set -euo pipefail\n          mkdir -p .github/r4-task6-status\n          printf '{"candidate":"%s","historical":"%s","workflow_sha":"%s"}\\n' \\\n            "$CANDIDATE_RESULT" "$HISTORICAL_RESULT" "$GITHUB_SHA" \\\n            > .github/r4-task6-status/integration.json\n          git config user.name 'github-actions[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git add -- .github/r4-task6-status/integration.json\n          git commit -m 'ci(r4): record Task 6 integration outcomes'\n          git push origin HEAD:refs/heads/agent/r4-export-checkout-20260816\n'''
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/agent-r4-task6-integration.yml
          git commit -m 'ci(r4): make Task 6 integration self-reporting'
          git push origin HEAD:refs/heads/agent/r4-export-checkout-20260816
