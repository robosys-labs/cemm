name: R4 Task 8 exact checkout export

on:
  pull_request:
    branches:
      - agent/r4-task7-structural-hardcut-ci-base-20260820
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/r4-task7-structural-hardcut-pr-head-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: robosys-labs/cemm
          ref: b8b180a1faac6e0f9460f8939dd1386859cb99aa
          fetch-depth: 0
          persist-credentials: false
      - name: Fence exported checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'b8b180a1faac6e0f9460f8939dd1386859cb99aa'
          test -z "$(git status --short --untracked-files=all)"
      - name: Build exact Hybrid MVP archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/cemm-task8-exact-checkout.tar.gz HEAD -- hybrid_mvp
          sha256sum /tmp/cemm-task8-exact-checkout.tar.gz | tee /tmp/cemm-task8-exact-checkout.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cemm-task8-exact-checkout-b8b180a1
          path: |
            /tmp/cemm-task8-exact-checkout.tar.gz
            /tmp/cemm-task8-exact-checkout.sha256
          if-no-files-found: error
          retention-days: 1
