name: R4 Task 8 selector candidate export

on:
  pull_request_target:
    branches:
      - agent/r4-task8-selector-final-ci-base-20260820
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/r4-task8-selector-final-candidate-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: robosys-labs/cemm
          ref: 4c247d7284014f06a2764510b448af675a4ecb07
          fetch-depth: 0
          persist-credentials: false
      - name: Fence and archive exact candidate checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '4c247d7284014f06a2764510b448af675a4ecb07'
          test "$(git rev-parse HEAD^)" = '8e09a87c14e167558834a1adf329d836ee75801a'
          test -z "$(git status --short --untracked-files=all)"
          tar -czf /tmp/cemm-r4-task8-selector-candidate.tar.gz .git hybrid_mvp
          sha256sum /tmp/cemm-r4-task8-selector-candidate.tar.gz > /tmp/cemm-r4-task8-selector-candidate.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cemm-r4-task8-selector-candidate-4c247d72
          path: |
            /tmp/cemm-r4-task8-selector-candidate.tar.gz
            /tmp/cemm-r4-task8-selector-candidate.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Publish inspectable run identity
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const branch = 'agent/r4-task8-selector-final-ci-base-20260820';
            const path = '.github/r4-task8-status/selector-candidate-export.json';
            const archiveLine = fs.readFileSync('/tmp/cemm-r4-task8-selector-candidate.sha256', 'utf8').trim();
            const payload = {
              schema: 'cemm-r4-task8-selector-candidate-export-v1',
              run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              candidate_sha: '4c247d7284014f06a2764510b448af675a4ecb07',
              parent_sha: '8e09a87c14e167558834a1adf329d836ee75801a',
              artifact_name: 'cemm-r4-task8-selector-candidate-4c247d72',
              archive_sha256: archiveLine.split(/\s+/)[0],
            };
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: 'ci(r4): record selector candidate export',
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              ...(sha ? {sha} : {}),
            });
