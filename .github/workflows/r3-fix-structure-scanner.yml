name: R3 fix structure scanner

on:
  push:
    branches: [codex/r3-r4-closeout-learning]
    paths: [.github/workflows/r3-fix-structure-scanner.yml]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r3-r4-closeout-learning
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Migrate scanner to exact Decision ABI owner
        working-directory: hybrid_mvp
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validation_gate.py')
          text = path.read_text(encoding='utf-8')
          old = 'if node.name == "DecisionEvaluator":'
          new = 'if node.name == "ExactDecisionEvaluator":'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale DecisionEvaluator scanner probe, found {text.count(old)}')
          if new in text:
              raise SystemExit('ExactDecisionEvaluator scanner probe already exists unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify R3 structure scanner and related contracts
        working-directory: hybrid_mvp
        env:
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, 'scripts')
          from validation_gate import _scan_r3_structure

          report = _scan_r3_structure(Path('.'))
          assert report['decision_owner'] == 'src/cemm_authoritative_hybrid/decision.py'
          assert report['runtime_owner'] == 'src/cemm_authoritative_hybrid/runtime.py'
          assert report['process_path'] == 'src/cemm_authoritative_hybrid/runtime.py:HybridRuntime.process'
          assert report['forbidden_match_count'] == 0
          print(report)
          PY
          python -m pytest -q \
            tests/test_r3_decision_abi.py \
            tests/test_r3_structure.py \
            tests/test_r3_plan_contract.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit exact scanner correction
        run: |
          set -euo pipefail
          rm -f .github/workflows/r3-fix-structure-scanner.yml
          git add -A
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          expected = {
              '.github/workflows/r3-fix-structure-scanner.yml',
              'hybrid_mvp/scripts/validation_gate.py',
          }
          if changed != expected:
              raise SystemExit(f'unexpected R3 structure-scanner diff: {sorted(changed)!r}')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(r3): align structure scanner with exact decision owner'
          git push origin HEAD:codex/r3-r4-closeout-learning

      - name: Dispatch formal R3 close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/r3-postverify-close-v2.yml/dispatches" \
            -f ref='codex/r3-r4-closeout-learning'
