[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cemm"
version = "0.2.0"
description = "CEMM canonical six-phase semantic foundation (structured response boundary)"
requires-python = ">=3.11"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "numpy>=2", "safetensors>=0.4", "jsonschema>=4.23"]

[project.scripts]
cemm = "cemm_authoritative_hybrid.foundation_cli:main"

[tool.setuptools]
package-dir = {"" = "hybrid_mvp/src"}

[tool.setuptools.packages.find]
where = ["hybrid_mvp/src"]
include = ["cemm_authoritative_hybrid*"]

[tool.pytest.ini_options]
testpaths = ["hybrid_mvp/tests"]
pythonpath = ["hybrid_mvp/src"]
addopts = "-q --strict-markers"
xfail_strict = true
