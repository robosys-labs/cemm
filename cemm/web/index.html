<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEMM v1 — Semantic Cognition Demo</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-2: #232734;
    --border: #2e3344;
    --text: #e4e7ef;
    --text-dim: #8b92a8;
    --accent: #6c8cff;
    --accent-dim: #3d5bd6;
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f87171;
    --radius: 10px;
    --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
    --sans: 'Inter', -apple-system, system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  header h1 span { color: var(--accent); }
  .header-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .badge.gen { color: var(--accent); }
  .badge.ok { color: var(--green); border-color: var(--green); }

  main {
    display: grid;
    grid-template-columns: 1fr 420px;
    flex: 1;
    overflow: hidden;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    #trace-panel { display: none; }
  }

  /* Chat area */
  #chat-area {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .turn {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.55;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .turn.user {
    align-self: flex-end;
    background: var(--accent-dim);
    color: white;
  }
  .turn.system {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .turn .speaker {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
    opacity: 0.7;
  }
  .turn .status-tag {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    margin-left: 8px;
    vertical-align: middle;
  }
  .status-ok { background: rgba(74,222,128,0.15); color: var(--green); }
  .status-frontier { background: rgba(251,191,36,0.15); color: var(--amber); }
  .status-learned { background: rgba(108,140,255,0.15); color: var(--accent); }
  .status-error { background: rgba(248,113,113,0.15); color: var(--red); }

  /* Input bar */
  #input-bar {
    padding: 14px 28px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .mode-selector {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border-radius: 8px;
    padding: 3px;
  }
  .mode-btn {
    padding: 7px 14px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
  }
  .mode-btn.active {
    background: var(--accent-dim);
    color: white;
  }
  #text-input {
    flex: 1;
    padding: 11px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.15s;
  }
  #text-input:focus { border-color: var(--accent); }
  #send-btn {
    padding: 11px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    font-family: var(--sans);
  }
  #send-btn:hover { opacity: 0.85; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Action buttons */
  #actions {
    display: flex;
    gap: 8px;
  }
  .action-btn {
    padding: 8px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
  }
  .action-btn:hover { color: var(--text); border-color: var(--accent); }

  /* Trace panel */
  #trace-panel {
    border-left: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    padding: 20px;
  }
  #trace-panel h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 14px;
  }
  .trace-section {
    margin-bottom: 20px;
  }
  .trace-section h3 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .trace-section pre {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    background: var(--bg);
    padding: 10px;
    border-radius: 6px;
    overflow-x: auto;
    color: var(--text-dim);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .fact-item {
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 10px;
    background: var(--bg);
    border-radius: 4px;
    margin-bottom: 4px;
    border-left: 2px solid var(--accent);
  }
  .fact-item .op { color: var(--accent); font-weight: 600; }
  .empty { color: var(--text-dim); font-style: italic; font-size: 12px; }

  /* Inspect modal */
  #inspect-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #inspect-overlay.show { display: flex; }
  #inspect-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 500px;
    width: 90%;
  }
  #inspect-box h2 { font-size: 16px; margin-bottom: 16px; }
  #inspect-box table { width: 100%; font-size: 13px; }
  #inspect-box td { padding: 4px 0; }
  #inspect-box td:last-child { text-align: right; font-family: var(--mono); color: var(--accent); }
  #inspect-box .close { margin-top: 16px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>CEMM <span>v1</span> Semantic Cognition</h1>
  <div class="header-meta">
    <span class="badge gen" id="gen-badge">gen —</span>
    <span class="badge ok" id="health-badge">connecting…</span>
    <button class="action-btn" onclick="reloadAuthority()">Reload</button>
    <button class="action-btn" onclick="showInspect()">Inspect</button>
  </div>
</header>

<main>
  <div id="chat-area">
    <div id="log"></div>
    <div id="input-bar">
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="ask" onclick="setMode('ask')">Ask</button>
        <button class="mode-btn" data-mode="learn" onclick="setMode('learn')">Learn</button>
        <button class="mode-btn" data-mode="teach" onclick="setMode('teach')">Teach</button>
      </div>
      <input id="text-input" type="text" placeholder="Type a message…" autocomplete="off"
             onkeydown="if(event.key==='Enter')send()">
      <button id="send-btn" onclick="send()">Send</button>
    </div>
  </div>

  <div id="trace-panel">
    <h2>Semantic Trace</h2>
    <div class="trace-section">
      <h3>Response</h3>
      <pre id="trace-response" class="empty">No interaction yet.</pre>
    </div>
    <div class="trace-section">
      <h3>Facts</h3>
      <div id="trace-facts" class="empty">No facts.</div>
    </div>
    <div class="trace-section">
      <h3>Self State</h3>
      <pre id="trace-selfstate" class="empty">—</pre>
    </div>
    <div class="trace-section">
      <h3>Realization Proof</h3>
      <pre id="trace-proof" class="empty">—</pre>
    </div>
    <div class="trace-section">
      <h3>Full JSON</h3>
      <pre id="trace-full" class="empty">—</pre>
    </div>
  </div>
</main>

<div id="inspect-overlay" onclick="if(event.target===this)hideInspect()">
  <div id="inspect-box">
    <h2>Store Inspection</h2>
    <div id="inspect-content">Loading…</div>
    <div class="close"><button class="action-btn" onclick="hideInspect()">Close</button></div>
  </div>
</div>

<script>
let mode = 'ask';
const log = document.getElementById('log');
const input = document.getElementById('text-input');
const sendBtn = document.getElementById('send-btn');

// ---- Health check on load ----
(async () => {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    document.getElementById('health-badge').textContent = 'online';
    document.getElementById('gen-badge').textContent = 'gen ' + d.authority_generation;
  } catch (e) {
    document.getElementById('health-badge').textContent = 'offline';
    document.getElementById('health-badge').className = 'badge';
    document.getElementById('health-badge').style.color = 'var(--red)';
  }
})();

// ---- Mode selection ----
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
  });
  const ph = { ask: 'Ask a question…', learn: 'State a fact to learn…', teach: 'Teach a definition…' };
  input.placeholder = ph[m] || 'Type a message…';
}

// ---- Send message ----
async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addTurn('user', text);
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text, mode }),
    });
    const d = await r.json();
    addTurn('system', d.response || '[no output]', d.status);
    updateTrace(d);
  } catch (e) {
    addTurn('system', 'Error: ' + e.message, 'error');
  }
  sendBtn.disabled = false;
  input.focus();
}

// ---- Add turn to log ----
function addTurn(speaker, text, status) {
  const div = document.createElement('div');
  div.className = 'turn ' + (speaker === 'user' ? 'user' : 'system');
  const sp = document.createElement('div');
  sp.className = 'speaker';
  sp.textContent = speaker;
  if (status) {
    const tag = document.createElement('span');
    tag.className = 'status-tag status-' + status;
    tag.textContent = status;
    sp.appendChild(tag);
  }
  div.appendChild(sp);
  div.appendChild(document.createTextNode(text));
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ---- Update trace panel ----
function updateTrace(d) {
  document.getElementById('trace-response').textContent = d.response || '—';
  document.getElementById('trace-response').classList.remove('empty');

  const factsDiv = document.getElementById('trace-facts');
  factsDiv.innerHTML = '';
  if (d.facts && d.facts.length) {
    d.facts.forEach(f => {
      const item = document.createElement('div');
      item.className = 'fact-item';
      const args = Object.entries(f.args || {})
        .map(([k, v]) => `${k}=${v}`).join(', ');
      item.innerHTML = `<span class="op">${f.operator}</span>(${args})`;
      factsDiv.appendChild(item);
    });
  } else {
    factsDiv.className = 'empty';
    factsDiv.textContent = 'No facts.';
  }

  document.getElementById('trace-selfstate').textContent =
    JSON.stringify(d.self_state, null, 2);
  document.getElementById('trace-selfstate').classList.remove('empty');

  document.getElementById('trace-proof').textContent =
    d.realization_proof ? JSON.stringify(d.realization_proof, null, 2) : '—';
  document.getElementById('trace-proof').classList.remove('empty');

  document.getElementById('trace-full').textContent =
    JSON.stringify(d, null, 2);
  document.getElementById('trace-full').classList.remove('empty');
}

// ---- Reload authority ----
async function reloadAuthority() {
  try {
    const r = await fetch('/api/reload', { method: 'POST' });
    const d = await r.json();
    document.getElementById('gen-badge').textContent = 'gen ' + d.authority_generation;
    addTurn('system', 'Authority reloaded to generation ' + d.authority_generation + '.', 'ok');
  } catch (e) {
    addTurn('system', 'Reload error: ' + e.message, 'error');
  }
}

// ---- Inspect ----
async function showInspect() {
  document.getElementById('inspect-overlay').classList.add('show');
  document.getElementById('inspect-content').textContent = 'Loading…';
  try {
    const r = await fetch('/api/inspect');
    const d = await r.json();
    let html = '<table>';
    html += `<tr><td>Generation</td><td>${d.generation}</td></tr>`;
    html += `<tr><td>Authority Hash</td><td>${d.authority_hash}…</td></tr>`;
    html += `<tr><td colspan="2" style="padding-top:12px;font-weight:600">Table Row Counts</td></tr>`;
    for (const [t, c] of Object.entries(d.table_counts)) {
      html += `<tr><td>${t}</td><td>${c}</td></tr>`;
    }
    html += '</table>';
    document.getElementById('inspect-content').innerHTML = html;
  } catch (e) {
    document.getElementById('inspect-content').textContent = 'Error: ' + e.message;
  }
}
function hideInspect() {
  document.getElementById('inspect-overlay').classList.remove('show');
}

input.focus();
</script>
</body>
</html>
